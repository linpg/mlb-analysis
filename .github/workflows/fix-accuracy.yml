name: Fix accuracy summary
on:
  push:
    paths:
      - '.github/workflows/fix-accuracy.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function updateAccuracy(g,p){\n  // 僅將已保存的賽前預測與完賽結果配對，不重新產生歷史預測。\n  settlePredictionRecord(g);\n}\nfunction accuracySummary(){\n  const date=selectedDate;\n  const all=loadPredictionRecords().filter(x=>x.selectedDate===date && x.settled);\n  const scored=all.filter(x=>Number.isFinite(x.awayError)&&Number.isFinite(x.homeError));\n  const wins=all.filter(x=>x.winnerHit).length;\n  const misses=all.length-wins;\n  const teamPct=all.length?wins/all.length*100:null;\n  const scoreMAE=scored.length?scored.reduce((s,x)=>s+((x.awayError+x.homeError)/2),0)/scored.length:null;\n  // 將每隊平均比分誤差換算成 0~100 的可讀指標；誤差每增加 1 分，準確度下降 10 個百分點。\n  const scorePct=scoreMAE==null?null:Math.max(0,Math.min(100,100-scoreMAE*10));\n  const finalGamesToday=[...new Set(all.map(x=>x.gamePk))].length;\n  const storedToday=loadPredictionRecords().filter(x=>x.selectedDate===date);\n  const unscoredFinal=storedToday.filter(x=>x.settled===false).length;\n  return {n:all.length,wins,misses,teamPct,scorePct,scoredN:scored.length,storedN:storedToday.length,unscoredFinal};\n}\nfunction accuracyHTML(){\n  const a=accuracySummary();\n  const f=v=>v==null?\"-\":`${v.toFixed(1)}%`;\n  if(a.n===0)return \"\";\n  return `<div class=\"accuracy-box\"><div class=\"section-title\">📊 當日模型預測準確度 <span class=\"phase-tag\">${MODEL_VERSION}</span></div>\n  <div class=\"accuracy-grid\">\n    <div class=\"accuracy-item\"><span class=\"muted\">🏆 預測隊伍準確率</span><b>${f(a.teamPct)}</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">⚾ 預測得分準確度</span><b>${f(a.scorePct)}</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">預測正確</span><b>${a.wins} 場</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">預測錯誤</span><b>${a.misses} 場</b></div>\n  </div>\n  </div>`;\n}\n'''
          new='''function updateAccuracy(g,p){\n  // 僅依「勝負分析命中／未命中」結算，不把預測比分誤差混入勝負準確度。\n  settlePredictionRecord(g);\n}\nfunction accuracySummary(){\n  const date=selectedDate;\n  const all=loadPredictionRecords().filter(x=>x.selectedDate===date && x.settled && (x.winnerHit===true || x.winnerHit===false));\n  const wins=all.filter(x=>x.winnerHit===true).length;\n  const misses=all.filter(x=>x.winnerHit===false).length;\n  const n=wins+misses;\n  const teamPct=n?wins/n*100:null;\n  return {n,wins,misses,teamPct};\n}\nfunction accuracyHTML(){\n  const a=accuracySummary();\n  const f=v=>v==null?\"-\":`${v.toFixed(1)}%`;\n  if(a.n===0)return \"\";\n  return `<div class=\"accuracy-box\"><div class=\"section-title\">📊 當日模型預測準確度 <span class=\"phase-tag\">${MODEL_VERSION}</span></div>\n  <div class=\"accuracy-grid\">\n    <div class=\"accuracy-item\"><span class=\"muted\">🏆 勝負分析準確率</span><b>${f(a.teamPct)}</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">預測正確</span><b>${a.wins} 場</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">預測錯誤</span><b>${a.misses} 場</b></div>\n    <div class=\"accuracy-item\"><span class=\"muted\">已結算</span><b>${a.n} 場</b></div>\n  </div>\n  <div class=\"accuracy-note\">只統計各場「勝負分析」顯示為 ✓ 勝負分析命中 或 ✕ 勝負分析未命中 的已結束比賽；預測比分不計入此準確率。</div>\n  </div>`;\n}\n'''
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          old2='''    savePredictionRecord({\n      gamePk:g.gamePk,'''
          # settlement must run after the prediction record has been saved
          marker='''    settled:false\n  });\n}\n  let ls=live?.[g.gamePk]'''
          repl='''    settled:false\n  });\n  // Final 比賽立即依實際終場比分結算，讓上方準確度與場內徽章一致。\n  settlePredictionRecord(g);\n}\n  let ls=live?.[g.gamePk]'''
          if marker not in s:
              raise SystemExit('settlement insertion target not found')
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: count daily accuracy from win analysis badges' || true
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-accuracy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-accuracy.yml
          git commit -m 'chore: remove temporary accuracy workflow' || true
          git push
