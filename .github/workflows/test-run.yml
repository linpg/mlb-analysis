name: Patch official MLB model

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='document.getElementById("prev").onclick=()=>{selectedDate=addDays(selectedDate,-1);load()};'
          if 'MLB_OFFICIAL_MODEL_DATA_V5' in s:
              print('already patched')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('marker not found')
          patch=base64.b64decode('','base64').decode()
          p.write_text(s.replace(marker,patch+marker,1),encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add verified MLB official model inputs' || exit 0
          git push
