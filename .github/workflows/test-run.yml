name: Patch official MLB model

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='document.getElementById("prev").onclick=()=>{selectedDate=addDays(selectedDate,-1);load()};'
          if 'MLB_OFFICIAL_MODEL_DATA_V4' in s:
              print('already patched')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('marker not found')
          patch=r'''/* MLB_OFFICIAL_MODEL_DATA_V4: verified MLB Stats API enhancement; existing model functions are preserved. */
(function(){
  const originalTeamStats=window.teamStats;
  const originalRecentTeamStats=window.recentTeamStats;
  const originalBuild=window.buildOfficialPredictionModel;
  const splitCache=new Map();
  const contextCache=new Map();
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  async function api(url){try{return await json(url,12000)}catch(e){return null}}
  async function officialSplits(id){
    const season=Number(String(selectedDate).slice(0,4))||new Date().getFullYear();
    const key=`official-v4-splits-${id}-${season}`;
    if(splitCache.has(key))return splitCache.get(key);
    const [r,l]=await Promise.all([
      api(`${MLB_API}/teams/${id}/stats?stats=statSplits&group=hitting&season=${season}&sitCodes=vr`),
      api(`${MLB_API}/teams/${id}/stats?stats=statSplits&group=hitting&season=${season}&sitCodes=vl`)
    ]);
    const pick=d=>d?.stats?.[0]?.splits?.[0]?.stat||null;
    const rs=pick(r),ls=pick(l);
    const out={vsRHP:{avg:num(rs?.avg),obp:num(rs?.obp),slg:num(rs?.slg),ops:num(rs?.ops)},vsLHP:{avg:num(ls?.avg),obp:num(ls?.obp),slg:num(ls?.slg),ops:num(ls?.ops)},source:'MLB Stats API statSplits'};
    splitCache.set(key,out);return out;
  }
  async function officialContext(id){
    const key=`official-v4-context-${id}-${selectedDate}`;
    if(contextCache.has(key))return contextCache.get(key);
    const end=addDays(selectedDate,-1),begin=addDays(end,-35);
    const d=await api(`${MLB_API}/schedule?sportId=1&teamId=${id}&startDate=${begin}&endDate=${end}&hydrate=team`);
    const games=(d?.dates||[]).flatMap(x=>x.games||[]).filter(g=>g.status?.abstractGameState==='Final').sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate)).slice(0,10);
    let rf=0,ra=0,w=0,n=0;
    for(const g of games){
      const home=Number(g.teams?.home?.team?.id)===Number(id);
      const own=num(home?g.teams?.home?.score:g.teams?.away?.score);
      const opp=num(home?g.teams?.away?.score:g.teams?.home?.score);
      if(own!=null&&opp!=null){rf+=own;ra+=opp;if(own>opp)w++;n++;}
    }
    const last=games[0]?.gameDate?new Date(games[0].gameDate):null;
    const today=new Date(`${selectedDate}T00:00:00+08:00`);
    const restDays=last?Math.max(0,Math.floor((today-last)/86400000)-1):null;
    const out={last10RunDiff:n?(rf-ra)/n:null,last10WinPct:n?w/n:null,restDays,gamesConsidered:n,source:'MLB Stats API Schedule'};
    contextCache.set(key,out);return out;
  }
  window.teamStats=async function(id){const base=await originalTeamStats(id);return {...base,officialSplits:await officialSplits(id)};};
  window.recentTeamStats=async function(id){const base=await originalRecentTeamStats(id);return {...base,officialContext:await officialContext(id)};};
  window.buildOfficialPredictionModel=function(args){
    const model=originalBuild(args);
    const A=args.awayStats||{},H=args.homeStats||{},AR=args.awayRecent?.officialContext||{},HR=args.homeRecent?.officialContext||{};
    const splitFactor=t=>{const r=num(t.officialSplits?.vsRHP?.ops),l=num(t.officialSplits?.vsLHP?.ops);if(r==null&&l==null)return 1;const ops=r!=null&&l!=null?(r+l)/2:(r??l);return clamp(1+(ops-0.750)*0.12,0.97,1.03);};
    const contextFactor=c=>{let f=1;const diff=num(c.last10RunDiff),rest=num(c.restDays);if(diff!=null)f*=clamp(1+diff*0.006,0.97,1.03);if(rest!=null&&rest<=0)f*=0.99;else if(rest!=null&&rest>=3)f*=1.006;return f;};
    model.awayStrength*=splitFactor(A)*contextFactor(AR);model.homeStrength*=splitFactor(H)*contextFactor(HR);
    const totalStrength=model.awayStrength+model.homeStrength;
    if(totalStrength>0){const p=model.awayStrength/totalStrength;model.awayWin=clamp(0.5+(p-0.5)*0.92,0.05,0.95);model.homeWin=1-model.awayWin;}
    model.awayRuns=clamp(model.awayRuns*splitFactor(A)*contextFactor(AR),1.5,9);model.homeRuns=clamp(model.homeRuns*splitFactor(H)*contextFactor(HR),1.5,9);model.totalRuns=model.awayRuns+model.homeRuns;
    model.officialEnhancement={away:{vsRHP:A.officialSplits?.vsRHP?.ops??null,vsLHP:A.officialSplits?.vsLHP?.ops??null,runDiff10:AR.last10RunDiff,winPct10:AR.last10WinPct,restDays:AR.restDays},home:{vsRHP:H.officialSplits?.vsRHP?.ops??null,vsLHP:H.officialSplits?.vsLHP?.ops??null,runDiff10:HR.last10RunDiff,winPct10:HR.last10WinPct,restDays:HR.restDays},source:'MLB Stats API / Schedule'};
    return model;
  };
})();
'''
          p.write_text(s.replace(marker,patch+marker,1),encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add verified MLB official model inputs' || exit 0
          git push
