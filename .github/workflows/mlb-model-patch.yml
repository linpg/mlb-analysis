name: MLB model patch
on:
  push:
    paths:
      - '.github/workflows/mlb-model-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'MLB model patch') && !contains(github.event.head_commit.message, 'Remove temporary MLB model patch workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const PS="https://www.playsport.cc/livescore/1";\nconst PSP="https://www.playsport.cc/predict/scale?allianceid=1&gametime=";\nconst LS=["https://ls6.playsport.cc","https://ls7.playsport.cc"];\n', '')
          s = s.replace('const MODEL_VERSION="V2.0";', 'const MODEL_VERSION="V3.0";')
          new_pitcher_block = r'''async function pitcher(id){
  if(!id)return null;
  const key=`pitcher-${id}-${new Date().getFullYear()}`;
  if(playerCache.has(key))return playerCache.get(key);
  const season=new Date().getFullYear();
  const [basicD,advD,logD]=await Promise.all([
    json(`${MLB_API}/people/${id}/stats?stats=season&group=pitching&season=${season}`).catch(()=>null),
    json(`${MLB_API}/people/${id}/stats?stats=seasonAdvanced&group=pitching&season=${season}`).catch(()=>null),
    json(`${MLB_API}/people/${id}/stats?stats=gameLog&group=pitching&gameType=R&season=${season}`).catch(()=>null)
  ]);
  const basic=basicD?.stats?.[0]?.splits?.[0]?.stat||{};
  const adv=advD?.stats?.[0]?.splits?.[0]?.stat||{};
  const s={...basic,...adv};
  const logs=(logD?.stats||[]).flatMap(x=>x.splits||[]).filter(x=>Number(x.stat?.gamesStarted||0)>0).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,10);
  let ip=0,er=0,h=0,bb=0,so=0,starts=0;
  for(const x of logs){const st=x.stat||{};ip+=Number(st.inningsPitched)||0;er+=Number(st.earnedRuns)||0;h+=Number(st.hits)||0;bb+=Number(st.baseOnBalls)||0;so+=Number(st.strikeOuts)||0;starts++;}
  const recent=starts===10&&ip>0?{starts:10,ip,era:er*9/ip,whip:(h+bb)/ip,k9:so*9/ip,bb9:bb*9/ip}:{starts,ip:null,era:null,whip:null,k9:null,bb9:null};
  const p={id,fullName:s.fullName||s.player?.fullName||null,era:s.era??null,wins:s.wins??null,losses:s.losses??null,avg:s.avg??null,whip:s.whip??null,so:s.strikeOuts??null,fip:s.fip??s.fipMinus??null,k9:s.strikeoutsPer9Inn??s.kPer9??null,bb9:s.walksPer9Inn??s.bbPer9??null,inningsPitched:s.inningsPitched??null,homeRuns:s.homeRuns??null,baseOnBalls:s.baseOnBalls??null,recent};
  playerCache.set(key,p);return p;
}
const parkFactorCache=new Map();
async function loadParkFactors(){
  const season=new Date().getFullYear(),key=`pf-${season}`;
  if(parkFactorCache.has(key))return parkFactorCache.get(key);
  const map=new Map();
  try{const u=`https://baseballsavant.mlb.com/leaderboard/statcast-park-factors?type=year&year=${season}&batSide=&stat=index_wOBA&condition=All&rolling=3&parks=mlb`;const html=await fetch(u).then(r=>r.ok?r.text():'');const m=html.match(/data\s*=\s*(\[[\s\S]*?\]);/);if(m){for(const r of JSON.parse(m[1])){const n=String(r.venue_name||r.venueName||r.venue||'').trim();const pf=Number(r.index_wOBA??r.index_woba??r.park_factor??r.parkFactor);if(n&&Number.isFinite(pf))map.set(n.toLowerCase(),pf);}}}catch(e){}
