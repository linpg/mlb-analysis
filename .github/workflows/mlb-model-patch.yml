  const splitA=g.__model?.awaySplit,splitH=g.__model?.homeSplit;
  const seasonRunA=Number(splitA?.runs??((Number(aStats?.runs)||0)/(Number(aStats?.games)||162))),seasonRunH=Number(splitH?.runs??((Number(hStats?.runs)||0)/(Number(hStats?.games)||162)));
  const baseA=Number.isFinite(Number(aRecent?.runs))&&Number.isFinite(seasonRunA)?seasonRunA*.58+Number(aRecent.runs)*.42:(Number.isFinite(seasonRunA)?seasonRunA:Number(aRecent?.runs));
  const baseH=Number.isFinite(Number(hRecent?.runs))&&Number.isFinite(seasonRunH)?seasonRunH*.58+Number(hRecent.runs)*.42:(Number.isFinite(seasonRunH)?seasonRunH:Number(hRecent?.runs));
  const starterFactor=p=>{if(!p)return 1;const se=Number(p.era),sw=Number(p.whip),re=Number(p.recent?.era),rw=Number(p.recent?.whip),era=Number.isFinite(re)?se*.65+re*.35:se,whip=Number.isFinite(rw)&&Number.isFinite(sw)?sw*.65+rw*.35:sw;let f=1;if(Number.isFinite(era))f+=(4.2-era)*.055;if(Number.isFinite(whip))f+=(1.3-whip)*.08;return Math.max(.76,Math.min(1.24,f));};
  const bullFactor=b=>Number.isFinite(Number(b?.era))?Math.max(.91,Math.min(1.09,1+(4.1-Number(b.era))*.035)):1,sFA=starterFactor(hp),sFH=starterFactor(ap),bFA=bullFactor(hBull),bFH=bullFactor(aBull);
  if(hp?.era!=null)reasons.push(`主隊對手先發 ${hp.fullName||'投手'}：本季 ERA ${Number(hp.era).toFixed(2)}，近10次先發 ERA ${Number.isFinite(Number(hp.recent?.era))?Number(hp.recent.era).toFixed(2):'資料不足'}`);
  if(ap?.era!=null)reasons.push(`客隊對手先發 ${ap.fullName||'投手'}：本季 ERA ${Number(ap.era).toFixed(2)}，近10次先發 ERA ${Number.isFinite(Number(ap.recent?.era))?Number(ap.recent.era).toFixed(2):'資料不足'}`);
  let env=1,envNotes=[];if(Number.isFinite(Number(park?.factor))){env*=Math.max(.95,Math.min(1.05,1+(Number(park.factor)-100)/100*.35));envNotes.push(`球場 Park Factor ${park.factor}`)}if(Number.isFinite(Number(weather?.temp))){env*=1+Math.max(-.03,Math.min(.03,(Number(weather.temp)-70)/10*.01));envNotes.push(`溫度 ${weather.temp}°F`)}if(!weather?.roofClosed){const wind=Number(weather?.wind),wt=String(weather?.windText||'').toLowerCase();if(Number.isFinite(wind)&&wind>=8){if(/out\s*to/.test(wt)){env*=1+Math.min(.035,wind*.0018);envNotes.push(`風 ${wind} mph 吹出`)}else if(/in\s*from/.test(wt)){env*=1-Math.min(.035,wind*.0018);envNotes.push(`風 ${wind} mph 吹入`)}else if(/left\s*to\s*right|right\s*to\s*left|across/.test(wt)){env*=1+Math.min(.012,wind*.0005);envNotes.push(`橫風 ${wind} mph`)}}}
