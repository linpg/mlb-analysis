  const predA=Math.max(.1,baseA*lineupFactorA*sFA*bFA*env),predH=Math.max(.1,baseH*lineupFactorH*sFH*bFH*env),total=predA+predH,winnerSide=predA>predH?'away':predH>predA?'home':'tie',awayLabel=teamNames[code(g.teams.away)]||g.teams.away.team?.name||'客隊',homeLabel=teamNames[code(g.teams.home)]||g.teams.home.team?.name||'主隊',winner=winnerSide==='away'?`${awayLabel}較優`:winnerSide==='home'?`${homeLabel}較優`:'勝負五五開';
