  const lineupFactorA=Number.isFinite(la)&&Number.isFinite(contextOpsA)?Math.max(.88,Math.min(1.14,1+(la-contextOpsA)*.85)):1,lineupFactorH=Number.isFinite(lh)&&Number.isFinite(contextOpsH)?Math.max(.88,Math.min(1.14,1+(lh-contextOpsH)*.85)):1;
  if(Number.isFinite(la))reasons.push(`客隊今日先發打線綜合 OPS ${la.toFixed(3)}（本季＋近10場＋對${hp?.pitchHand?.code==='L'?'左投':'右投'} split）`);
