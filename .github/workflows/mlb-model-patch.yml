async function getParkFactor(venueName){const map=await loadParkFactors();const key=String(venueName||'').toLowerCase();if(map.has(key))return map.get(key);for(const [n,v] of map){if(key.includes(n)||n.includes(key))return v;}return null;}
async function teamSplitStats(id,sitCode){
  const key=`teamSplit-${id}-${sitCode}-${new Date().getFullYear()}`;if(teamCache.has(key))return teamCache.get(key);const season=new Date().getFullYear();const d=await json(`${MLB_API}/teams/${id}/stats?stats=statSplits&group=hitting&gameType=R&sitCodes=${sitCode}&season=${season}`).catch(()=>null);const st=d?.stats?.[0]?.splits?.[0]?.stat||{};const games=Number(st.gamesPlayed)||0,runs=Number(st.runs);const v={games,runs:Number.isFinite(runs)&&games>0?runs/games:null,avg:st.avg??null,ops:st.ops??null,source:'MLB 官方主/客場 split'};teamCache.set(key,v);return v;
}
function statRate(st){if(!st)return null;const obp=Number(st.obp),slg=Number(st.slg),ops=Number(st.ops);return Number.isFinite(ops)?ops:(Number.isFinite(obp)&&Number.isFinite(slg)?obp+slg:null);}
function aggregateHittingLogs(logs){let ab=0,h=0,bb=0,hbp=0,sf=0,d2=0,d3=0,hr=0,r=0,tb=0,pa=0,games=0;for(const x of logs){const st=x.stat||{},xab=Number(st.atBats)||0,xh=Number(st.hits)||0;ab+=xab;h+=xh;bb+=Number(st.baseOnBalls)||0;hbp+=Number(st.hitByPitch)||0;sf+=Number(st.sacFlies)||0;d2+=Number(st.doubles)||0;d3+=Number(st.triples)||0;hr+=Number(st.homeRuns)||0;r+=Number(st.runs)||0;tb+=Number(st.totalBases)||((xh-Number(st.doubles||0)-Number(st.triples||0)-Number(st.homeRuns||0))+2*Number(st.doubles||0)+3*Number(st.triples||0)+4*Number(st.homeRuns||0));pa+=Number(st.plateAppearances)||0;if(xab>0||Number(st.plateAppearances)>0)games++;}if(ab<=0)return{games,avg:null,ops:null,obp:null,slg:null,runs:null,pa};const obpDen=ab+bb+hbp+sf,obp=obpDen>0?(h+bb+hbp)/obpDen:null,slg=tb/ab;return{games,avg:h/ab,ops:obp!=null?obp+slg:null,obp,slg,runs:games>0?r/games:null,pa};}
async function hitterProfile(id,pitcherHand){
  if(!id)return null;const hand=(pitcherHand||'').toUpperCase().startsWith('L')?'L':'R',key=`hitter-${id}-${hand}-${new Date().getFullYear()}`;if(playerCache.has(key))return playerCache.get(key);const season=new Date().getFullYear();const [seasonD,splitD,logD]=await Promise.all([json(`${MLB_API}/people/${id}/stats?stats=season&group=hitting&gameType=R&season=${season}`).catch(()=>null),json(`${MLB_API}/people/${id}/stats?stats=statSplits&group=hitting&gameType=R&sitCodes=vl,vr&season=${season}`).catch(()=>null),json(`${MLB_API}/people/${id}/stats?stats=gameLog&group=hitting&gameType=R&season=${season}`).catch(()=>null)]);const seasonStat=seasonD?.stats?.[0]?.splits?.[0]?.stat||{};const splits=(splitD?.stats||[]).flatMap(x=>x.splits||[]);const splitRow=splits.find(x=>String(x.situation?.code||x.split?.code||x.sitCode||'').toLowerCase()===`v${hand.toLowerCase()}`)||splits.find(x=>String(x.situation?.displayName||x.split?.displayName||'').toLowerCase().includes(hand==='L'?'left':'right'));const splitStat=splitRow?.stat||{};const logs=(logD?.stats||[]).flatMap(x=>x.splits||[]).filter(x=>Number(x.stat?.plateAppearances||0)>0||Number(x.stat?.atBats||0)>0).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,10);const recent=aggregateHittingLogs(logs);const v={id,fullName:seasonStat.fullName||null,season:{ops:statRate(seasonStat),avg:Number(seasonStat.avg),obp:Number(seasonStat.obp),slg:Number(seasonStat.slg),pa:Number(seasonStat.plateAppearances)||0},split:{ops:statRate(splitStat),avg:Number(splitStat.avg),obp:Number(splitStat.obp),slg:Number(splitStat.slg),pa:Number(splitStat.plateAppearances)||0,hand},recent,completeRecent:recent.games>=8,completeSplit:statRate(splitStat)!=null};playerCache.set(key,v);return v;
}
async function lineupData(feedData,side,pitcherHand){const box=feedData?.liveData?.boxscore?.teams?.[side];if(!box?.players)return{announced:false,players:[],count:0};const ids=(box.battingOrder||box.batters||[]).map(Number).filter(Boolean),ordered=ids.length?ids:Object.values(box.players).map(x=>Number(x.person?.id)).filter(Boolean),rows=[],seen=new Set();for(const id of ordered){if(seen.has(id))continue;const pl=box.players[String(id)];if(!pl)continue;const bo=Number(pl.battingOrder);if(!Number.isFinite(bo)||bo<100||bo>900)continue;const slot=Math.floor(bo/100);if(slot<1||slot>9||seen.has(slot))continue;seen.add(slot);rows.push({slot,playerId:id,name:pl.person?.fullName||pl.person?.boxscoreName||`#${id}`,position:pl.position?.abbreviation||pl.position?.name||'',profile:await hitterProfile(id,pitcherHand)});}rows.sort((a,b)=>a.slot-b.slot);return{announced:rows.length>=9,players:rows,count:rows.length};}
