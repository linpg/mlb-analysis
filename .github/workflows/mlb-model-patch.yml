          s = re.sub(r'async function renderGame\(g,ps,live,feedData\)\{[\s\S]*?\n\}\nasync function load', new_render + '\nasync function load', s, count=1)
          new_load = r'''async function load(){
  const my=++version;if(timer){clearInterval(timer);timer=null}setDateUI();document.getElementById('accuracy').innerHTML=accuracyHTML();document.getElementById('games').innerHTML=`<div class="loading">正在載入 ${fmtDate()}…<br><br>同步 MLB 官方資料</div>`;
  try{const games=await mlbSchedule();if(my!==version)return;document.getElementById('total').textContent=games.length;const counts={preview:0,live:0,final:0};games.forEach(g=>counts[gameStatus(g)[1]]++);document.getElementById('preview').textContent=counts.preview;document.getElementById('live').textContent=counts.live;document.getElementById('final').textContent=counts.final;if(!games.length){document.getElementById('games').innerHTML=`<div class="loading">這一天沒有抓到 MLB 賽程。</div>`;return}const feedList=await Promise.all(games.map(g=>feed(g))),feedData={};games.forEach((g,i)=>{if(feedList[i])feedData[g.gamePk]=feedList[i]});const box=document.getElementById('games');box.innerHTML='';for(const g of games){if(my!==version)break;box.insertAdjacentHTML('beforeend',await renderGame(g,null,null,feedData))}document.getElementById('accuracy').innerHTML=accuracyHTML();const stamp=latestOfficialFeedStamp(feedList);document.getElementById('refreshInfo').textContent=stamp?`MLB 官方資料更新時間：${stamp} ｜ 每 15 秒更新比分／局數`:`MLB 官方資料已更新 ｜ 每 15 秒更新比分／局數`;timer=setInterval(()=>refreshLive(games,my),15000);}catch(e){document.getElementById('games').innerHTML=`<div class="error">載入失敗：${esc(e.message)}<br><br>MLB 官方資料目前無法連線。<br>請稍後重新整理。</div>`;}
}
function parseMlbStamp(x){const m=String(x||'').match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/);if(!m)return null;try{return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Taipei'}).format(new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`));}catch{return null}}
function latestOfficialFeedStamp(list){const stamps=list.map(x=>x?.metaData?.timeStamp).filter(Boolean).sort();return stamps.length?parseMlbStamp(stamps[stamps.length-1]):null;}
async function refreshLive(games,my){if(my!==version)return;try{const feedList=await Promise.all(games.map(g=>feed(g)));let latest=[];games.forEach((g,i)=>{const fd=feedList[i];if(!fd)return;const lines=fd.liveData?.linescore||{},card=[...document.querySelectorAll('.game-card')].find(c=>c.textContent.includes(String(g.gamePk)));if(!card)return;const stA=lines?.teams?.away?.runs??g.teams?.away?.score??'-',stH=lines?.teams?.home?.runs??g.teams?.home?.score??'-';const nums=card.querySelector('.score');if(nums)nums.textContent=`${stA} - ${stH}`;const inn=card.querySelector('.inning');if(inn)inn.textContent=lines?.currentInning?`第 ${lines.currentInning} 局${lines.isTopInning?'上':'下'}`:(lines?.currentInningOrdinal||'');const state=fd.gameData?.status?.abstractGameState||g.status?.abstractGameState||'Preview',gg={...g,status:{...g.status,...fd.gameData?.status,abstractGameState:state},teams:{...g.teams,away:{...g.teams.away,score:Number(stA)},home:{...g.teams.home,score:Number(stH)}}};if(state==='Final')settlePredictionRecord(gg);const rec=loadPredictionRecords().find(r=>r.gamePk===g.gamePk);if(rec){const host=card.querySelector('.analysis');if(host){const html=resultBadges(gg,{winnerSide:rec.winnerSide}),tmp=document.createElement('div');tmp.innerHTML=html;const old=host.querySelector('.result-badges');if(old&&tmp.firstElementChild)old.replaceWith(tmp.firstElementChild);else if(!old)host.insertAdjacentHTML('afterbegin',html);}}if(fd.metaData?.timeStamp)latest.push(fd.metaData.timeStamp);});const stamp=latest.sort().slice(-1)[0];document.getElementById('accuracy').innerHTML=accuracyHTML();document.getElementById('refreshInfo').textContent=stamp?`MLB 官方資料更新時間：${parseMlbStamp(stamp)} ｜ 每 15 秒更新比分／局數`:`MLB 官方資料已更新 ｜ 每 15 秒更新比分／局數`;}catch(e){}}
'''
          s = re.sub(r'async function load\(\)\{[\s\S]*?\ndocument\.getElementById\("prev"\)', new_load + '\ndocument.getElementById("prev")', s, count=1)
          # Enhanced weather parser.
          s = re.sub(r'function extractWeather\(feedData\)\{[\s\S]*?\n\}', '''function extractWeather(feedData){const w=feedData?.gameData?.weather||{},v=feedData?.gameData?.venue||{};const temp=Number(w.temp),rawWind=String(w.wind??'').trim(),wm=rawWind.match(/(-?\\d+(?:\\.\\d+)?)\\s*mph/i);const roofType=v.roofType||v.roof||null;const roofClosed=Boolean(v.dome)||/closed|dome/i.test(String(roofType||''));return{temp:Number.isFinite(temp)?temp:null,condition:w.condition?String(w.condition):null,wind:wm?Number(wm[1]):null,windText:rawWind||null,roofType,roofClosed,source:(w.temp!=null||w.condition||w.wind)?'MLB 官方 feed/live gameData.weather':'資料不足'};}''', s, count=1)
          p.write_text(s,encoding='utf-8')
          print('patched lines:',len(s.splitlines()))
