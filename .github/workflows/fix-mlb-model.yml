name: Fix MLB model once

on:
  push:
    paths:
      - '.github/workflows/fix-mlb-model.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          echo "workflow active"
          git status --short
