name: Apply MLB model repair
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch model
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function lineupAttackScore(hitterData){\n  if(!hitterData?.length) return null;'
          new='function lineupAttackScore(hitterData){\n  const hitters=Array.isArray(hitterData)?hitterData:(hitterData?.hitters||[]);\n  if(!hitters.length) return null;'
          assert old in s, 'lineup anchor missing'
          s=s.replace(old,new,1).replace('  for(const h of hitterData){','  for(const h of hitters){',1)
          a=s.index('/* 預期得分 */'); b=s.index('/* 完整官方模型 */',a)
          s=s[:a]+'''/* 預期得分：本季 + 近10場 + 今日實際先發打線 + 對方先發 + 牛棚 + 環境。 */\nfunction projectedRuns({teamStatsData,recentData,lineupData,opposingPitcher,opposingBullpen,environment,isHome}){\n  const seasonRPG=Number(teamStatsData?.runs)/Math.max(Number(teamStatsData?.games)||1,1);\n  const recentRPG=Number(recentData?.runs)/Math.max(Number(recentData?.games)||1,1);\n  const bases=[];\n  if(Number.isFinite(seasonRPG))bases.push({v:seasonRPG,w:0.45});\n  if(Number.isFinite(recentRPG))bases.push({v:recentRPG,w:0.35});\n  let runs=bases.length?bases.reduce((x,y)=>x+y.v*y.w,0)/bases.reduce((x,y)=>x+y.w,0):4.5;\n  const lineupOPS=lineupAttackScore(lineupData);\n  if(Number.isFinite(lineupOPS))runs*=clamp(1+((lineupOPS-0.750)/0.750)*0.20,0.90,1.12);\n  const starter=combinedPitcherScore(opposingPitcher);\n  if(starter!=null)runs*=clamp(1/Math.max(starter,0.70),0.82,1.20);\n  const bullpen=bullpenScore(opposingBullpen);\n  if(Number.isFinite(bullpen))runs*=clamp(1/Math.max(bullpen,0.75),0.90,1.10);\n  runs*=environmentScore(environment);\n  if(isHome)runs*=1.025;\n  return clamp(runs,1.5,9.0);\n}\n\n''' + s[b:]
          s=s.replace('games:s.gamesPlayed??null,obp:s.obp??null','games:s.gamesPlayed??null,gamesPlayed:s.gamesPlayed??null,obp:s.obp??null',1)
          e1=s.index('function environmentScore(weather){'); e2=s.index('\n}\n\n\n/* 球隊整體攻擊',e1)+2
          env='''function environmentScore(weather){\n  if(!weather)return 1;\n  let factor=1;\n  const temp=num(weather.temp,NaN), wind=num(weather.wind,NaN);\n  const condition=String(weather.condition||'').toLowerCase();\n  const windText=String(weather.windText||'').toLowerCase();\n  if(Number.isFinite(temp)){if(temp<45)factor*=0.97;else if(temp>=85)factor*=1.03;}\n  if(/rain|shower|drizzle|thunderstorm|雨/.test(condition))factor*=0.97;\n  if(Number.isFinite(wind)&&wind>=20){if(/\\bout\\b|blowing out|外吹/.test(windText))factor*=1.035;else if(/\\bin\\b|blowing in|內吹/.test(windText))factor*=0.965;else factor*=0.99;}\n  return clamp(factor,0.90,1.08);\n}'''
          s=s[:e1]+env+s[e2:]
          a=s.index('  function officialAnalysisHTML('); b=s.index('\n}\n\n/* MLB 官方先發投手',a)+2
          fn='''  function officialAnalysisHTML(g,model,away,home,awayPitcher,homePitcher,awayLineup,homeLineup,weather){\n  if(!model)return `<div class="section"><div class="section-title">勝負分析</div><div class="muted">MLB 官方資料不足，暫時無法建立完整模型。</div></div>`;\n  const awayPct=Math.round(model.awayWin*100),homePct=Math.round(model.homeWin*100);\n  const awayRuns=Number(model.awayRuns),homeRuns=Number(model.homeRuns),total=Number(model.totalRuns);\n  const winnerSide=model.awayWin>model.homeWin?'away':model.homeWin>model.awayWin?'home':'tie';\n  const winner=winnerSide==='away'?away:home;\n  const gap=Math.abs(model.awayWin-model.homeWin);\n  const confidence=Math.round(clamp(50+gap*100*0.75,50,92));\n  const awayName=teamNames[code(away)]||away.team?.name||'客隊';\n  const homeName=teamNames[code(home)]||home.team?.name||'主隊';\n  const pred={winnerSide,confidence,predA:awayRuns,predH:homeRuns,total};\n  return `<div class="section"><div class="section-title">勝負分析</div>${resultBadges(g,pred)}<div class="prediction-box"><div class="prediction-main"><div class="muted">MLB 官方模型預測</div><div class="prediction-winner">${esc(teamNames[code(winner)]||winner.team?.name||'-')}</div><div class="prediction-confidence">模型信心 ${confidence}%</div></div><div class="two"><div class="pitch"><b>${esc(awayName)}</b><div class="statgrid"><div class="stat"><span>勝率</span><b>${awayPct}%</b></div><div class="stat"><span>預測得分</span><b>${awayRuns.toFixed(1)}</b></div><div class="stat"><span>模型強度</span><b>${model.awayStrength.toFixed(2)}</b></div></div></div><div class="pitch"><b>${esc(homeName)}</b><div class="statgrid"><div class="stat"><span>勝率</span><b>${homePct}%</b></div><div class="stat"><span>預測得分</span><b>${homeRuns.toFixed(1)}</b></div><div class="stat"><span>模型強度</span><b>${model.homeStrength.toFixed(2)}</b></div></div></div></div><div class="score-prediction"><div><span class="muted">客隊預估</span><strong>${awayRuns.toFixed(1)} 分</strong></div><div class="score-dash">-</div><div><span class="muted">主隊預估</span><strong>${homeRuns.toFixed(1)} 分</strong></div><div class="score-total"><span class="muted">預估總分</span><strong>${total.toFixed(1)}</strong></div></div><div class="muted" style="margin-top:8px">資料來源：MLB 官方；預測比分不使用任何盤口資料。</div></div></div><div class="section"><div class="section-title">模型依據</div><div class="muted">比分模型參考本季場均得分、最近10場場均得分、今日實際先發打線、對方先發、對方近10場牛棚與 MLB 官方比賽環境；缺少資料不以其他資料冒充。</div></div>`;\n}\n'''
          s=s[:a]+fn+s[b:]
          s=s.replace('    environment:weather\n  });\n\n  const homeRuns=projectedRuns({','    environment:weather,\n    isHome:false\n  });\n\n  const homeRuns=projectedRuns({',1)
          s=s.replace('    environment:weather\n  });\n\n  return {','    environment:weather,\n    isHome:true\n  });\n\n  return {',1)
          if '  settlePredictionRecord(g);' not in s:
            marker='}\n  let ls=live?.[g.gamePk]'; pos=s.index(marker); s=s[:pos+2]+'  settlePredictionRecord(g);\n'+s[pos+2:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply2-mlb-model.yml .github/workflows/test-mlb.yml .github/workflows/apply-mlb-model.yml .github/workflows/fix-mlb-model.yml || true
          git commit -m 'fix MLB score model and winner result display'
          git push origin HEAD:main
