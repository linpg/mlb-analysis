name: Fix accuracy DOM count
on:
  push:
    paths:
      - '.github/workflows/fix-accuracy-dom.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch accuracy summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function accuracySummary(){\n  const date=selectedDate;\n  const all=loadPredictionRecords().filter(x=>x.selectedDate===date && x.settled && (x.winnerHit===true || x.winnerHit===false));\n  const wins=all.filter(x=>x.winnerHit===true).length;\n  const misses=all.filter(x=>x.winnerHit===false).length;\n  const n=wins+misses;\n  const teamPct=n?wins/n*100:null;\n  return {n,wins,misses,teamPct};\n}'''
          new='''function accuracySummary(){\n  /* 當日準確度直接以畫面上各場 Final 的「勝負分析命中／未命中」為唯一來源。\n     不讀舊預測紀錄、不讀預測比分、不讀比分誤差，確保統計與使用者看到的 12/3 完全一致。 */\n  const badges=[...document.querySelectorAll(".game-card .result-badge")];\n  const wins=badges.filter(x=>x.textContent.includes("勝負分析命中")&&!x.textContent.includes("未命中")).length;\n  const misses=badges.filter(x=>x.textContent.includes("勝負分析未命中")).length;\n  const n=wins+misses;\n  const teamPct=n?wins/n*100:null;\n  return {n,wins,misses,teamPct};\n}'''
          if old not in s:
              raise SystemExit('target accuracySummary not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: accuracy uses displayed hit miss badges'
          git push
