name: Fix p undefined

on:
  push:
    paths:
      - '.github/workflows/fix-p-undefined.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined p without changing other logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'dataHealth(g,p,ap,hp,aStats,hStats,aRecent,hRecent,weather,aBull,hBull)'
          new = 'dataHealth(g,null,ap,hp,aStats,hStats,aRecent,hRecent,weather,aBull,hBull)'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/fix-p-undefined.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-p-undefined.yml
          git commit -m 'Fix undefined p in MLB analysis'
          git push
