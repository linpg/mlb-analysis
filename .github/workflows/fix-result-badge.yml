name: Fix prediction result badge
on:
  push:
    paths:
      - '.github/workflows/fix-result-badge.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch result badge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = r'''function resultBadges(g,pred){
  const state=g?.status?.abstractGameState||"Preview";
  const a=Number(g?.teams?.away?.score),h=Number(g?.teams?.home?.score);
  const hasScore=Number.isFinite(a)&&Number.isFinite(h);
  if(pred.winnerSide==="tie") return `<div class="result-badges"></div>`;
  if(state!=="Final"){
    if(state!=="Live"||!hasScore) return `<div class="result-badges"></div>`;
    const current=a>h?"away":h>a?"home":"tie";
    let badge="";
    if(current===pred.winnerSide) badge=`<span class="result-badge hit">🛣️ 在路上</span>`;
    else if(current!=="tie") badge=`<span class="result-badge miss">🥲 有點可憐</span>`;
    return `<div class="result-badges">${badge}</div><div class="result-note">目前比分：${a} - ${h} ｜ 比賽進行中，尚未計入當日準確度。</div>`;
  }
  if(!hasScore) return `<div class="result-badges"><span class="result-badge pending">⏳ 已完賽，等待官方比分</span></div>`;
  const actual=a>h?"away":h>a?"home":"tie";
  const hit=actual===pred.winnerSide;
  const badge=hit
    ? `<span class="result-badge hit">✓ 勝負分析命中</span>`
    : `<span class="result-badge miss">✕ 勝負分析未命中</span>`;
  return `<div class="result-badges">${badge}</div><div class="result-note">實際比分：${a} - ${h} ｜ 預測：${pred.winner} ｜ ${hit?"預測勝負正確，已計入命中":"預測勝負錯誤，已計入未命中"}。</div>`;
}'''
          pattern = r'function resultBadges\(g,pred\)\{.*?\n\}\nfunction toggleGameDetails'
          s2, n = re.subn(pattern, new + '\nfunction toggleGameDetails', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('resultBadges function not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix prediction result badge display'
          git push
