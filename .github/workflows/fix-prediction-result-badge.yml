name: Fix prediction result display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add prediction result badge
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'function predictionResultBadge(g)' in s:
              print('Prediction result badge already installed; nothing to do.')
              raise SystemExit(0)

          old = 'async function renderGame('
          if old not in s:
              raise SystemExit('renderGame function not found')

          s = s.replace(old, 'async function renderGameOriginal(', 1)

          addition = r'''

function predictionResultBadge(g){
  try{
    if(g?.status?.abstractGameState!=="Final")return "";

    const raw=localStorage.getItem(PRED_STORE_KEY);
    if(!raw)return `<div class="result-badges"><span class="result-badge pending">⏳ 尚無預測紀錄</span></div>`;

    const list=JSON.parse(raw);
    const rec=Array.isArray(list)
      ? list.find(x=>String(x?.gamePk)===String(g?.gamePk))
      : (list && String(list.gamePk)===String(g?.gamePk) ? list : null);

    if(!rec || !rec.winnerSide || rec.winnerSide==="tie"){
      return `<div class="result-badges"><span class="result-badge pending">⏳ 尚無有效預測</span></div>`;
    }

    const awayScore=Number(g?.teams?.away?.score);
    const homeScore=Number(g?.teams?.home?.score);
    if(!Number.isFinite(awayScore)||!Number.isFinite(homeScore)){
      return `<div class="result-badges"><span class="result-badge pending">⏳ 等待最終比分</span></div>`;
    }

    const actualSide=awayScore>homeScore ? "away" : homeScore>awayScore ? "home" : "tie";
    if(actualSide==="tie"){
      return `<div class="result-badges"><span class="result-badge pending">⚪ 平手／無法判定命中</span></div>`;
    }

    const hit=String(rec.winnerSide)===actualSide;
    const predictedName=rec.winner || (rec.winnerSide==="away" ? code(g?.teams?.away?.team||g?.teams?.away) : code(g?.teams?.home?.team||g?.teams?.home));
    const actualName=actualSide==="away"
      ? (g?.teams?.away?.team?.name||g?.teams?.away?.team?.abbreviation||code(g?.teams?.away))
      : (g?.teams?.home?.team?.name||g?.teams?.home?.team?.abbreviation||code(g?.teams?.home));

    return `<div class="result-badges"><span class="result-badge ${hit?"hit":"miss"}">${hit?"✅ 命中":"❌ 未命中"}</span><span class="result-note">預測：${esc(predictedName)} ｜ 實際：${esc(actualName)} ｜ 預測信心：${rec.confidence!=null?esc(rec.confidence)+"%":"--"}</span></div>`;
  }catch(e){
    return `<div class="result-badges"><span class="result-badge pending">⏳ 結果計算中</span></div>`;
  }
}

async function renderGame(g,live,feedData){
  const html=await renderGameOriginal(g,live,feedData);
  const badge=predictionResultBadge(g);
  if(!badge)return html;
  const marker='<div class="analysis">';
  if(html.includes(marker))return html.replace(marker,badge+marker);
  return badge+html;
}
'''

          s += addition
          p.write_text(s, encoding='utf-8')
          print('Prediction result badge installed.')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-prediction-result-badge.yml
          git commit -m "Show prediction hit or miss" || exit 0
          git rm .github/workflows/fix-prediction-result-badge.yml
          git commit -m "Remove one-time prediction result workflow"
          git push