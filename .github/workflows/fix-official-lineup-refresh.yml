name: Fix MLB official lineup refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          echo 'UEsDBA==' >/dev/null
          python3 - <<'PY'
          import base64
          from pathlib import Path
          code=base64.b64decode('""" + b64 + """').decode('utf-8')
          exec(compile(code,'patch.py','exec'))
          PY

      - name: Commit and remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-official-lineup-refresh.yml .github/workflows/apply-lineup-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-official-lineup-refresh.yml .github/workflows/apply-lineup-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh MLB official lineup data"
          git push
