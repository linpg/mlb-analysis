<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MLB 分析中心</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #222;
  font-family:
    Arial,
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;
}


/* ========================================
   HEADER
======================================== */

header {
  background: #111;
  color: white;
  padding: 18px;
}

.header-inner {
  max-width: 1250px;
  margin: auto;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  margin-top: 6px;
  color: #aaa;
  font-size: 13px;
}


/* ========================================
   CONTAINER
======================================== */

.container {
  max-width: 1250px;
  margin: auto;
  padding: 15px;
}


/* ========================================
   DATE BAR
======================================== */

.date-bar {
  background: white;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
  flex-wrap: wrap;
}

.date-buttons {
  display: flex;
  gap: 6px;
}

.date-buttons button {
  border: 1px solid #ddd;
  background: white;

  padding: 9px 14px;

  border-radius: 5px;

  cursor: pointer;

  font-size: 14px;
}

.date-buttons button:hover {
  background: #eee;
}

.date-buttons .today, .date-buttons .active {
  background: #111;
  color: white;
  font-weight: bold;
}

.date-current {
  font-weight: bold;
}


/* ========================================
   SUMMARY
======================================== */

.summary {
  display: grid;
  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

  margin-bottom: 15px;
}

.summary-box {
  background: white;

  padding: 14px;

  border-radius: 8px;
}

.summary-title {
  font-size: 12px;
  color: #888;
}

.summary-value {
  font-size: 23px;
  font-weight: bold;

  margin-top: 4px;
}


/* ========================================
   GAME CARD
======================================== */

.game-card {
  background: white;

  margin-bottom: 15px;

  border-radius: 9px;

  overflow: hidden;

  border: 1px solid #ddd;
}


/* ========================================
   GAME HEADER
======================================== */

.game-top {
  padding: 11px 15px;

  border-bottom: 1px solid #eee;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.game-time {
  font-weight: bold;
  font-size: 18px;
}

.game-date-small {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

.game-status {
  font-size: 12px;

  padding: 5px 9px;

  border-radius: 4px;

  background: #eee;
}

.status-preview {
  background: #e8f1ff;
  color: #1455b8;
}

.status-live {
  background: #ffe4e4;
  color: #c40000;

  font-weight: bold;
}

.status-final {
  background: #e4f7e9;
  color: #147333;
}


/* ========================================
   TEAMS
======================================== */

.teams {
  display: grid;

  grid-template-columns:
    1fr 100px 1fr;

  align-items: center;

  padding: 18px;

  gap: 10px;
}

.team {
  display: flex;

  align-items: center;

  gap: 12px;
}

.team.away {
  justify-content: flex-end;

  text-align: right;
}

.team.home {
  justify-content: flex-start;
}

.logo {
  width: 58px;
  height: 58px;

  object-fit: contain;
}

.team-name {
  font-size: 18px;

  font-weight: bold;
}

.team-side {
  color: #888;

  font-size: 11px;

  margin-top: 3px;
}

.score {
  text-align: center;

  font-size: 26px;

  font-weight: bold;
}

.inning-status {
  text-align: center;

  color: #c40000;

  font-size: 12px;

  margin-top: 4px;

  min-height: 16px;
}


/* ========================================
   PITCHER
======================================== */

.pitcher {
  border-top: 1px solid #eee;

  padding: 12px 18px;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 15px;
}

.pitcher-box {
  background: #fafafa;

  padding: 10px;

  border-radius: 5px;
}

.pitcher-title {
  font-size: 12px;

  color: #888;
}

.pitcher-name {
  margin-top: 4px;

  font-weight: bold;
}

.pitcher-hand {
  margin-top: 4px;

  font-size: 11px;

  color: #777;
}

.pitcher-stats {
  margin-top: 10px;

  border-top: 1px solid #eee;

  padding-top: 8px;
}

.pitcher-stats-title {
  font-size: 11px;

  color: #888;

  margin-bottom: 6px;
}

.pitcher-stat-grid {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 5px;
}

.pitcher-stat-item {
  background: white;

  border: 1px solid #eee;

  border-radius: 4px;

  padding: 5px 3px;

  text-align: center;
}

.pitcher-stat-label {
  font-size: 9px;

  color: #999;
}

.pitcher-stat-value {
  font-size: 12px;

  font-weight: bold;

  margin-top: 2px;
}

.pitcher-recent {
  margin-top: 7px;

  padding: 6px;

  background: white;

  border-radius: 4px;

  font-size: 11px;

  color: #555;
}


/* ========================================
   DATA SECTION
======================================== */

.data-section {
  border-top: 1px solid #eee;

  padding: 15px;
}

.data-title {
  font-size: 16px;

  font-weight: bold;

  margin-bottom: 8px;
}

.data-table {
  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}

.data-table th,
.data-table td {
  padding: 8px;

  border-bottom: 1px solid #eee;

  text-align: center;
}

.data-table th {
  background: #f5f5f5;
}

.data-loading {
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}

.data-error {
  color: #b00000;
  font-size: 12px;
  margin-bottom: 8px;
}


/* ========================================
   LIVE INFO
======================================== */

.live-section {
  border-top: 1px solid #eee;

  padding: 15px;
}

.live-title {
  font-weight: bold;

  margin-bottom: 8px;
}

.live-info {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;
}

.live-box {
  background: #fafafa;

  border-radius: 5px;

  padding: 9px;

  text-align: center;
}

.live-label {
  font-size: 11px;

  color: #888;
}

.live-value {
  font-weight: bold;

  margin-top: 3px;
}


/* ========================================
   ANALYSIS
======================================== */

.analysis {
  background: #f5f9ff;

  border-left: 4px solid #2864d7;

  padding: 13px;

  margin: 0 15px 15px;

  border-radius: 4px;
}

.analysis-title {
  font-weight: bold;

  margin-bottom: 6px;
}

.analysis-text {
  font-size: 13px;

  line-height: 1.7;
}


/* ========================================
   LOADING
======================================== */

.loading,
.empty,
.error {
  background: white;

  padding: 35px;

  text-align: center;

  border-radius: 8px;
}

.error {
  color: #b00000;
}


/* ========================================
   REFRESH
======================================== */

.refresh-info {
  text-align: center;

  color: #888;

  font-size: 11px;

  margin: 20px 0;
}


/* ========================================
   RESPONSIVE
======================================== */

@media(max-width: 750px) {

  .summary {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .teams {
    grid-template-columns: 1fr;

    text-align: center;
  }

  .team.away,
  .team.home {
    justify-content: center;

    text-align: center;
  }

  .score {
    order: 3;
  }

  .pitcher {
    grid-template-columns: 1fr;
  }

  .pitcher-stat-grid {
    grid-template-columns:
      repeat(5, 1fr);
  }

  .live-info {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .data-table {
    font-size: 11px;
  }

  .data-table th,
  .data-table td {
    padding: 6px 3px;
  }

}


@media(max-width: 500px) {

  h1 {
    font-size: 22px;
  }

  .team-name {
    font-size: 16px;
  }

  .logo {
    width: 48px;
    height: 48px;
  }

  .pitcher-stat-grid {
    grid-template-columns:
      repeat(5, 1fr);
  }

  .pitcher-stat-label {
    font-size: 8px;
  }

  .pitcher-stat-value {
    font-size: 11px;
  }

}

</style>

</head>
