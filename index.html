<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MLB 比賽分析系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 16px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .top-info {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .info-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 17px;
      font-weight: bold;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .game-time {
      font-weight: bold;
      font-size: 18px;
    }

    .status {
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e5e7eb;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .team {
      text-align: center;
    }

    .team-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin-bottom: 5px;
    }

    .team-name {
      font-weight: bold;
      font-size: 15px;
    }

    .team-abbr {
      color: #6b7280;
      font-size: 12px;
      margin-top: 3px;
    }

    .vs {
      text-align: center;
      color: #6b7280;
      font-weight: bold;
    }

    .section {
      border-top: 1px solid #e5e7eb;
      padding-top: 13px;
      margin-top: 13px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .pitchers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pitcher-box {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px;
    }

    .pitcher-label {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .pitcher-name {
      font-weight: bold;
      font-size: 14px;
    }

    .lineups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lineup-team {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px;
    }

    .lineup-team-title {
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .batter {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 12px;
    }

    .batter:last-child {
      border-bottom: none;
    }

    .batter-order {
      width: 24px;
      color: #6b7280;
    }

    .batter-name {
      flex: 1;
      font-weight: 500;
    }

    .batter-position {
      color: #6b7280;
      font-size: 11px;
    }

    .completeness {
      margin-top: 10px;
    }

    .progress-bg {
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 10px;
      background: #16a34a;
      transition: width 0.3s;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 12px;
    }

    .prediction-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }

    .not-ready {
      background: #fee2e2;
      color: #991b1b;
    }

    .early {
      background: #fef3c7;
      color: #92400e;
    }

    .ready {
      background: #dcfce7;
      color: #166534;
    }

    .excellent {
      background: #dbeafe;
      color: #1e40af;
    }

    .season-box {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .season-stage {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .note {
      color: #6b7280;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 6px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .games {
        grid-template-columns: 1fr;
      }

      .teams {
        grid-template-columns: 1fr 45px 1fr;
      }

      .team-logo {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚾ MLB 比賽分析系統</h1>
  <p>2026 Season · 資料完整度 → 預測 → 歷史驗證</p>
</header>

<div class="container">

  <div class="top-info">

    <div class="info-box">
      <div class="info-title">分析日期</div>
      <div class="info-value" id="today"></div>
    </div>

    <div class="info-box">
      <div class="info-title">賽季</div>
      <div class="info-value">2026 MLB</div>
    </div>

    <div class="info-box">
      <div class="info-title">目前階段</div>
      <div class="info-value" id="seasonStage"></div>
    </div>

    <div class="info-box">
      <div class="info-title">比賽數</div>
      <div class="info-value" id="gameCount">讀取中</div>
    </div>

  </div>

  <div id="error"></div>

  <div id="games" class="games">
    <div class="loading">
      正在讀取 MLB 官方資料...
    </div>
  </div>

</div>

<script>

const MLB_API = "https://statsapi.mlb.com/api/v1";

const today = new Date();

const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, "0");
const dd = String(today.getDate()).padStart(2, "0");

const dateString = `${yyyy}-${mm}-${dd}`;

document.getElementById("today").textContent = dateString;


/* =========================================================
   賽季階段
========================================================= */

function getSeasonStage() {

  const month = today.getMonth() + 1;

  if (month <= 4) {
    return "賽季初期";
  }

  if (month <= 6) {
    return "賽季前中段";
  }

  if (month <= 8) {
    return "賽季中後段";
  }

  if (month <= 9) {
    return "賽季末段";
  }

  return "季後賽階段";
}

document.getElementById("seasonStage").textContent =
  getSeasonStage();


/* =========================================================
   API
========================================================= */

async function getJSON(url) {

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("API 讀取失敗：" + response.status);
  }

  return await response.json();
}


/* =========================================================
   球隊 Logo
========================================================= */

function getTeamLogo(teamId) {

  return `https://www.mlbstatic.com/team-logos/${teamId}.svg`;

}


/* =========================================================
   比賽狀態
========================================================= */

function getStatusText(status) {

  if (!status) return "未知";

  switch (status.abstractGameState) {

    case "Preview":
      return "尚未開打";

    case "Live":
      return "比賽進行中";

    case "Final":
      return "比賽結束";

    case "Postponed":
      return "延賽";

    case "Cancelled":
      return "取消";

    default:
      return status.detailedState || "未知";

  }
}


/* =========================================================
   時間
========================================================= */

function formatGameTime(gameDate) {

  const date = new Date(gameDate);

  return date.toLocaleTimeString("zh-TW", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

}


/* =========================================================
   取得預計先發投手
========================================================= */

function getProbablePitcher(gameData, side) {

  if (
    gameData &&
    gameData.gameData &&
    gameData.gameData.probablePitchers &&
    gameData.gameData.probablePitchers[side]
  ) {

    return gameData.gameData.probablePitchers[side];

  }

  return null;

}


/* =========================================================
   取得棒次
========================================================= */

function getBattingOrder(gameData, side) {

  try {

    const boxscore =
      gameData.liveData &&
      gameData.liveData.boxscore &&
      gameData.liveData.boxscore.teams &&
      gameData.liveData.boxscore.teams[side];

    if (!boxscore) {
      return [];
    }

    if (!boxscore.battingOrder) {
      return [];
    }

    const players = boxscore.players || {};

    return boxscore.battingOrder.map(playerId => {

      const player =
        players["ID" + playerId];

      if (!player) {
        return null;
      }

      return {

        name:
          player.person?.fullName || "未知球員",

        position:
          player.position?.abbreviation || "",

        battingOrder:
          player.battingOrder || ""

      };

    }).filter(Boolean);

  } catch (error) {

    console.log("取得棒次失敗", error);

    return [];

  }

}


/* =========================================================
   計算資料完整度
========================================================= */

function calculateCompleteness(gameData, awayLineup, homeLineup) {

  let score = 0;

  /*
    先發投手
    20 分
  */

  const awayPitcher =
    getProbablePitcher(gameData, "away");

  const homePitcher =
    getProbablePitcher(gameData, "home");

  if (awayPitcher) {
    score += 10;
  }

  if (homePitcher) {
    score += 10;
  }


  /*
    棒次
    每隊最多 25 分
  */

  score += Math.min(awayLineup.length, 9) / 9 * 25;

  score += Math.min(homeLineup.length, 9) / 9 * 25;


  /*
    基礎比賽資料
    10 分
  */

  if (gameData.gameData?.venue) {
    score += 5;
  }

  if (gameData.gameData?.datetime) {
    score += 5;
  }

  return Math.round(score);

}


/* =========================================================
   完整度文字
========================================================= */

function getCompletenessInfo(score) {

  if (score < 70) {

    return {
      text: "🔴 資料不足，目前不進行正式預測",
      className: "not-ready"
    };

  }

  if (score < 80) {

    return {
      text: "🟡 初步分析，等待更多資料",
      className: "early"
    };

  }

  if (score < 90) {

    return {
      text: "🟢 已達正式預測門檻",
      className: "ready"
    };

  }

  if (score < 100) {

    return {
      text: "🟢 高完整度，可以進行預測",
      className: "ready"
    };

  }

  return {
    text: "⭐ 完整資料，可以進行 Final Prediction",
    className: "excellent"
  };

}


/* =========================================================
   顯示棒次
========================================================= */

function renderLineup(lineup) {

  if (!lineup || lineup.length === 0) {

    return `
      <div class="note">
        尚未公布官方先發打線
      </div>
    `;

  }

  return lineup.slice(0, 9).map((player, index) => {

    return `
      <div class="batter">

        <div class="batter-order">
          ${index + 1}
        </div>

        <div class="batter-name">
          ${player.name}
        </div>

        <div class="batter-position">
          ${player.position}
        </div>

      </div>
    `;

  }).join("");

}


/* =========================================================
   建立比賽卡片
========================================================= */

function renderGame(game, gameData) {

  const away =
    game.teams.away.team;

  const home =
    game.teams.home.team;


  const awayLineup =
    getBattingOrder(gameData, "away");

  const homeLineup =
    getBattingOrder(gameData, "home");


  const awayPitcher =
    getProbablePitcher(gameData, "away");

  const homePitcher =
    getProbablePitcher(gameData, "home");


  const completeness =
    calculateCompleteness(
      gameData,
      awayLineup,
      homeLineup
    );


  const completenessInfo =
    getCompletenessInfo(completeness);


  const venue =
    gameData.gameData?.venue?.name ||
    game.venue?.name ||
    "未知球場";


  return `

    <div class="game-card">

      <div class="game-header">

        <div class="game-time">
          ${formatGameTime(game.gameDate)}
        </div>

        <div class="status">
          ${getStatusText(game.status)}
        </div>

      </div>


      <!-- 球隊 -->

      <div class="teams">

        <div class="team">

          <img
            class="team-logo"
            src="${getTeamLogo(away.id)}"
            alt="${away.name}"
            onerror="this.style.display='none'"
          >

          <div class="team-name">
            ${away.name}
          </div>

          <div class="team-abbr">
            ${away.abbreviation || ""}
          </div>

        </div>


        <div class="vs">
          @
        </div>


        <div class="team">

          <img
            class="team-logo"
            src="${getTeamLogo(home.id)}"
            alt="${home.name}"
            onerror="this.style.display='none'"
          >

          <div class="team-name">
            ${home.name}
          </div>

          <div class="team-abbr">
            ${home.abbreviation || ""}
          </div>

        </div>

      </div>


      <!-- 先發投手 -->

      <div class="section">

        <div class="section-title">
          🧑‍⚾ 預計先發投手
        </div>

        <div class="pitchers">

          <div class="pitcher-box">

            <div class="pitcher-label">
              ${away.name}
            </div>

            <div class="pitcher-name">

              ${
                awayPitcher
                  ? awayPitcher.fullName
                  : "尚未公布"
              }

            </div>

          </div>


          <div class="pitcher-box">

            <div class="pitcher-label">
              ${home.name}
            </div>

            <div class="pitcher-name">

              ${
                homePitcher
                  ? homePitcher.fullName
                  : "尚未公布"
              }

            </div>

          </div>

        </div>

      </div>


      <!-- 棒次 -->

      <div class="section">

        <div class="section-title">
          📋 先發打線
        </div>

        <div class="lineups">

          <div class="lineup-team">

            <div class="lineup-team-title">
              ${away.name}
            </div>

            ${renderLineup(awayLineup)}

          </div>


          <div class="lineup-team">

            <div class="lineup-team-title">
              ${home.name}
            </div>

            ${renderLineup(homeLineup)}

          </div>

        </div>

      </div>


      <!-- 賽季 -->

      <div class="section">

        <div class="section-title">
          🗓️ 賽季狀態
        </div>

        <div class="season-box">

          <div class="season-stage">
            2026 MLB · ${getSeasonStage()}
          </div>

          <div>
            球場：${venue}
          </div>

          <div class="note">
            賽季階段將影響後續模型權重。
            目前先建立資料層，正式模型稍後接入。
          </div>

        </div>

      </div>


      <!-- 資料完整度 -->

      <div class="section">

        <div class="section-title">
          🧠 預測資料完整度
        </div>

        <div class="completeness">

          <div class="progress-bg">

            <div
              class="progress-bar"
              style="width:${completeness}%"
            ></div>

          </div>

          <div class="progress-text">

            <span>
              ${completeness}%
            </span>

            <span>
              ${
                completeness >= 80
                  ? "已達預測門檻"
                  : "等待資料"
              }
            </span>

          </div>

        </div>


        <div class="prediction-status ${completenessInfo.className}">
          ${completenessInfo.text}
        </div>

        <div class="note">

          正式模型將在資料完整度達到門檻後才產生正式預測。
          後續還會加入球隊戰績、近10場、打者近期狀態、
          牛棚、傷兵、主客場、左右投拆分、天氣、球場、
          PlaySport 與台灣運彩盤口等因素。

        </div>

      </div>


      <!-- 近期打擊預留 -->

      <div class="section">

        <div class="section-title">
          📈 打者近期狀態
        </div>

        <div class="note">

          此區下一階段接入 MLB 官方球員近期打擊數據。
          會分析 Last 5 / Last 10、AVG、OBP、SLG、OPS、
          HR、BB、K，以及對左右投拆分。

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   讀取所有比賽
========================================================= */

async function loadGames() {

  const gamesContainer =
    document.getElementById("games");

  const errorContainer =
    document.getElementById("error");

  try {

    const scheduleURL =
      `${MLB_API}/schedule` +
      `?sportId=1` +
      `&date=${dateString}` +
      `&hydrate=team,probablePitcher`;

    const schedule =
      await getJSON(scheduleURL);


    const games =
      schedule.dates?.[0]?.games || [];


    document.getElementById("gameCount")
      .textContent = games.length;


    if (games.length === 0) {

      gamesContainer.innerHTML = `
        <div class="loading">
          今天沒有找到 MLB 比賽資料。
        </div>
      `;

      return;

    }


    /*
      先顯示基本資料
    */

    gamesContainer.innerHTML =
      games.map(game => {

        return `
          <div class="game-card">
            <div class="loading">
              正在讀取 ${game.teams.away.team.name}
              @
              ${game.teams.home.team.name}
              ...
            </div>
          </div>
        `;

      }).join("");


    /*
      再逐場取得 game feed
    */

    const gameCards = [];


    for (const game of games) {

      try {

        const feedURL =
          `${MLB_API}/game/${game.gamePk}/feed/live`;

        const gameData =
          await getJSON(feedURL);

        gameCards.push(
          renderGame(game, gameData)
        );

      } catch (error) {

        console.log(
          "Game feed 讀取失敗：",
          game.gamePk,
          error
        );

        /*
          如果單場 feed 失敗，
          至少仍顯示賽程
        */

        gameCards.push(
          renderGame(game, {
            gameData: {},
            liveData: {}
          })
        );

      }

    }


    gamesContainer.innerHTML =
      gameCards.join("");


  } catch (error) {

    console.error(error);

    errorContainer.innerHTML = `
      <div class="error">

        ⚠️ MLB 資料讀取失敗。

        <br><br>

        請稍後重新整理頁面。

        <br>

        如果持續發生，我們再處理 API / CORS 問題。

      </div>
    `;

    gamesContainer.innerHTML = "";

  }

}


/* =========================================================
   開始
========================================================= */

loadGames();

</script>

</body>
</html>
