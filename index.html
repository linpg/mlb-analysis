<script>


/* =========================================================
   基本設定
========================================================= */

const MLB_API =
  "https://statsapi.mlb.com/api/v1";


/*
 * ================================================
 * 非常重要
 *
 * selectedDate = 「PlaySport / 台灣日期」
 *
 * 例如：
 *
 * 2026-09-13
 *
 * 對應：
 *
 * PlaySport 20260913
 *
 * MLB 官方 schedule 要查：
 *
 * 2026-09-12
 *
 * 因為 MLB 美國當地日期比台灣慢一天。
 * ================================================
 */

let selectedDate =
  "2026-09-13";


/*
 * 即時更新 Timer
 */

let liveUpdateTimer = null;


/*
 * 防止切換日期後，
 * 舊的更新程序繼續寫入畫面
 */

let pageVersion = 0;


/* =========================================================
   日期工具
========================================================= */


/*
 * YYYY-MM-DD
 *
 * ↓
 *
 * YYYYMMDD
 */

function dateToPlaySport(date) {

  return date.replaceAll("-", "");

}


/*
 * PlaySport 日期
 *
 * ↓
 *
 * MLB API 查詢日期
 *
 * 例：
 *
 * PlaySport 2026-09-13
 *
 * MLB API 2026-09-12
 */

function getMLBQueryDate() {

  return addDays(
    selectedDate,
    -1
  );

}


/*
 * 日期加減
 */

function addDays(
  dateString,
  days
) {

  const parts =
    dateString
      .split("-")
      .map(Number);


  const date =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
      )
    );


  date.setUTCDate(
    date.getUTCDate() + days
  );


  return date
    .toISOString()
    .slice(0, 10);

}


/*
 * 顯示：
 *
 * 2026/09/13
 */

function formatDate(date) {

  return date.replaceAll(
    "-",
    "/"
  );

}


/* =========================================================
   PlaySport URL
========================================================= */

function getPlaySportURL() {

  return (
    "https://www.playsport.cc/livescore/1" +
    "?gamedate=" +
    dateToPlaySport(selectedDate) +
    "&mode=2"
  );

}


/* =========================================================
   日期 UI
========================================================= */

function updateDateUI() {

  const previous =
    addDays(
      selectedDate,
      -1
    );


  const next =
    addDays(
      selectedDate,
      1
    );


  document
    .getElementById("prevDay")
    .textContent =
      `← ${previous.slice(5).replace("-", "/")}`;


  document
    .getElementById("nextDay")
    .textContent =
      `${next.slice(5).replace("-", "/")} →`;


  document
    .getElementById("today")
    .textContent =
      selectedDate === "2026-09-13"
        ? "09/13 今天"
        : "回到 09/13";


  document
    .getElementById("dateText")
    .textContent =
      `🇹🇼 ${formatDate(selectedDate)} ｜ PlaySport ${dateToPlaySport(selectedDate)}`;

}


/* =========================================================
   API
========================================================= */

async function getJSON(url) {

  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `API 錯誤：${response.status}`
    );

  }


  return response.json();

}


/* =========================================================
   取得指定日期的 MLB 賽程
========================================================= */

async function getMLBSchedule() {

  /*
   * 注意：
   *
   * 這裡不能用 selectedDate。
   *
   * 必須用：
   *
   * getMLBQueryDate()
   */

  const mlbQueryDate =
    getMLBQueryDate();


  const url =
    `${MLB_API}/schedule` +
    `?sportId=1` +
    `&date=${mlbQueryDate}` +
    `&hydrate=team,probablePitcher`;


  console.log(
    "PlaySport 日期：",
    selectedDate
  );


  console.log(
    "MLB API 查詢日期：",
    mlbQueryDate
  );


  const data =
    await getJSON(url);


  let games = [];


  if (data.dates) {

    data.dates.forEach(day => {

      if (day.games) {

        games =
          games.concat(
            day.games
          );

      }

    });

  }


  /*
   * 只保留 MLB 比賽
   */

  games =
    games.filter(
      game =>
        game.sport?.id === 1 ||
        game.sport?.name === "Major League Baseball" ||
        game.gameType === "R"
    );


  /*
   * 排序
   *
   * 注意：
   *
   * MLB gameDate 是美國時間
   *
   * 這裡排序後再顯示台灣時間。
   */

  games.sort(
    (a, b) =>
      new Date(a.gameDate) -
      new Date(b.gameDate)
  );


  return games;

}


/* =========================================================
   載入 MLB 比賽
========================================================= */

async function loadMLBGames() {

  /*
   * 每次切日期，
   * 版本號 +1
   */

  pageVersion++;


  const currentVersion =
    pageVersion;


  /*
   * 清掉舊的即時更新
   */

  if (liveUpdateTimer) {

    clearInterval(
      liveUpdateTimer
    );

    liveUpdateTimer = null;

  }


  const gamesBox =
    document.getElementById("games");


  gamesBox.innerHTML = `

    <div class="loading">

      正在載入
      ${formatDate(selectedDate)}
      MLB 比賽...

      <br><br>

      PlaySport：
      ${dateToPlaySport(selectedDate)}

    </div>

  `;


  updateDateUI();


  try {

    /*
     * 取得正確日期的 MLB 賽程
     */

    const games =
      await getMLBSchedule();


    /*
     * 如果使用者已經切換日期，
     * 舊請求不要再寫畫面
     */

    if (
      currentVersion !== pageVersion
    ) {

      return;

    }


    /*
     * 統計
     */

    updateSummary(
      games
    );


    /*
     * 沒有比賽
     */

    if (!games.length) {

      gamesBox.innerHTML = `

        <div class="empty">

          <h3>
            ${formatDate(selectedDate)}
            沒有找到 MLB 比賽
          </h3>

          <p>
            PlaySport：
            ${dateToPlaySport(selectedDate)}
          </p>

          <p>
            MLB API 查詢日期：
            ${formatDate(getMLBQueryDate())}
          </p>

        </div>

      `;

      return;

    }


    gamesBox.innerHTML = "";


    /*
     * 建立比賽卡片
     *
     * 使用 Promise.all
     * 避免一場一場慢慢等
     */

    const cards =
      await Promise.all(
        games.map(
          game =>
            createGameCard(
              game
            )
        )
      );


    /*
     * 再確認日期沒有被切換
     */

    if (
      currentVersion !== pageVersion
    ) {

      return;

    }


    cards.forEach(card => {

      gamesBox.appendChild(
        card
      );

    });


    /*
     * 更新時間
     */

    updateRefreshTime();


    /*
     * 重新啟動即時更新
     */

    startLiveRefresh();

  }


  catch(error) {

    console.error(error);


    if (
      currentVersion !== pageVersion
    ) {

      return;

    }


    gamesBox.innerHTML = `

      <div class="error">

        <h3>
          ⚠️ MLB 資料載入失敗
        </h3>

        <p>
          ${error.message}
        </p>

        <p>
          PlaySport 日期：
          ${dateToPlaySport(selectedDate)}
        </p>

        <p>
          MLB API 查詢：
          ${formatDate(getMLBQueryDate())}
        </p>

        <button
          onclick="loadMLBGames()"
        >
          重新載入
        </button>

      </div>

    `;

  }

}


/* =========================================================
   Summary
========================================================= */

function updateSummary(
  games
) {

  let preview = 0;

  let live = 0;

  let final = 0;


  games.forEach(game => {

    const state =
      game.status?.abstractGameState;


    if (
      state === "Preview"
    ) {

      preview++;

    }

    else if (
      state === "Live"
    ) {

      live++;

    }

    else if (
      state === "Final"
    ) {

      final++;

    }

  });


  document
    .getElementById("totalGames")
    .textContent =
      games.length;


  document
    .getElementById("previewGames")
    .textContent =
      preview;


  document
    .getElementById("liveGames")
    .textContent =
      live;


  document
    .getElementById("finalGames")
    .textContent =
      final;

}


/* =========================================================
   台灣時間
========================================================= */

function getTaiwanTime(
  gameDate
) {

  return new Intl.DateTimeFormat(
    "zh-TW",
    {
      timeZone:
        "Asia/Taipei",

      hour:
        "2-digit",

      minute:
        "2-digit",

      hour12:
        false
    }
  )
  .format(
    new Date(gameDate)
  );

}


/* =========================================================
   比賽狀態
========================================================= */

function getStatusInfo(
  game
) {

  const status =
    game.status?.abstractGameState ||
    "Preview";


  if (
    status === "Live"
  ) {

    return {
      text: "🔴 進行中",
      className: "status-live"
    };

  }


  if (
    status === "Final"
  ) {

    return {
      text: "✅ 比賽結束",
      className: "status-final"
    };

  }


  return {
    text: "尚未開打",
    className: "status-preview"
  };

}


/* =========================================================
   取得先發投手
========================================================= */

function getPitcherName(
  pitcher
) {

  return (
    pitcher?.fullName ||
    pitcher?.name ||
    "尚未公布"
  );

}


/* =========================================================
   取得局數
========================================================= */

function getInningText(
  linescore,
  status
) {

  if (
    status === "Final"
  ) {

    return "比賽結束";

  }


  if (
    !linescore?.currentInning
  ) {

    return "";

  }


  return `${
    linescore.inningHalf === "Top"
      ? "上"
      : "下"
  }${linescore.currentInning}局`;

}


/* =========================================================
   取得球數
========================================================= */

function getCount(
  liveData
) {

  const linescore =
    liveData?.linescore;


  if (
    !linescore
  ) {

    return "-";

  }


  const balls =
    linescore.balls;


  const strikes =
    linescore.strikes;


  if (
    balls === undefined ||
    strikes === undefined
  ) {

    return "-";

  }


  return `${balls}-${strikes}`;

}


/* =========================================================
   建立比賽卡片
========================================================= */

async function createGameCard(
  game
) {

  /*
   * Live Feed
   */

  let feed = null;


  try {

    feed =
      await getJSON(
        `${MLB_API}/game/${game.gamePk}/feed/live`
      );

  }

  catch(error) {

    console.warn(
      "Live Feed 讀取失敗",
      game.gamePk
    );

  }


  const gameData =
    feed?.gameData || {};


  const liveData =
    feed?.liveData || {};


  const away =
    game.teams.away;


  const home =
    game.teams.home;


  const status =
    game.status?.abstractGameState ||
    "Preview";


  const statusInfo =
    getStatusInfo(
      game
    );


  /*
   * 台灣時間
   */

  const taiwanTime =
    getTaiwanTime(
      game.gameDate
    );


  /*
   * 先發投手
   */

  const awayPitcher =
    gameData
      .probablePitchers
      ?.away;


  const homePitcher =
    gameData
      .probablePitchers
      ?.home;


  const awayPitcherName =
    getPitcherName(
      awayPitcher
    );


  const homePitcherName =
    getPitcherName(
      homePitcher
    );


  /*
   * 比分
   */

  let score =
    "VS";


  if (
    status === "Live" ||
    status === "Final"
  ) {

    score =
      `${away.score ?? 0} - ${home.score ?? 0}`;

  }


  /*
   * 局數
   */

  const inningText =
    getInningText(
      liveData.linescore,
      status
    );


  /*
   * 建立卡片
   */

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "game-card";


  /*
   * gamePk 綁定
   */

  card.setAttribute(
    "data-game-id",
    game.gamePk
  );


  /*
   * PlaySport Game ID
   *
   * 20260913 + 比賽序號
   *
   * MLB gamePk 與 PlaySport gameid
   * 不一定相同，因此目前只作顯示用途。
   */

  card.setAttribute(
    "data-mlb-game-id",
    game.gamePk
  );


  card.innerHTML = `

    <!-- ======================
         GAME HEADER
    ======================= -->

    <div class="game-top">

/* =========================================================
   即時更新比分
========================================================= */

async function refreshLiveScores() {

  /*
   * 如果沒有頁面，
   * 不執行
   */

  if (
    !document.querySelector(
      ".game-card"
    )
  ) {

    return;

  }


  /*
   * 記錄目前日期版本
   */

  const currentVersion =
    pageVersion;


  try {

    /*
     * 重新取得「目前 PlaySport 日期」
     * 對應的 MLB 日期
     */

    const games =
      await getMLBSchedule();


    /*
     * 防止使用者已切日期
     */

    if (
      currentVersion !== pageVersion
    ) {

      return;

    }


    /*
     * 更新統計
     */

    updateSummary(
      games
    );


    /*
     * 更新每場
     */

    for (
      const game of games
    ) {

      /*
       * 如果使用者中途切換日期，
       * 立即停止
       */

      if (
        currentVersion !== pageVersion
      ) {

        return;

      }


      const card =
        document.querySelector(
          `[data-game-id="${game.gamePk}"]`
        );


      if (!card) {

        continue;

      }


      /*
       * 只有 LIVE / FINAL
       * 才需要抓 feed
       *
       * 尚未開打不用一直抓
       */

      const state =
        game.status?.abstractGameState;


      if (
        state !== "Live" &&
        state !== "Final"
      ) {

        continue;

      }


      try {

        const feed =
          await getJSON(
            `${MLB_API}/game/${game.gamePk}/feed/live`
          );


        updateGameCardLive(
          card,
          game,
          feed
        );

      }


      catch(error) {

        console.warn(
          "Live Feed 更新失敗",
          game.gamePk,
          error
        );

      }

    }


    updateRefreshTime();

  }


  catch(error) {

    console.warn(
      "即時更新失敗",
      error
    );

  }

}


/* =========================================================
   更新單場 LIVE
========================================================= */

function updateGameCardLive(
  card,
  game,
  feed
) {

  const away =
    game.teams.away;


  const home =
    game.teams.home;


  const status =
    game.status?.abstractGameState;


  /*
   * =========================
   * 比分
   * =========================
   */

  const scoreElement =
    card.querySelector(
      ".score"
    );


  if (scoreElement) {

    if (
      status === "Live" ||
      status === "Final"
    ) {

      scoreElement.textContent =
        `${away.score ?? 0} - ${home.score ?? 0}`;

    }

    else {

      scoreElement.textContent =
        "VS";

    }

  }


  /*
   * =========================
   * 狀態
   * =========================
   */

  const statusElement =
    card.querySelector(
      ".game-status"
    );


  if (statusElement) {

    const info =
      getStatusInfo(
        game
      );


    statusElement.textContent =
      info.text;


    statusElement.className =
      `game-status ${info.className}`;

  }


  /*
   * =========================
   * 局數
   * =========================
   */

  const linescore =
    feed?.liveData?.linescore;


  const inningText =
    getInningText(
      linescore,
      status
    );


  const inningElement =
    card.querySelector(
      ".inning-status"
    );


  if (inningElement) {

    inningElement.textContent =
      inningText;

  }


  /*
   * =========================
   * LIVE 局數
   * =========================
   */

  const liveInning =
    card.querySelector(
      ".live-inning"
    );


  if (liveInning) {

    liveInning.textContent =
      inningText || "-";

  }


  /*
   * =========================
   * OUTS
   * =========================
   */

  const liveOuts =
    card.querySelector(
      ".live-outs"
    );


  if (liveOuts) {

    liveOuts.textContent =
      linescore?.outs ?? "-";

  }


  /*
   * =========================
   * 球數
   * =========================
   */

  const liveCount =
    card.querySelector(
      ".live-count"
    );


  if (liveCount) {

    liveCount.textContent =
      getCount(
        feed?.liveData
      );

  }


  /*
   * =========================
   * LIVE → FINAL
   * =========================
   *
   * 如果原本是 LIVE，
   * 結束後要顯示比賽結束。
   *
   * 不重新整張卡片，
   * 只更新必要內容。
   */

  if (
    status === "Final"
  ) {

    const liveState =
      card.querySelector(
        ".live-state"
      );


    if (liveState) {

      liveState.textContent =
        "FINAL";

    }

  }

}


/* =========================================================
   啟動即時更新
========================================================= */

function startLiveRefresh() {

  /*
   * 先清除舊 Timer
   */

  if (liveUpdateTimer) {

    clearInterval(
      liveUpdateTimer
    );

  }


  /*
   * 每 15 秒更新
   */

  liveUpdateTimer =
    setInterval(
      refreshLiveScores,
      15000
    );

}


/* =========================================================
   更新時間
========================================================= */

function updateRefreshTime() {

  const now =
    new Date();


  const time =
    new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone:
          "Asia/Taipei",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false
      }
    )
    .format(now);


  document
    .getElementById(
      "refreshInfo"
    )
    .textContent =
      `🔄 最後更新：${time} ｜ 每 15 秒自動更新`;

}
