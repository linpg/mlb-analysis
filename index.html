<body>
<header><div class="header-inner"><h1>⚾ MLB 分析中心</h1><div class="subtitle">MLB 官方球隊／投手數據 + 自動勝負／預估分數分析</div></div></header>
<div class="container">
  <div class="bar">
    <div class="buttons"><button id="prev">← 前一天</button><button id="today">今天</button><button id="next">後一天 →</button></div>
    <div id="dateText"></div>
  </div>
  <div class="summary">
    <div class="summary-box"><div class="summary-title">今日比賽</div><div class="summary-value" id="total">-</div></div>
    <div class="summary-box"><div class="summary-title">尚未開打</div><div class="summary-value" id="preview">-</div></div>
    <div class="summary-box"><div class="summary-title">🔴 進行中</div><div class="summary-value" id="live">-</div></div>
    <div class="summary-box"><div class="summary-title">已結束</div><div class="summary-value" id="final">-</div></div>
  </div>
  <div id="accuracy"></div>
  <div id="games"><div class="loading">正在載入 MLB 比賽…</div></div>
  <div class="source" id="refreshInfo">MLB 官方資料載入中</div>
</div>

<script>
const MLB_API="https://statsapi.mlb.com/api/v1";
let selectedDate=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
let version=0,timer=null;
const teamCache=new Map(),playerCache=new Map();

const teamNames={
AZ:"響尾蛇",ATL:"勇士",BAL:"金鶯",BOS:"紅襪",CHC:"小熊",CWS:"白襪",CIN:"紅人",CLE:"守護者",
COL:"落磯",DET:"老虎",HOU:"太空人",KC:"皇家",LAA:"天使",LAD:"道奇",MIA:"馬林魚",MIL:"釀酒人",
MIN:"雙城",NYM:"大都會",NYY:"洋基",ATH:"運動家",PHI:"費城人",PIT:"海盜",SD:"教士",SF:"巨人",
SEA:"水手",STL:"紅雀",TB:"光芒",TEX:"遊騎兵",TOR:"藍鳥",WSH:"國民"
};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function addDays(s,n){let d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fmtDate(){return selectedDate.replaceAll("-","/")}
function setDateUI(){
  document.getElementById("dateText").textContent=`🇹🇼 ${fmtDate()} ｜ MLB 官方賽程／台灣時間`;
  document.getElementById("prev").textContent=`← ${addDays(selectedDate,-1).slice(5).replace("-","/")}`;
  document.getElementById("next").textContent=`${addDays(selectedDate,1).slice(5).replace("-","/")} →`;
}
async function json(url,timeout=15000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);
  try{let r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
async function mlbSchedule(){
  // 網站日期以「台灣日期」為準。
  // MLB API 的 date 是美國當地賽程日期，因此不能直接用 date=selectedDate。
  // 例如美國 9/15 晚上的比賽，在台灣可能已經是 9/16 上午，應歸到台灣 9/16。
  // 先抓前一天～後一天的 MLB 官方賽程，再把 gameDate 轉成台灣日期篩選。
  const begin=addDays(selectedDate,-1), end=addDays(selectedDate,1);
  const d=await json(`${MLB_API}/schedule?sportId=1&startDate=${begin}&endDate=${end}&hydrate=team,probablePitcher`).catch(()=>null);
  if(!d)return [];

  const taiwanDate=g=>{
    try{
      return new Intl.DateTimeFormat("en-CA",{
        year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Asia/Taipei"
      }).format(new Date(g.gameDate));
    }catch{return ""}
  };

  const seen=new Set();
  return (d.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>taiwanDate(g)===selectedDate)
    .filter(g=>{
      if(seen.has(g.gamePk))return false;
      seen.add(g.gamePk);
      return true;
    })
    .sort((a,b)=>new Date(a.gameDate)-new Date(b.gameDate));
}
function logo(id){return `https://www.mlbstatic.com/team-logos/${id}.svg`}
function code(t){return t?.abbreviation||t?.team?.abbreviation||""}
function gameStatus(g){
  let s=g.status?.abstractGameState||"Preview";
  if(s==="Live")return ["進行中","live"];
  if(s==="Final")return ["已結束","final"];
  return [g.status?.detailedState||"尚未開打","preview"];
}
function timeTW(g){
  try{
    const dt=new Date(g?.gameDate);
    if(Number.isNaN(dt.getTime()))return "--:--";
    return new Intl.DateTimeFormat("zh-TW",{
      timeZone:"Asia/Taipei",
      hour:"2-digit",
      minute:"2-digit",
      hourCycle:"h23"
    }).format(dt);
  }catch{return "--:--"}
}
async function feed(g){
  return json(`https://statsapi.mlb.com/api/v1.1/game/${g.gamePk}/feed/live`,12000).catch(()=>null);
}
function extractWeather(feedData){
  const w=feedData?.gameData?.weather||{};
  const temp=Number(w.temp);
  const rawWind=String(w.wind??"").trim();
  const wm=rawWind.match(/(-?\d+(?:\.\d+)?)\s*mph/i);
  return {
    temp:Number.isFinite(temp)?temp:null,
    condition:w.condition?String(w.condition):null,
    wind:wm?Number(wm[1]):null,
    windText:rawWind||null,
    source:(w.temp!=null||w.condition||w.wind)?"MLB 官方 feed/live gameData.weather":"資料不足"
  };
}
async function teamStats(id){
  const key=`season-${id}-${new Date().getFullYear()}`;
  if(teamCache.has(key))return teamCache.get(key);
  let season=new Date().getFullYear();
  let d=await json(`${MLB_API}/teams/${id}/stats?stats=season&group=hitting&season=${season}`).catch(()=>null);
  let s=d?.stats?.[0]?.splits?.[0]?.stat||{};
  let v={avg:s.avg??null,ops:s.ops??null,runs:s.runs??null,games:s.gamesPlayed??null,gamesPlayed:s.gamesPlayed??null,obp:s.obp??null,slg:s.slg??null,source:"MLB 官方本季"};
  teamCache.set(key,v);return v;
}

/* 精確計算指定球隊最近10場「已完成」比賽的打擊數據。
   不用本季數據代替近10場；資料不足就回傳 null。 */
async function recentTeamStats(id){
  const key=`recent10-${id}-${selectedDate}`;
  if(teamCache.has(key))return teamCache.get(key);
  const end=addDays(selectedDate,-1);
  const begin=addDays(end,-30);
  let d=await json(`${MLB_API}/schedule?sportId=1&teamId=${id}&startDate=${begin}&endDate=${end}&hydrate=team`).catch(()=>null);
  let games=(d?.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>g.status?.abstractGameState==="Final")
    .sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate))
    .slice(0,10);
  if(games.length<10){
    const v={games:games.length,avg:null,ops:null,obp:null,slg:null,runs:null,allowed:null,source:"MLB 官方近10場（資料不足10場）"};
    teamCache.set(key,v);return v;
  }
  let totals={ab:0,h:0,bb:0,hbp:0,sf:0,db:0,tb3:0,hr:0,r:0,pa:0,allowed:0};
  let ok=0;
  for(const g of games){
    let b=await json(`${MLB_API}/game/${g.gamePk}/boxscore`,12000).catch(()=>null);
    let side=g.teams?.away?.team?.id===id?"away":g.teams?.home?.team?.id===id?"home":null;
    let st=side?b?.teams?.[side]?.teamStats?.batting:null;
    let opp=side==="away"?b?.teams?.home?.teamStats?.batting:b?.teams?.away?.teamStats?.batting;
    if(!st||!opp)continue;
    totals.ab+=Number(st.atBats)||0; totals.h+=Number(st.hits)||0; totals.bb+=Number(st.baseOnBalls)||0;
    totals.hbp+=Number(st.hitByPitch)||0; totals.sf+=Number(st.sacFlies)||0; totals.db+=Number(st.doubles)||0;
    totals.tb3+=Number(st.triples)||0; totals.hr+=Number(st.homeRuns)||0; totals.r+=Number(st.runs)||0;
    totals.pa+=Number(st.plateAppearances)||0; totals.allowed+=Number(opp.runs)||0; ok++;
  }
  if(ok<10||totals.ab<=0){
    const v={games:ok,avg:null,ops:null,obp:null,slg:null,runs:null,allowed:null,source:"MLB 官方近10場（資料不足）"};
    teamCache.set(key,v);return v;
  }
  const singles=totals.h-totals.db-totals.tb3-totals.hr;
  const tb=singles+2*totals.db+3*totals.tb3+4*totals.hr;
  const obp=(totals.h+totals.bb+totals.hbp)/(totals.ab+totals.bb+totals.hbp+totals.sf);
  const slg=tb/totals.ab;
  const avg=totals.h/totals.ab;
  const v={games:10,avg:avg.toFixed(3),ops:(obp+slg).toFixed(3),obp:obp.toFixed(3),slg:slg.toFixed(3),runs:totals.r/10,allowed:totals.allowed/10,source:"MLB 官方近10場實際比賽"};
  teamCache.set(key,v);return v;
}
async function recentBullpenStats(id){
  const key=`bullpen-${id}-${selectedDate}`;
  if(teamCache.has(key))return teamCache.get(key);
  const end=addDays(selectedDate,-1),begin=addDays(end,-30);
  let d=await json(`${MLB_API}/schedule?sportId=1&teamId=${id}&startDate=${begin}&endDate=${end}&hydrate=team`,12000).catch(()=>null);
  let games=(d?.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>g.status?.abstractGameState==='Final')
    .sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate)).slice(0,10);
  if(games.length<10){const v={games:games.length,ip:null,era:null,whip:null,er:null,bb:null,h:null,complete:false};teamCache.set(key,v);return v}
  let ip=0,er=0,bb=0,h=0,ok=0;
  for(const g of games){
    const b=await json(`${MLB_API}/game/${g.gamePk}/boxscore`,12000).catch(()=>null);
    const side=g.teams?.away?.team?.id===id?'away':g.teams?.home?.team?.id===id?'home':null;
    const team=b?.teams?.[side];
    if(!team?.players)continue;
    const pitchers=Object.values(team.players).filter(x=>x?.stats?.pitching);
    if(!pitchers.length)continue;
    for(const pl of pitchers){
      const ps=pl.stats.pitching;
      // gamesStarted=1 的先發不計入牛棚，其餘出賽投手視為牛棚。
      if(Number(ps.gamesStarted||0)>0)continue;
      ip+=inningsToDecimal(ps.inningsPitched);
      er+=Number(ps.earnedRuns)||0;
      bb+=Number(ps.baseOnBalls)||0;
      h+=Number(ps.hits)||0;
    }
    ok++;
  }
  const v=ok===10&&ip>0?{games:10,ip,er,bb,h,era:er*9/ip,whip:(h+bb)/ip,complete:true}:{games:ok,ip:null,era:null,whip:null,er:null,bb:null,h:null,complete:false};
  teamCache.set(key,v);return v;
}
async function pitcher(id){
  if(!id)return null;if(playerCache.has(id))return playerCache.get(id);
  let season=new Date().getFullYear();
  // season + seasonAdvanced：K/9、BB/9 等由 MLB Stats API 提供；FIP 若 API 沒回傳就保持資料不足。
  let d=await json(`${MLB_API}/people/${id}/stats?stats=season,seasonAdvanced&group=pitching&season=${season}`).catch(()=>null);
  const splits=d?.stats||[];
  const basic=splits.find(x=>x.type?.displayName==="season"||x.type?.name==="season")?.splits?.[0]?.stat||splits?.[0]?.splits?.[0]?.stat||{};
  const adv=splits.find(x=>x.type?.displayName==="seasonAdvanced"||x.type?.name==="seasonAdvanced")?.splits?.[0]?.stat||{};
  const s={...basic,...adv};
  let p={
    era:s.era||"-",wins:s.wins??"-",losses:s.losses??"-",avg:s.avg||"-",whip:s.whip||"-",so:s.strikeOuts??"-",
    fip:s.fip??s.fipMinus??null,
    k9:s.strikeoutsPer9Inn??s.kPer9??null,
    bb9:s.walksPer9Inn??s.bbPer9??null,
    inningsPitched:s.inningsPitched??null,
    homeRuns:s.homeRuns??null,baseOnBalls:s.baseOnBalls??null
  };
  playerCache.set(id,p);return p;
}

  /* ---------------- MLB Official Pitcher Upgrade ---------------- */

/* MLB innings notation:
   1.0 = 1 inning
   1.1 = 1 1/3 innings
   1.2 = 1 2/3 innings
*/
function inningsToDecimal(ip){
  if(ip==null || ip==="") return 0;

  const s=String(ip).trim();

  if(!s.includes(".")){
    const n=Number(s);
    return Number.isFinite(n)?n:0;
  }

  const [whole,frac]=s.split(".");
  const w=Number(whole)||0;
  const f=Number(frac);

  if(!Number.isFinite(f)) return 0;

  if(f===1) return w+1/3;
  if(f===2) return w+2/3;

  return w+f/10;
}

function fmtIP(ip){
  if(ip==null || !Number.isFinite(Number(ip))) return "-";

  const n=Number(ip);
  const whole=Math.floor(n);
  const frac=n-whole;

  if(Math.abs(frac-1/3)<0.01) return `${whole}.1`;
  if(Math.abs(frac-2/3)<0.01) return `${whole}.2`;

  return n.toFixed(1);
}


/* MLB 官方：先發投手近 10 次先發 */
async function pitcherRecent10(id){
  if(!id) return null;

  const season=new Date().getFullYear();

  const d=await json(
    `${MLB_API}/people/${id}/stats?stats=gameLog&group=pitching&season=${season}`
  ).catch(()=>null);

  const splits=d?.stats?.find(
    x=>x.type?.displayName==="gameLog" ||
       x.type?.name==="gameLog"
  )?.splits||[];

  if(!splits.length){
    return {
      games:0,
      complete:false,
      era:null,
      whip:null,
      avg:null,
      k9:null,
      bb9:null,
      inningsPitched:0,
      earnedRuns:0,
      runs:0,
      strikeOuts:0,
      baseOnBalls:0,
      hits:0
    };
  }

  /* 只取真正有先發的比賽 */
  const starts=splits
    .filter(x=>{
      const s=x.stat||{};
      return Number(s.gamesStarted||0)>0;
    })
    .sort((a,b)=>{
      const da=new Date(a.date||0).getTime();
      const db=new Date(b.date||0).getTime();
      return db-da;
    })
    .slice(0,10);

  if(!starts.length){
    return {
      games:0,
      complete:false,
      era:null,
      whip:null,
      avg:null,
      k9:null,
      bb9:null,
      inningsPitched:0,
      earnedRuns:0,
      runs:0,
      strikeOuts:0,
      baseOnBalls:0,
      hits:0
    };
  }

  let ip=0,
      er=0,
      runs=0,
      so=0,
      bb=0,
      hits=0;

  for(const g of starts){
    const s=g.stat||{};

    ip+=inningsToDecimal(s.inningsPitched);
    er+=Number(s.earnedRuns||0);
    runs+=Number(s.runs||0);
    so+=Number(s.strikeOuts||0);
    bb+=Number(s.baseOnBalls||0);
    hits+=Number(s.hits||0);
  }

  const era=ip>0 ? er*9/ip : null;
  const whip=ip>0 ? (bb+hits)/ip : null;
  const avg=ip>0 ? hits/(hits+0) : null;
  const k9=ip>0 ? so*9/ip : null;
  const bb9=ip>0 ? bb*9/ip : null;

  return {
    games:starts.length,
    complete:starts.length>=10,

    era,
    whip,
    avg,
    k9,
    bb9,

    inningsPitched:ip,
    earnedRuns:er,
    runs,
    strikeOuts:so,
    baseOnBalls:bb,
    hits
  };
}


/* 顯示用：把近 10 次先發數據整理成穩定格式 */
function pitcherRecentSummary(p){
  if(!p) return null;

  return {
    games:p.games??0,
    complete:!!p.complete,

    era:p.era!=null?Number(p.era):null,
    whip:p.whip!=null?Number(p.whip):null,
    k9:p.k9!=null?Number(p.k9):null,
    bb9:p.bb9!=null?Number(p.bb9):null,

    inningsPitched:p.inningsPitched??0,
    earnedRuns:p.earnedRuns??0,
    runs:p.runs??0,
    strikeOuts:p.strikeOuts??0,
    baseOnBalls:p.baseOnBalls??0,
    hits:p.hits??0
  };
}

/* ---------------- Official MLB Prediction Model ---------------- */

/* 安全數字 */
function num(v,def=0){
  const n=Number(v);
  return Number.isFinite(n)?n:def;
}

/* 限制數值範圍 */
function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

/* MLB 打線攻擊力 */
function lineupAttackScore(hitterData){
  const hitters=Array.isArray(hitterData)?hitterData:(hitterData?.hitters||[]);
  if(!hitters.length) return null;

  let total=0;
  let count=0;

  for(const h of hitters){
    if(!h)continue;

    const season=h.season||{};
    const recent=h.recent10||{};
    const split=h.split||{};

    const seasonOPS=num(season.ops,NaN);
    const recentOPS=num(recent.ops,NaN);
    const splitOPS=num(split.ops,NaN);

    let values=[];

    if(Number.isFinite(seasonOPS))values.push(seasonOPS);
    if(Number.isFinite(recentOPS))values.push(recentOPS);
    if(Number.isFinite(splitOPS))values.push(splitOPS);

    if(!values.length)continue;

    /* 對先發投手左右投拆分給較高權重，
       近10場反映目前打擊狀態 */
    let score=
      (Number.isFinite(splitOPS)?splitOPS*0.45:0)+
      (Number.isFinite(recentOPS)?recentOPS*0.35:0)+
      (Number.isFinite(seasonOPS)?seasonOPS*0.20:0);

    const weight=
      (Number.isFinite(splitOPS)?0.45:0)+
      (Number.isFinite(recentOPS)?0.35:0)+
      (Number.isFinite(seasonOPS)?0.20:0);

    if(weight<=0)continue;

    total+=score/weight;
    count++;
  }

  if(!count)return null;

  return total/count;
}


/* 把 OPS 轉成相對攻擊指標 */
function normalizeOPS(ops){
  if(ops==null || !Number.isFinite(Number(ops)))return 1;

  /*
    0.600 左右：偏弱
    0.700 左右：一般
    0.800 左右：偏強
    0.900+：非常強

    只作相對模型，不直接硬加固定分數。
  */
  return clamp(Number(ops)/0.750,0.70,1.30);
}


/* 投手壓制能力 */
function pitcherSuppressionScore(p){
  if(!p)return null;

  const era=num(p.era,NaN);
  const whip=num(p.whip,NaN);
  const k9=num(p.k9,NaN);

  let score=1;
  let weight=0;

  if(Number.isFinite(era)){
    score*=clamp(3.90/Math.max(era,1.5),0.70,1.30);
    weight++;
  }

  if(Number.isFinite(whip)){
    score*=clamp(1.25/Math.max(whip,0.70),0.75,1.25);
    weight++;
  }

  if(Number.isFinite(k9)){
    score*=clamp(k9/8.5,0.80,1.20);
    weight++;
  }

  return weight?score:1;
}


/* 先發投手球季 + 近10次先發 */
function combinedPitcherScore(pitcherData){
  if(!pitcherData)return null;

  const season=pitcherData.season||pitcherData;
  const recent=pitcherData.recent10||null;

  const s=pitcherSuppressionScore(season);
  const r=recent?pitcherSuppressionScore(recent):null;

  if(s!=null && r!=null){
    /* 近期狀態稍高權重 */
    return s*0.40+r*0.60;
  }

  return s??r??1;
}


/* 球隊近期攻擊能力 */
function recentOffenseScore(recent){
  if(!recent)return 1;

  const ops=num(recent.ops,NaN);
  const runs=num(recent.runs,NaN);
  const games=num(recent.games,0);

  let score=1;

  if(Number.isFinite(ops)){
    score*=clamp(ops/0.750,0.75,1.25);
  }

  if(games>0 && Number.isFinite(runs)){
    const rpg=runs/games;
    score*=clamp(rpg/4.5,0.80,1.20);
  }

  return score;
}


/* 牛棚狀態 */
function bullpenScore(bullpen){
  if(!bullpen)return 1;

  const era=num(bullpen.era,NaN);
  const whip=num(bullpen.whip,NaN);

  let score=1;

  if(Number.isFinite(era)){
    score*=clamp(3.90/Math.max(era,1.5),0.75,1.25);
  }

  if(Number.isFinite(whip)){
    score*=clamp(1.25/Math.max(whip,0.70),0.80,1.20);
  }

  return score;
}


/* 天氣／球場環境係數
   不直接寫「下雨 +1 分」這種固定加分。
   只對模型的總得分環境做有限度調整。 */
function environmentScore(weather){
  if(!weather)return 1;
  let factor=1;
  const temp=num(weather.temp,NaN), wind=num(weather.wind,NaN);
  const condition=String(weather.condition||'').toLowerCase();
  const windText=String(weather.windText||'').toLowerCase();
  if(Number.isFinite(temp)){if(temp<45)factor*=0.97;else if(temp>=85)factor*=1.03;}
  if(/rain|shower|drizzle|thunderstorm|雨/.test(condition))factor*=0.97;
  if(Number.isFinite(wind)&&wind>=20){if(/\bout\b|blowing out|外吹/.test(windText))factor*=1.035;else if(/\bin\b|blowing in|內吹/.test(windText))factor*=0.965;else factor*=0.99;}
  return clamp(factor,0.90,1.08);
}


/* 球隊整體攻擊 + 打線 + 近期狀態 */
function teamOffenseModel({
 teamStatsData,
 recentData,
 lineupData,
 opposingPitcher
}){
  let score=1;

  const seasonOPS=num(teamStatsData?.ops,NaN);

  if(Number.isFinite(seasonOPS)){
    score*=normalizeOPS(seasonOPS);
  }

  const recent=recentOffenseScore(recentData);
  score*=recent;

  const lineupOPS=lineupAttackScore(lineupData);

  if(lineupOPS!=null){
    score*=clamp(normalizeOPS(lineupOPS),0.75,1.25);
  }

  const pitcherPenalty=combinedPitcherScore(opposingPitcher);

  if(pitcherPenalty!=null){
    /* 對方投手越強，我方預期得分越低 */
    score*=clamp(1/Math.max(pitcherPenalty,0.70),0.78,1.25);
  }

  return clamp(score,0.55,1.55);
}


/* 單隊勝負模型 */
function buildTeamWinStrength({
  teamStatsData,
  recentData,
  bullpenData,
  lineupData,
  ownPitcher,
  opposingPitcher
}){
  const offense=teamOffenseModel({
    teamStatsData,
    recentData,
    lineupData,
    opposingPitcher
  });

  const ownPitcherScore=combinedPitcherScore(ownPitcher)||1;
  const bullpen=bullpenScore(bullpenData);

  /*
    投手越強，球隊整體勝率基礎越高。
    牛棚只佔較小部分，避免與先發重複計算。
  */
  const strength=
    offense*
    Math.pow(ownPitcherScore,0.38)*
    Math.pow(bullpen,0.18);

  return clamp(strength,0.45,1.80);
}


/* 勝負機率 */
function calculateWinProbability(awayStrength,homeStrength){
  const a=num(awayStrength,1);
  const h=num(homeStrength,1);

  /*
    Logistic：
    不直接把強弱差轉成 90%+，
    避免模型過度自信。
  */
  const diff=Math.log(a/h);

  const away=1/(1+Math.exp(-diff*2.15));

  return {
    away:clamp(away,0.05,0.95),
    home:clamp(1-away,0.05,0.95)
  };
}


/* 預期得分：本季 + 近10場 + 今日實際先發打線 + 對方先發 + 牛棚 + 環境。 */
function projectedRuns({teamStatsData,recentData,lineupData,opposingPitcher,opposingBullpen,environment,isHome}){
  const seasonRPG=Number(teamStatsData?.runs)/Math.max(Number(teamStatsData?.games)||1,1);
  const recentRPG=Number(recentData?.runs)/Math.max(Number(recentData?.games)||1,1);
  const bases=[];
  if(Number.isFinite(seasonRPG))bases.push({v:seasonRPG,w:0.45});
  if(Number.isFinite(recentRPG))bases.push({v:recentRPG,w:0.35});
  let runs=bases.length?bases.reduce((x,y)=>x+y.v*y.w,0)/bases.reduce((x,y)=>x+y.w,0):4.5;
  const lineupOPS=lineupAttackScore(lineupData);
  if(Number.isFinite(lineupOPS))runs*=clamp(1+((lineupOPS-0.750)/0.750)*0.20,0.90,1.12);
  const starter=combinedPitcherScore(opposingPitcher);
  if(starter!=null)runs*=clamp(1/Math.max(starter,0.70),0.82,1.20);
  const bullpen=bullpenScore(opposingBullpen);
  if(Number.isFinite(bullpen))runs*=clamp(1/Math.max(bullpen,0.75),0.90,1.10);
  runs*=environmentScore(environment);
  if(isHome)runs*=1.025;
  return clamp(runs,1.5,9.0);
}

/* 完整官方模型 */
function buildOfficialPredictionModel({
  awayStats,
  homeStats,
  awayRecent,
  homeRecent,
  awayBullpen,
  homeBullpen,
  awayLineup,
  homeLineup,
  awayPitcher,
  homePitcher,
  weather
}){
  const awayStrength=buildTeamWinStrength({
    teamStatsData:awayStats,
    recentData:awayRecent,
    bullpenData:awayBullpen,
    lineupData:awayLineup,
    ownPitcher:awayPitcher,
    opposingPitcher:homePitcher
  });

  const homeStrength=buildTeamWinStrength({
    teamStatsData:homeStats,
    recentData:homeRecent,
    bullpenData:homeBullpen,
    lineupData:homeLineup,
    ownPitcher:homePitcher,
    opposingPitcher:awayPitcher
  });

  const probability=
    calculateWinProbability(
      awayStrength,
      homeStrength
    );

  const awayRuns=projectedRuns({
    teamStatsData:awayStats,
    recentData:awayRecent,
    lineupData:awayLineup,
    opposingPitcher:homePitcher,
    opposingBullpen:homeBullpen,
    environment:weather,
    isHome:false
  });

  const homeRuns=projectedRuns({
    teamStatsData:homeStats,
    recentData:homeRecent,
    lineupData:homeLineup,
    opposingPitcher:awayPitcher,
    opposingBullpen:awayBullpen,
    environment:weather,
    isHome:true
  });

  return {
    awayStrength,
    homeStrength,

    awayWin:probability.away,
    homeWin:probability.home,

    awayRuns,
    homeRuns,

    totalRuns:awayRuns+homeRuns,

    source:"MLB 官方資料模型"
  };
}
  
  /* ---------------- MLB 官方打者資料 ----------------
   第 2 段：
   1. 官方今日先發打線
   2. 打者本季打擊
   3. 打者最近 10 場
   4. 對右投 / 對左投拆分
   全部只使用 MLB Stats API。
---------------------------------------------------- */

function battingNumber(v){
  const n=Number(v);
  return Number.isFinite(n)?n:null;
}

function battingAvgValue(v){
  const n=Number(v);
  return Number.isFinite(n)?n:null;
}

/* 取得 MLB 官方 feed 中今天已公布的實際打線。
   battingOrder 100~900 分別代表第 1~9 棒。
   如果官方尚未公布，回傳空陣列，不自行猜測。
*/
function officialLineup(feedData,side){
  const team=feedData?.liveData?.boxscore?.teams?.[side]||{};
  const players=team.players||{};

  /* MLB 官方 feed 公布打線後，通常可由 players 的 battingOrder 取得。
     若該欄位尚未同步，改用官方 batters 陣列依序讀取；不使用第三方資料。 */
  let list=Object.values(players)
    .filter(p=>p?.battingOrder!=null)
    .map(p=>({
      order:Number(p.battingOrder),
      id:p.person?.id,
      name:p.person?.fullName||"-",
      position:p.position?.abbreviation||p.position?.name||"-",
      battingSide:p.bats?.code||p.bats?.description||"-"
    }))
    .filter(p=>p.id&&Number.isFinite(p.order))
    .sort((a,b)=>a.order-b.order);

  if(list.length<9 && Array.isArray(team.batters)){
    const existing=new Set(list.map(x=>x.id));
    for(let i=0;i<team.batters.length;i++){
      const id=Number(team.batters[i]);
      if(!id||existing.has(id))continue;
      const p=players[`ID${id}`]||players[id]||Object.values(players).find(x=>Number(x?.person?.id)===id);
      if(!p?.person?.id)continue;
      list.push({
        order:(i+1)*100,
        id:p.person.id,
        name:p.person.fullName||"-",
        position:p.position?.abbreviation||p.position?.name||"-",
        battingSide:p.bats?.code||p.bats?.description||"-"
      });
      existing.add(id);
    }
    list.sort((a,b)=>a.order-b.order);
  }

  return list.slice(0,9);
}

/* MLB 官方球員本季打擊資料 */
async function hitterSeason(id){
  if(!id)return null;

  const key=`hitter-season-${id}-${new Date().getFullYear()}`;
  if(playerCache.has(key))return playerCache.get(key);

  const d=await json(

  ).catch(()=>null);

  const s=d?.stats?.[0]?.splits?.[0]?.stat||{};

  const v={
    games:battingNumber(s.gamesPlayed),
    pa:battingNumber(s.plateAppearances),
    ab:battingNumber(s.atBats),
    avg:battingAvgValue(s.avg),
    obp:battingAvgValue(s.obp),
    slg:battingAvgValue(s.slg),
    ops:battingAvgValue(s.ops),
    hits:battingNumber(s.hits),
    doubles:battingNumber(s.doubles),
    triples:battingNumber(s.triples),
    homeRuns:battingNumber(s.homeRuns),
    runs:battingNumber(s.runs),
    rbi:battingNumber(s.rbi),

    stolenBases:battingNumber(s.stolenBases),

  };

  playerCache.set(key,v);
  return v;
}

/* MLB 官方球員最近 10 場打擊。
   使用 gameLog，而不是用本季數據假裝成近況。
*/
async function hitterRecent10(id){
  if(!id)return null;

  const key=`hitter-recent10-${id}-${selectedDate}`;
  if(playerCache.has(key))return playerCache.get(key);

  const season=new Date().getFullYear();

  const d=await json(
    `${MLB_API}/people/${id}/stats?stats=gameLog&group=hitting&season=${season}`,
    12000
  ).catch(()=>null);

  const splits=d?.stats?.[0]?.splits||[];

  const games=splits
    .filter(x=>x?.stat)
    .sort((a,b)=>{
      const da=new Date(a.date||0).getTime();
      const db=new Date(b.date||0).getTime();
      return db-da;
    })
    .slice(0,10);

  if(games.length===0){
    const v={
      games:0,
      avg:null,
      obp:null,
      slg:null,
      ops:null,
      hits:null,
      homeRuns:null,
      runs:null,
      rbi:null,
      strikeOuts:null,
      source:"MLB 官方近10場（無資料）"
    };
    playerCache.set(key,v);
    return v;
  }

  let ab=0,h=0,bb=0,hbp=0,sf=0;
  let doubles=0,triples=0,hr=0,r=0,rbi=0,so=0;

  for(const g of games){
    const s=g.stat||{};

    ab+=Number(s.atBats)||0;
    h+=Number(s.hits)||0;
    bb+=Number(s.baseOnBalls)||0;
    hbp+=Number(s.hitByPitch)||0;
    sf+=Number(s.sacFlies)||0;

    doubles+=Number(s.doubles)||0;
    triples+=Number(s.triples)||0;
    hr+=Number(s.homeRuns)||0;

    r+=Number(s.runs)||0;
    rbi+=Number(s.rbi)||0;
    so+=Number(s.strikeOuts)||0;
  }

  const singles=h-doubles-triples-hr;
  const totalBases=
    singles+
    doubles*2+
    triples*3+
    hr*4;

  const avg=ab>0?h/ab:null;

  const obpDen=
    ab+
    bb+
    hbp+
    sf;

  const obp=obpDen>0?(h+bb+hbp)/obpDen:null;
  const slg=ab>0?totalBases/ab:null;
  const ops=
    obp!=null&&slg!=null
      ?obp+slg
      :null;

  const v={
    games:games.length,
    avg,
    obp,
    slg,
    ops,
    hits:h,
    homeRuns:hr,
    runs:r,
    rbi,
    strikeOuts:so,
    source:games.length>=10
      ?"MLB 官方近10場實際比賽"
      :"MLB 官方近10場（資料不足10場）"
  };

  playerCache.set(key,v);
  return v;
}

/* MLB 官方左右投拆分。
   sitCodes:
   vr = vs RHP
   vl = vs LHP

   如果 MLB API 沒有回傳拆分資料，就保持 null，
   絕不拿其他資料猜一個數字。
*/
async function hitterSplit(id,hand){
  if(!id||!hand)return null;

  const h=String(hand).toUpperCase().startsWith("L")?"L":"R";
  const key=`hitter-split-${id}-${h}-${new Date().getFullYear()}`;

  if(playerCache.has(key))return playerCache.get(key);

  const sitCode=h==="L"?"vl":"vr";
  const season=new Date().getFullYear();

  const d=await json(
    `${MLB_API}/people/${id}/stats?stats=statSplits&group=hitting&season=${season}&sitCodes=${sitCode}`,
    12000
  ).catch(()=>null);

  const splits=d?.stats?.[0]?.splits||[];

  let s=null;

  if(splits.length){
    s=splits[0]?.stat||null;
  }

  /* 某些 MLB API 回傳結構可能把 stat 放在 stats 第一層，
     因此再做一次保守備援，但仍只接受 MLB 官方回傳。 */
  if(!s){
    s=d?.stats?.[0]?.stat||null;
  }

  const v=s?{
    avg:battingAvgValue(s.avg),
    obp:battingAvgValue(s.obp),
    slg:battingAvgValue(s.slg),
    ops:battingAvgValue(s.ops),
    pa:battingNumber(s.plateAppearances),
    ab:battingNumber(s.atBats),
    hits:battingNumber(s.hits),
    homeRuns:battingNumber(s.homeRuns),
    runs:battingNumber(s.runs),
    rbi:battingNumber(s.rbi),
    strikeOuts:battingNumber(s.strikeOuts),
    walks:battingNumber(s.baseOnBalls),
    source:`MLB 官方對${h==="L"?"左":"右"}投拆分`
  }:{
    avg:null,
    obp:null,
    slg:null,
    ops:null,
    pa:null,
    ab:null,
    hits:null,
    homeRuns:null,
    runs:null,
    rbi:null,
    strikeOuts:null,
    walks:null,
    source:"MLB 官方拆分資料不足"
  };

  playerCache.set(key,v);
  return v;
}

/* 依照今天對手先發投手的投球慣用手，
   一次取得整條先發打線的：
   本季 + 近10場 + 對應左右投拆分。
*/
async function buildOfficialHitterData(feedData,side,opposingPitcherHand){
  const lineup=officialLineup(feedData,side);

  if(!lineup.length){
    return {
      lineup:[],
      announced:false,
      hitters:[],
      source:"MLB 官方打線尚未公布"
    };
  }

  const hitters=await Promise.all(
    lineup.map(async p=>{
      const [season,recent,split]=await Promise.all([
        hitterSeason(p.id),
        hitterRecent10(p.id),
        hitterSplit(p.id,opposingPitcherHand)
      ]);

      return {
        ...p,
        season,
        recent,
        split
      };
    })
  );

  return {
    lineup,
    announced:true,
    hitters,
    pitcherHand:opposingPitcherHand||null,
    source:"MLB 官方"
  };
}

/* 計算今天實際 1~9 棒的整體打線指標。
   沒有資料的打者不會被當成 0，而是排除在平均值之外。
*/
function lineupSummary(hitterData){
  const hitters=hitterData?.hitters||[];

  if(!hitters.length){
    return {
      count:0,
      avg:null,
      ops:null,
      recentOps:null,
      splitOps:null,
      homeRuns:null,
      source:"官方打線尚未公布"
    };
  }

  const avgOf=(arr,key)=>{
    const a=arr
      .map(x=>Number(x?.[key]))
      .filter(Number.isFinite);

    return a.length
      ? a.reduce((sum,n)=>sum+n,0)/a.length
      : null;
  };

  return {
    count:hitters.length,

    avg:avgOf(
      hitters.map(x=>x.season),
      "avg"
    ),

    ops:avgOf(
      hitters.map(x=>x.season),
      "ops"
    ),

    recentOps:avgOf(
      hitters.map(x=>x.recent),
      "ops"
    ),

    splitOps:avgOf(
      hitters.map(x=>x.split),
      "ops"
    ),

    homeRuns:hitters.reduce(
      (sum,x)=>sum+(Number(x.season?.homeRuns)||0),
      0
    ),

const MODEL_VERSION="V2.0";
const PRED_STORE_KEY="mlb_model_predictions_v2";
const CLOUD_API="https://script.google.com/macros/s/AKfycbwQUlRdKkM-mjFw_56NBoEjdsM2ScYW0zVT8N9JnAW6_-XrN8frZuey068W0CQHPGootQ/exec";
let cloudHistory=[];
let cloudLoaded=false;
function seasonPhase(date){
  const m=Number(String(date||"").slice(5,7)),d=Number(String(date||"").slice(8,10));
  if(!m)return {name:"未知",recentWeight:0.20};
  if(m<=4)return {name:"開季",recentWeight:0.12};
  if(m<=6)return {name:"前半季",recentWeight:0.16};
  if(m===7)return {name:"全明星前後",recentWeight:0.18};
  if(m===8)return {name:"後半季",recentWeight:0.22};
  if(m===9)return {name:"9月／季末",recentWeight:0.26};
  return {name:"季末",recentWeight:0.24};
}
function loadPredictionRecords(){
  try{return JSON.parse(localStorage.getItem(PRED_STORE_KEY)||"[]")}catch{return []}
}
function cloudRecordFromLocal(rec){
  if(!rec?.gamePk || rec.confidence==null || rec.winnerSide==="tie")return null;
  const predictedWinner=rec.predictedWinner||rec.winnerSide;
  return {
    gamePk:rec.gamePk,
    selectedDate:rec.selectedDate||"",
    gameDate:rec.gameDate||"",
    away:rec.away||"",
    home:rec.home||"",
    predictedWinner,
    confidence:Number(rec.confidence),
    actualWinner:rec.settled?rec.actualWinner||"":"",
    hit:rec.settled?(rec.winnerHit?"⭕️命中":"❌未命中"):"",
    settledAt:rec.settled?(rec.settledAt||new Date().toISOString()):"",
    modelVersion:rec.modelVersion||MODEL_VERSION
  };
}
function syncPredictionRecordToCloud(rec){
  const data=cloudRecordFromLocal(rec);
  if(!data)return;
  const i=cloudHistory.findIndex(x=>String(x.gamePk)===String(data.gamePk));
  if(i>=0)cloudHistory[i]={...cloudHistory[i],...data};else cloudHistory.push(data);
  fetch(CLOUD_API,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  }).catch(()=>{});
}
function loadCloudHistory(){
  return new Promise(resolve=>{
    const cb="__mlbCloudHistory_"+Date.now();
    const script=document.createElement("script");
    let done=false;
    const finish=(data)=>{
      if(done)return;done=true;
      cloudHistory=Array.isArray(data)?data:[];
      cloudLoaded=true;
      try{delete window[cb]}catch{}
      script.remove();
      resolve();
    };
    window[cb]=finish;
    script.onerror=()=>finish([]);
    script.src=CLOUD_API+"?callback="+cb+"&_="+Date.now();
    document.head.appendChild(script);
    setTimeout(()=>finish([]),10000);
  });
}
function savePredictionRecord(rec){
  try{
    const all=loadPredictionRecords();
    const i=all.findIndex(x=>x.gamePk===rec.gamePk);
    let saved;
    if(i>=0){
      // 已保存的賽前預測只補缺少的欄位，不讓後續重新計算覆蓋原始預測或完賽結果。
      all[i]={...all[i],...rec,
        predA:all[i].predA,
        predH:all[i].predH,
        winnerSide:all[i].winnerSide,
        createdAt:all[i].createdAt,
        confidence:all[i].confidence!=null?all[i].confidence:rec.confidence,
        settled:all[i].settled===true?true:rec.settled,
        actualWinner:all[i].actualWinner||rec.actualWinner||"",
        actualAway:all[i].actualAway??rec.actualAway,
        actualHome:all[i].actualHome??rec.actualHome,
        winnerHit:all[i].winnerHit??rec.winnerHit,
        settledAt:all[i].settledAt||rec.settledAt||""
      };
      saved=all[i];
    }else{all.push(rec);saved=rec;}
    localStorage.setItem(PRED_STORE_KEY,JSON.stringify(all.slice(-2000)));
    // 只把「勝負分析」的 confidence（p.confidence）同步到 Google Sheets。
    syncPredictionRecordToCloud(saved);
  }catch{}
}
function settlePredictionRecord(g){
  if(!g?.gamePk)return;
  // 只有 MLB 官方狀態明確為 Final，才允許把預測列入當日準確度。
  if(g.status?.abstractGameState!=="Final")return;
  const a=Number(g.teams?.away?.score),h=Number(g.teams?.home?.score);
  if(!Number.isFinite(a)||!Number.isFinite(h))return;
  const actual=a>h?'away':h>a?'home':'tie';
  const all=loadPredictionRecords();
  const i=all.findIndex(x=>x.gamePk===g.gamePk);
  if(i<0)return; // 沒有保存過賽前預測，不倒推
  const rec=all[i];
  if(rec.settled){syncPredictionRecordToCloud(rec);return;}
  rec.actualWinner=actual;rec.actualAway=a;rec.actualHome=h;rec.settled=true;
  rec.winnerHit=rec.winnerSide===actual;
  rec.settledAt=new Date().toISOString();
  if(rec.predA!=null&&rec.predH!=null){
    rec.awayError=Math.abs(Number(rec.predA)-a);
    rec.homeError=Math.abs(Number(rec.predH)-h);
    rec.totalError=Math.abs((Number(rec.predA)+Number(rec.predH))-(a+h));
    rec.scoreMAE=(rec.awayError+rec.homeError)/2;
  }
  localStorage.setItem(PRED_STORE_KEY,JSON.stringify(all));
  syncPredictionRecordToCloud(rec);
}
function updateAccuracy(g,p){

function prediction(g,ps,aStats,hStats,ap,hp,aRecent,hRecent,weather,aBull,hBull){
  const reasons=[];
  let scoreA=0,scoreH=0;
  if(ap?.era!=null&&hp?.era!=null){

    if(Number.isFinite(ea)&&Number.isFinite(eh)){
      if(ea<eh){scoreA+=2;reasons.push(`客隊先發 ERA ${ea.toFixed(2)} 優於主隊 ${eh.toFixed(2)}`)}
      else if(eh<ea){scoreH+=2;reasons.push(`主隊先發 ERA ${eh.toFixed(2)} 優於客隊 ${ea.toFixed(2)}`)}
    }
  }
  if(aRecent?.avg!=null&&hRecent?.avg!=null){
    const aa=Number(aRecent.avg),ah=Number(hRecent.avg);
    if(aa>ah){scoreA++;reasons.push(`客隊近10場 AVG ${aRecent.avg} 高於主隊 ${hRecent.avg}`)}

  }
  if(aStats?.ops!=null&&hStats?.ops!=null){
    const oa=Number(aStats.ops),oh=Number(hStats.ops);
    if(oa>oh){scoreA++;reasons.push(`客隊本季 OPS ${aStats.ops} 高於主隊 ${hStats.ops}`)}

    if(Number(aBull.era)<Number(hBull.era)){scoreA++;reasons.push(`客隊近10場牛棚 ERA ${aBull.era.toFixed(2)} 優於主隊 ${hBull.era.toFixed(2)}`)}
    else if(Number(hBull.era)<Number(aBull.era)){scoreH++;reasons.push(`主隊近10場牛棚 ERA ${hBull.era.toFixed(2)} 優於客隊 ${aBull.era.toFixed(2)}`)}
  }
  const winnerSide=scoreA>scoreH?'away':scoreH>scoreA?'home':'tie';
  const awayLabel=teamNames[code(g.teams.away)]||g.teams.away.team?.name||'客隊';
  const homeLabel=teamNames[code(g.teams.home)]||g.teams.home.team?.name||'主隊';
  const winner=winnerSide==='away'?`${awayLabel}較優`:winnerSide==='home'?`${homeLabel}較優`:'勝負五五開';
  const confidence=reasons.length?Math.min(85,50+Math.abs(scoreA-scoreH)*8):null;

  let ouPick='資料不足（暫停分析）',ouConf=null,ou=[],detail=[];
  let predA=null,predH=null,total=null;
  const phase=seasonPhase(selectedDate);
  const completeRecent=aRecent?.games===10&&hRecent?.games===10&&aRecent?.runs!=null&&hRecent?.runs!=null&&aRecent?.allowed!=null&&hRecent?.allowed!=null;
  const completeStarters=ap?.era!=null&&hp?.era!=null&&Number.isFinite(Number(ap.era))&&Number.isFinite(Number(hp.era));
  const completeHitting=aStats?.ops!=null&&hStats?.ops!=null&&Number.isFinite(Number(aStats.ops))&&Number.isFinite(Number(hStats.ops));
  const completeBull=aBull?.complete&&hBull?.complete;
  if(completeRecent&&completeStarters&&completeHitting&&completeBull){
    const baseA=(Number(aRecent.runs)+Number(hRecent.allowed))/2;
    const baseH=(Number(hRecent.runs)+Number(aRecent.allowed))/2;
    const opsAdjA=Math.max(-0.40,Math.min(0.40,(Number(aStats.ops)-0.700)*1.0));
    const opsAdjH=Math.max(-0.40,Math.min(0.40,(Number(hStats.ops)-0.700)*1.0));
    const starterAdjA=Math.max(-0.40,Math.min(0.40,(4-Number(hp.era))*0.18));
    const starterAdjH=Math.max(-0.40,Math.min(0.40,(4-Number(ap.era))*0.18));
    const bullpenAdjA=Math.max(-0.35,Math.min(0.35,(Number(hBull.era)-4)*0.10));
    const bullpenAdjH=Math.max(-0.35,Math.min(0.35,(Number(aBull.era)-4)*0.10));
    // 賽季階段只微調「近期得失分」的影響，避免開季小樣本過度放大。
    const phaseAdjA=(Number(aRecent.runs)-Number(aRecent.allowed))*phase.recentWeight*0.08;
    const phaseAdjH=(Number(hRecent.runs)-Number(hRecent.allowed))*phase.recentWeight*0.08;
    predA=Math.max(0,baseA+opsAdjA+starterAdjA+bullpenAdjA+phaseAdjA);

    ouConf=Math.round(Math.min(85,55+Math.abs(predA-predH)*4));
    detail=[
      `客隊基礎 ${baseA.toFixed(2)} =（客隊近10場場均得分 ${Number(aRecent.runs).toFixed(2)} + 主隊近10場場均失分 ${Number(hRecent.allowed).toFixed(2)}）÷ 2`,
      `主隊基礎 ${baseH.toFixed(2)} =（主隊近10場場均得分 ${Number(hRecent.runs).toFixed(2)} + 客隊近10場場均失分 ${Number(aRecent.allowed).toFixed(2)}）÷ 2`,
      `打擊修正：客 ${opsAdjA>=0?'+':''}${opsAdjA.toFixed(2)}（OPS ${aStats.ops}），主 ${opsAdjH>=0?'+':''}${opsAdjH.toFixed(2)}（OPS ${hStats.ops}）`,
      `先發修正：客 ${starterAdjA>=0?'+':''}${starterAdjA.toFixed(2)}（對手先發 ERA ${hp.era}），主 ${starterAdjH>=0?'+':''}${starterAdjH.toFixed(2)}（對手先發 ERA ${ap.era}）`,
      `牛棚修正：客 ${bullpenAdjA>=0?'+':''}${bullpenAdjA.toFixed(2)}（主隊牛棚 ERA ${hBull.era.toFixed(2)}），主 ${bullpenAdjH>=0?'+':''}${bullpenAdjH.toFixed(2)}（客隊牛棚 ERA ${aBull.era.toFixed(2)}）`,
      `賽季階段：${phase.name}；近期狀態權重 ${Math.round(phase.recentWeight*100)}%（模型參數，非 MLB 官方數據）`,
      `賽季階段修正：客 ${phaseAdjA>=0?'+':''}${phaseAdjA.toFixed(2)}、主 ${phaseAdjH>=0?'+':''}${phaseAdjH.toFixed(2)}`
    ];
    ou.push(`客隊預估 ${predA.toFixed(1)} 分、主隊預估 ${predH.toFixed(1)} 分`);
  }else{
    const missing=[];
    if(!completeRecent)missing.push('最近10場得失分');
    if(!completeHitting)missing.push('兩隊本季 OPS');
    if(!completeStarters)missing.push('兩隊先發 ERA');

}

  // Final 比賽立即依實際終場比分結算，讓上方準確度與場內徽章一致。

async function load(){
  const my=++version;if(timer){clearInterval(timer);timer=null}
  setDateUI();document.getElementById("accuracy").innerHTML=accuracyHTML();document.getElementById("games").innerHTML=`<div class="loading">正在載入 ${fmtDate()}…<br><br>同步 MLB 官方資料</div>`;
  try{
    let games=await mlbSchedule();
    if(my!==version)return;
    document.getElementById("total").textContent=games.length;
    let counts={preview:0,live:0,final:0};games.forEach(g=>{counts[gameStatus(g)[1]]++});
    document.getElementById("preview").textContent=counts.preview;document.getElementById("live").textContent=counts.live;document.getElementById("final").textContent=counts.final;
    if(!games.length){document.getElementById("games").innerHTML=`<div class="loading">這一天沒有抓到 MLB 賽程。</div>`;return}
    let live={};
    // 每場直接讀 MLB 官方 feed/live，取得 gameData.weather；不使用第三方天氣估算。
    let feedList=await Promise.all(games.map(g=>feed(g)));
    let feedData={};games.forEach((g,i)=>{if(feedList[i])feedData[g.gamePk]=feedList[i]});
    let box=document.getElementById("games");box.innerHTML="";
    for(const g of games){if(my!==version)break;box.insertAdjacentHTML("beforeend",await renderGame(g,live,feedData))}
    document.getElementById("accuracy").innerHTML=accuracyHTML();
    document.getElementById("refreshInfo").textContent=`最後更新：${new Date().toLocaleTimeString("zh-TW")} ｜ MLB 官方資料 ｜ 台灣時間 ｜ 每 15 秒更新比分`;
    timer=setInterval(()=>refreshLive(games,my),15000);
  }catch(e){
    document.getElementById("games").innerHTML=`<div class="error">載入失敗：${esc(e.message)}<br><br>MLB 官方資料目前無法連線。<br>請稍後重新整理。</div>`;
  }
}
async function refreshLive(games,my){
  if(my!==version)return;
  try{
    const feedList=await Promise.all(games.map(g=>feed(g)));
    if(my!==version)return;

    const feedData={};
    const refreshed=[];

    games.forEach((g,i)=>{
      const fd=feedList[i];
      if(fd)feedData[g.gamePk]=fd;
      const status=fd?.gameData?.status||{};
      const linescore=fd?.liveData?.linescore||{};
      const awayScore=Number.isFinite(Number(linescore?.teams?.away?.runs))?Number(linescore.teams.away.runs):g.teams?.away?.score;
      const homeScore=Number.isFinite(Number(linescore?.teams?.home?.runs))?Number(linescore.teams.home.runs):g.teams?.home?.score;
      refreshed.push({
        ...g,
        status:{...g.status,abstractGameState:status.abstractGameState||g.status?.abstractGameState,detailedState:status.detailedState||g.status?.detailedState},
        teams:{...g.teams,away:{...g.teams.away,score:awayScore},home:{...g.teams.home,score:homeScore}}
      });
    });

    const box=document.getElementById("games");
    if(!box)return;

    const openPk=new Set([...document.querySelectorAll(".game-card")]
      .filter(card=>card.querySelector(".game-details.open"))
      .map(card=>{
        const m=card.querySelector(".game-top .muted")?.textContent?.match(/(\d+)/);
        return m?m[1]:null;
      }).filter(Boolean));

    let html="";
    for(const g of refreshed){
      if(my!==version)break;
      html+=await renderGame(g,{},feedData);
    }
    if(my!==version)return;
    box.innerHTML=html;

    [...document.querySelectorAll(".game-card")].forEach(card=>{
      const m=card.querySelector(".game-top .muted")?.textContent?.match(/(\d+)/);
      if(m&&openPk.has(m[1])){
        const btn=card.querySelector(".detail-toggle");
        const details=card.querySelector(".game-details");
        if(btn&&details){details.classList.add("open");btn.textContent="▲ 收起詳細資料";}
      }
    });

    document.getElementById("accuracy").innerHTML=accuracyHTML();
    document.getElementById("refreshInfo").textContent=`最後更新：${new Date().toLocaleTimeString("zh-TW")} ｜ MLB 官方資料 ｜ 台灣時間 ｜ 每 15 秒更新比分`;
  }catch(e){}
}
document.getElementById("prev").onclick=()=>{selectedDate=addDays(selectedDate,-1);load()};
document.getElementById("next").onclick=()=>{selectedDate=addDays(selectedDate,1);load()};
document.getElementById("today").onclick=()=>{selectedDate=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});load()};
load();
