<script>

/* =====================================================
   基本設定
===================================================== */

const MLB_API =
  "https://statsapi.mlb.com/api/v1";


/*
 * 非常重要：
 *
 * 日期完全按照 PlaySport：
 *
 * 2026-09-13
 *
 * ↓
 *
 * 20260913
 */

let selectedDate =
  "2026-09-13";


/* =====================================================
   日期工具
===================================================== */

function dateToPlaySport(date) {

  return date.replaceAll("-", "");

}


function addDays(dateString, days) {

  const parts =
    dateString
      .split("-")
      .map(Number);

  const date =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
      )
    );

  date.setUTCDate(
    date.getUTCDate() + days
  );

  return date
    .toISOString()
    .slice(0, 10);

}


function formatDate(date) {

  const parts =
    date.split("-");

  return `${parts[0]}/${parts[1]}/${parts[2]}`;

}


function getPlaySportURL() {

  return (
    "https://www.playsport.cc/livescore/1" +
    "?gamedate=" +
    dateToPlaySport(selectedDate) +
    "&mode=2"
  );

}


/* =====================================================
   更新日期
===================================================== */

function updateDateUI() {

  const previous =
    addDays(selectedDate, -1);

  const next =
    addDays(selectedDate, 1);

  document
    .getElementById("prevDay")
    .textContent =
      `← ${previous.slice(5).replace("-", "/")}`;

  document
    .getElementById("nextDay")
    .textContent =
      `${next.slice(5).replace("-", "/")} →`;

  document
    .getElementById("today")
    .textContent =
      selectedDate === "2026-09-13"
      ? "09/13 今天"
      : "回到 09/13";

  document
    .getElementById("dateText")
    .textContent =
      `${formatDate(selectedDate)} ｜ PlaySport ${dateToPlaySport(selectedDate)}`;

}


/* =====================================================
   MLB API
===================================================== */

async function getJSON(url) {

  const response =
    await fetch(url);

  if (!response.ok) {

    throw new Error(
      `API ${response.status}`
    );

  }

  return response.json();

}


/* =====================================================
   載入 MLB
===================================================== */

async function loadMLBGames() {

  const gamesBox =
    document.getElementById("games");

  gamesBox.innerHTML = `
    <div class="loading">
      正在載入 ${formatDate(selectedDate)}
      MLB 比賽...
    </div>
  `;

  updateDateUI();


  try {

    /*
     * MLB API 用同一天日期抓取。
     *
     * PlaySport 日期則負責決定
     * 我們現在看的「哪一天」。
     */

    const playSportDate =
      dateToPlaySport(selectedDate);


    const url =
      `${MLB_API}/schedule` +
      `?sportId=1` +
      `&date=${selectedDate}` +
      `&hydrate=team,probablePitcher`;


    const data =
      await getJSON(url);


    let games = [];

    if (data.dates) {

      data.dates.forEach(day => {

        if (day.games) {

          games =
            games.concat(day.games);

        }

      });

    }


    /*
     * 排序
     */

    games.sort(
      (a, b) =>
        new Date(a.gameDate) -
        new Date(b.gameDate)
    );


    /*
     * Summary
     */

    let preview = 0;
    let live = 0;
    let final = 0;


    games.forEach(game => {

      const state =
        game.status?.abstractGameState;

      if (state === "Preview") {

        preview++;

      }

      else if (state === "Live") {

        live++;

      }

      else if (state === "Final") {

        final++;

      }

    });


    document
      .getElementById("totalGames")
      .textContent =
        games.length;

    document
      .getElementById("previewGames")
      .textContent =
        preview;

    document
      .getElementById("liveGames")
      .textContent =
        live;

    document
      .getElementById("finalGames")
      .textContent =
        final;


    if (!games.length) {

      gamesBox.innerHTML = `
        <div class="empty">

          <h3>
            ${formatDate(selectedDate)}
            沒有找到 MLB 比賽
          </h3>

          <p>
            PlaySport 日期：
            ${playSportDate}
          </p>

        </div>
      `;

      return;

    }


    gamesBox.innerHTML = "";


    /*
     * 建立每一場
     */

    for (const game of games) {

      const card =
        await createGameCard(game);

      gamesBox.appendChild(card);

    }


  }

  catch(error) {

    console.error(error);

    gamesBox.innerHTML = `

      <div class="error">

        <h3>
          ⚠️ MLB 資料載入失敗
        </h3>

        <p>
          ${error.message}
        </p>

        <button onclick="loadMLBGames()">
          重新載入
        </button>

      </div>

    `;

  }

}


/* =====================================================
   建立比賽
===================================================== */

async function createGameCard(game) {

  let feed = null;


  try {

    feed =
      await getJSON(
        `${MLB_API}/game/${game.gamePk}/feed/live`
      );

  }

  catch(error) {

    console.warn(
      "Live Feed 讀取失敗",
      game.gamePk
    );

  }


  const gameData =
    feed?.gameData || {};

  const liveData =
    feed?.liveData || {};


  const away =
    game.teams.away;

  const home =
    game.teams.home;


  const status =
    game.status?.abstractGameState ||
    "Preview";


  let statusText =
    "尚未開打";

  let statusClass =
    "status-preview";


  if (status === "Live") {

    statusText =
      "🔴 進行中";

    statusClass =
      "status-live";

  }

  else if (status === "Final") {

    statusText =
      "✅ 比賽結束";

    statusClass =
      "status-final";

  }


  /*
   * 台灣顯示時間
   */

  const taiwanTime =
    new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone: "Asia/Taipei",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    )
    .format(
      new Date(game.gameDate)
    );


  /*
   * 投手
   */

  const awayPitcher =
    gameData.probablePitchers?.away;

  const homePitcher =
    gameData.probablePitchers?.home;


  const awayPitcherName =
    awayPitcher?.fullName ||
    "尚未公布";


  const homePitcherName =
    homePitcher?.fullName ||
    "尚未公布";


  /*
   * 比分
   */

  let score =
    "VS";


  if (
    status === "Live" ||
    status === "Final"
  ) {

    score =
      `${away.score ?? 0} - ${home.score ?? 0}`;

  }


  /*
   * 建立卡片
   */

  const card =
    document.createElement("div");

  card.className =
    "game-card";


  card.innerHTML = `

    <div class="game-top">

        ${taiwanTime}

      <div class="game-status ${statusClass}">
        ${statusText}
      </div>

            font-size:12px;
            margin-top:3px;
          ">
            客隊
          </div>

        </div>


        <img
          class="logo"
          src="https://www.mlbstatic.com/team-logos/${away.team.id}.svg"
          alt="${away.team.name}"
        >

      </div>


      <div class="score">
        ${score}
      </div>


      <div class="team home">

        <img
          class="logo"
          src="https://www.mlbstatic.com/team-logos/${home.team.id}.svg"
          alt="${home.team.name}"
        >


        <div>

          <div class="team-name">
            ${home.team.name}
          </div>

          <div style="
            color:#888;
            font-size:12px;
            margin-top:3px;
          ">
            主隊
          </div>

        </div>

      </div>

    </div>


    <!-- 投手 -->

    <div class="pitcher">

      <div class="pitcher-box">

        <div class="pitcher-title">
          客隊先發
        </div>

        <div class="pitcher-name">
          ${awayPitcherName}
        </div>

      </div>


      <div class="pitcher-box">

        <div class="pitcher-title">
          主隊先發
        </div>

        <div class="pitcher-name">
          ${homePitcherName}
        </div>

      </div>

    </div>


    <!-- 團隊資料 -->

    <div class="data-section">

      <div class="data-title">
        團隊資料
      </div>


      <table class="data-table">

        <thead>

          <tr>

            <th>
              項目
            </th>

            <th>
              ${away.team.name}
            </th>

            <th>
              ${home.team.name}
            </th>

          </tr>

        </thead>


        <tbody>

          <tr>

            <td>
              2026 戰績
            </td>

            <td>
              待接入
            </td>

            <td>
              待接入
            </td>

          </tr>


          <tr>

            <td>
              主 / 客戰績
            </td>

            <td>
              待接入
            </td>

            <td>
              待接入
            </td>

          </tr>


          <tr>

            <td>
              近10場
            </td>

            <td>
              待接入
            </td>

            <td>
              待接入
            </td>

          </tr>

              H2H

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- 市場 -->

    <div class="data-section">

      <div class="data-title">
        市場資料
      </div>


      <table class="data-table">

        <thead>

          <tr>

            <th>
              項目
            </th>

            <th>
              客隊
            </th>

            <th>
              主隊
            </th>

          </tr>

        </thead>


        <tbody>

          <tr>

            <td>
              今日讓分
            </td>

            <td>
              待接入
            </td>

            <td>
              待接入

          </tr>


          <tr>

            </td>

          </tr>

            </td>

          </tr>


          <tr>

            </td>

            <td colspan="2">
              待接入
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- 分析 -->

    <div class="analysis">

      <div class="analysis-title">
        🔍 賽前分析
      </div>


      <div class="analysis-text">

        ${
          status === "Preview"

          ?

          `
          比賽尚未開始。<br>
          目前已取得：
          <br>
          ✔ 球隊
          <br>
          ✔ Logo
          <br>
          ✔ 開賽時間
          <br>
          ${awayPitcher ? "✔" : "✖"}
          客隊先發
          <br>
          ${homePitcher ? "✔" : "✖"}
          主隊先發
          <br><br>

          下一階段將加入 PlaySport：
          戰績、近10場、H2H、

          `

          :

          status === "Live"

          ?

          `

          即時比分：

          :

          `

  return card;

}
