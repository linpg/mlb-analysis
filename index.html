<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB 分析中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#222;font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif}
header{background:#111;color:#fff;padding:18px}.header-inner,.container{max-width:1280px;margin:auto}.subtitle{color:#aaa;font-size:13px;margin-top:5px}
.container{padding:15px}.bar,.summary-box,.game-card,.loading,.error{background:#fff;border:1px solid #ddd;border-radius:9px}
.bar{padding:12px;margin-bottom:15px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.buttons{display:flex;gap:6px}.buttons button{background:#fff;border:1px solid #ddd;border-radius:5px;padding:8px 13px;cursor:pointer}.buttons button:hover{background:#eee}
#dateText{font-weight:bold}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.summary-box{padding:13px}.summary-title{font-size:12px;color:#888}.summary-value{font-size:23px;font-weight:bold;margin-top:4px}
.game-card{overflow:hidden;margin-bottom:15px}.game-top{padding:10px 15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.game-time{font-size:18px;font-weight:bold}.status{padding:5px 9px;border-radius:5px;font-size:12px;background:#eee}.preview{background:#e8f1ff;color:#1455b8}.live{background:#ffe3e3;color:#c00000;font-weight:bold}.final{background:#e4f7e9;color:#147333}
.teams{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;padding:18px;gap:10px}.team{display:flex;align-items:center;gap:10px}.away{justify-content:flex-end;text-align:right}.logo{width:54px;height:54px;object-fit:contain}.team-name{font-size:18px;font-weight:bold}.team-sub{font-size:11px;color:#888;margin-top:3px}.score{text-align:center;font-size:27px;font-weight:bold}.inning{text-align:center;font-size:12px;color:#c00000;min-height:17px}
.section{border-top:1px solid #eee;padding:14px 15px}.section-title{font-weight:bold;font-size:15px;margin-bottom:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pitch{background:#fafafa;border:1px solid #eee;border-radius:7px;padding:10px}.pitch-name{font-weight:bold}.muted{font-size:11px;color:#888}.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.stat{background:#fff;border:1px solid #eee;border-radius:5px;padding:6px;text-align:center}.stat b{display:block;font-size:13px}.stat span{font-size:9px;color:#888}
.tablewrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{border-bottom:1px solid #eee;padding:7px;text-align:center;white-space:nowrap}.data-table th{background:#f5f5f5}
.analysis{background:#f5f9ff;border-left:4px solid #2864d7;padding:12px;margin:0 15px 15px;border-radius:5px;line-height:1.7;font-size:13px}.analysis strong{font-size:15px}
.loading,.error{text-align:center;padding:35px}.error{color:#a40000}.source{font-size:11px;color:#888;text-align:center;margin:18px}.tag{display:inline-block;border:1px solid #ddd;border-radius:12px;padding:2px 7px;margin:2px;font-size:11px;background:#fff}
@media(max-width:750px){.summary{grid-template-columns:repeat(2,1fr)}.teams{grid-template-columns:1fr;text-align:center}.away,.home{justify-content:center;text-align:center}.two{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>⚾ MLB 分析中心</h1><div class="subtitle">PlaySport 盤口／過盤率／戰績 + MLB 官方即時資料 + 自動分析</div></div></header>
<div class="container">
  <div class="bar">
    <div class="buttons"><button id="prev">← 前一天</button><button id="today">今天</button><button id="next">後一天 →</button></div>
    <div id="dateText"></div>
  </div>
  <div class="summary">
    <div class="summary-box"><div class="summary-title">今日比賽</div><div class="summary-value" id="total">-</div></div>
    <div class="summary-box"><div class="summary-title">尚未開打</div><div class="summary-value" id="preview">-</div></div>
    <div class="summary-box"><div class="summary-title">🔴 進行中</div><div class="summary-value" id="live">-</div></div>
    <div class="summary-box"><div class="summary-title">已結束</div><div class="summary-value" id="final">-</div></div>
  </div>
  <div id="games"><div class="loading">正在載入 MLB 比賽…</div></div>
  <div class="source" id="refreshInfo">PlaySport 資料載入中</div>
</div>

<script>
const MLB_API="https://statsapi.mlb.com/api/v1";
const PS="https://www.playsport.cc/livescore/1";
const LS=["https://ls6.playsport.cc","https://ls7.playsport.cc"];
let selectedDate=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
let version=0,timer=null;
const teamCache=new Map(),playerCache=new Map();

const teamNames={
ARI:"響尾蛇",ATL:"勇士",BAL:"金鶯",BOS:"紅襪",CHC:"小熊",CWS:"白襪",CIN:"紅人",CLE:"守護者",
COL:"落磯",DET:"老虎",HOU:"太空人",KC:"皇家",LAA:"天使",LAD:"道奇",MIA:"馬林魚",MIL:"釀酒人",
MIN:"雙城",NYM:"大都會",NYY:"洋基",OAK:"運動家",PHI:"費城人",PIT:"海盜",SD:"教士",SF:"巨人",
SEA:"水手",STL:"紅雀",TB:"光芒",TEX:"遊騎兵",TOR:"藍鳥",WSH:"國民"
};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function addDays(s,n){let d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function psDate(){return selectedDate.replaceAll("-","")}
function fmtDate(){return selectedDate.replaceAll("-","/")}
function setDateUI(){
  document.getElementById("dateText").textContent=`🇹🇼 ${fmtDate()} ｜ PlaySport ${psDate()}`;
  document.getElementById("prev").textContent=`← ${addDays(selectedDate,-1).slice(5).replace("-","/")}`;
  document.getElementById("next").textContent=`${addDays(selectedDate,1).slice(5).replace("-","/")} →`;
}
async function json(url,timeout=15000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);
  try{let r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
async function mlbSchedule(){
  /* PlaySport 台灣日期通常對應 MLB UTC 前一天 */
  let q=addDays(selectedDate,-1);
  let d=await json(`${MLB_API}/schedule?sportId=1&date=${q}&hydrate=team,probablePitcher`);
  let out=[];(d.dates||[]).forEach(x=>(x.games||[]).forEach(g=>out.push(g)));
  return out.sort((a,b)=>new Date(a.gameDate)-new Date(b.gameDate));
}
function logo(id){return `https://www.mlbstatic.com/team-logos/${id}.svg`}
function code(t){return t?.abbreviation||t?.team?.abbreviation||""}
function gameStatus(g){
  let s=g.status?.abstractGameState||"Preview";
  if(s==="Live")return ["進行中","live"];
  if(s==="Final")return ["已結束","final"];
  return [g.status?.detailedState||"尚未開打","preview"];
}
function timeTW(g){try{return new Intl.DateTimeFormat("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Taipei"}).format(new Date(g.gameDate))}catch{return "--:--"}}
async function feed(g){
  return json(`${MLB_API}/game/${g.gamePk}/feed/live`,12000).catch(()=>null);
}
async function teamStats(id){
  if(teamCache.has(id))return teamCache.get(id);
  let season=new Date().getFullYear();
  let d=await json(`${MLB_API}/teams/${id}/stats?stats=season&group=hitting&season=${season}`).catch(()=>null);
  let s=d?.stats?.[0]?.splits?.[0]?.stat||{};
  let v={avg:s.avg||"-",ops:s.ops||"-",runs:s.runs||"-",games:s.gamesPlayed||0};
  teamCache.set(id,v);return v;
}
async function pitcher(id){
  if(!id)return null;if(playerCache.has(id))return playerCache.get(id);
  let season=new Date().getFullYear();
  let d=await json(`${MLB_API}/people/${id}/stats?stats=season&group=pitching&season=${season}`).catch(()=>null);
  let s=d?.stats?.[0]?.splits?.[0]?.stat||{};
  let p={era:s.era||"-",wins:s.wins??"-",losses:s.losses??"-",avg:s.avg||"-",whip:s.whip||"-",so:s.strikeOuts??"-"};
  playerCache.set(id,p);return p;
}

/* ---------------- PlaySport ----------------
   GitHub Pages 本身無法穩定直接跨網域抓 PlaySport。
   依序嘗試公開 CORS proxy；若 proxy 不可用，頁面仍保留 MLB 官方資料。
*/
async function fetchText(url){
  const targets=[
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(url)}`
  ];
  for(const u of targets){
    try{let r=await fetch(u);if(r.ok){let x=await r.text();if(x.includes("PlaySport")||x.includes("先發投手")||x.includes("gamelist"))return x}}catch(e){}
  }
  throw Error("PlaySport proxy 無法連線");
}
function strip(s){return (s||"").replace(/\s+/g," ").trim()}
function textBetween(text,label,nextLabels=[]){
  let i=text.indexOf(label);if(i<0)return "";
  let x=text.slice(i+label.length);
  let end=x.length;
  nextLabels.forEach(n=>{let j=x.indexOf(n);if(j>=0&&j<end)end=j});
  return strip(x.slice(0,end)).slice(0,160);
}
function parsePercent(s){let m=String(s).match(/(\d+(?:\.\d+)?)\s*%/);return m?m[1]+"%":"-"}
function parsePS(html){
  let doc=new DOMParser().parseFromString(html,"text/html");
  let all=[...doc.querySelectorAll("[data-oid]")];
  let map=new Map();
  all.forEach(el=>{
    let oid=el.getAttribute("data-oid")||"";
    let txt=strip(el.innerText||el.textContent||"");
    if(!oid||!txt)return;
    let obj={oid,text:txt};
    obj.pitching=textBetween(txt,"先發投手",["團隊打擊","今日讓分盤口","戰績"]);
    obj.batting=textBetween(txt,"團隊打擊",["今日讓分盤口","戰績"]);
    obj.spread=textBetween(txt,"今日讓分盤口",["讓分過盤率","近十場讓分盤過盤率","今日大小盤口","戰績"]);
    obj.spreadRate=textBetween(txt,"讓分過盤率",["近十場讓分盤過盤率","今日大小盤口","戰績"]);
    obj.spread10=textBetween(txt,"近十場讓分盤過盤率",["今日大小盤口","戰績"]);
    obj.total=textBetween(txt,"今日大小盤口",["大分過盤率","戰績"]);
    obj.over=textBetween(txt,"大分過盤率",["戰績","主 / 客戰績"]);
    obj.record=textBetween(txt,"戰績",["主 / 客戰績","對戰紀錄"]);
    obj.homeAway=textBetween(txt,"主 / 客戰績",["對戰紀錄","近十場"]);
    obj.h2h=textBetween(txt,"對戰紀錄",["近十場","面對先發右投"]);
    obj.last10=textBetween(txt,"近十場",["面對先發右投","面對先發左投"]);
    obj.vsR=textBetween(txt,"面對先發右投",["面對先發左投","平均得 / 失分"]);
    obj.vsL=textBetween(txt,"面對先發左投",["平均得 / 失分","近十場平均得 / 失分"]);
    obj.avgRun=textBetween(txt,"平均得 / 失分",["近十場平均得 / 失分"]);
    obj.avgRun10=textBetween(txt,"近十場平均得 / 失分",[]);
    map.set(oid,obj);
  });
  return map;
}
async function playsport(){
  let url=`${PS}?gamedate=${psDate()}&mode=2`;
  let html=await fetchText(url);
  return parsePS(html);
}
async function liveJSON(oids){
  if(!oids.length)return {};
  let oid=oids.join(",");
  for(const d of LS){
    try{
      let u=`${d}/ls_json.php?alliance=1&gamedate=${psDate()}&pbp=1&teamStat=1&oid=${encodeURIComponent(oid)}&xcb=${Date.now()}`;
      let r=await fetch(u);if(!r.ok)continue;let x=await r.json();return x||{};
    }catch(e){}
  }
  return {};
}
function findPS(ps,g){
  let a=code(g.teams?.away),h=code(g.teams?.home);
  for(let [k,v] of ps){
    if(k.includes(`${a}@${h}`)||k.includes(`${h}@${a}`))return v;
  }
  return null;
}
function val(x){return x&&x!=="-"?esc(x):"<span class='muted'>尚無資料</span>"}
function scoreText(g){
  let a=g.teams?.away?.score??"-",h=g.teams?.home?.score??"-";return `${a} - ${h}`;
}
function psTable(p){
  if(!p)return `<div class="muted">PlaySport 詳細資料目前未取得；不影響 MLB 官方比分。</div>`;
  return `<div class="tablewrap"><table class="data-table">
  <tr><th>盤口</th><th>讓分</th><th>讓分過盤</th><th>近10場讓分</th><th>大小</th><th>大分率</th></tr>
  <tr><td>今日</td><td>${val(p.spread)}</td><td>${val(p.spreadRate)}</td><td>${val(p.spread10)}</td><td>${val(p.total)}</td><td>${val(p.over)}</td></tr>
  <tr><th>戰績</th><td colspan="2">${val(p.record)}</td><th>主/客</th><td colspan="2">${val(p.homeAway)}</td></tr>
  <tr><th>對戰</th><td colspan="2">${val(p.h2h)}</td><th>近10</th><td colspan="2">${val(p.last10)}</td></tr>
  <tr><th>vs 右投</th><td colspan="2">${val(p.vsR)}</td><th>vs 左投</th><td colspan="2">${val(p.vsL)}</td></tr>
  <tr><th>平均得/失</th><td colspan="2">${val(p.avgRun)}</td><th>近10得/失</th><td colspan="2">${val(p.avgRun10)}</td></tr>
  </table></div>`;
}
function analysis(g,ps,aStats,hStats,ap,hp){
  let reasons=[],scoreA=0,scoreH=0;
  if(ap&&hp&&ap.era!=="-"&&hp.era!=="-"){
    let ea=+ap.era,eh=+hp.era;
    if(ea<eh){scoreA+=2;reasons.push(`先發 ERA ${ea.toFixed(2)} 優於 ${eh.toFixed(2)}`)}
    else if(eh<ea){scoreH+=2;reasons.push(`先發 ERA ${eh.toFixed(2)} 優於 ${ea.toFixed(2)}`)}
  }
  if(aStats.avg!=="-"&&hStats.avg!=="-"){
    let aa=+aStats.avg,ah=+hStats.avg;
    if(aa>ah){scoreA++;reasons.push(`團隊打擊率 ${aStats.avg} 高於 ${hStats.avg}`)}
    else if(ah>aa){scoreH++;reasons.push(`團隊打擊率 ${hStats.avg} 高於 ${aStats.avg}`)}
  }
  let winner=scoreA>scoreH?"客隊較優":scoreH>scoreA?"主隊較優":"五五開";
  let confidence=Math.min(85,50+Math.abs(scoreA-scoreH)*10);
  return `<strong>自動結論：${winner}</strong>　參考信心 ${confidence}%<br>${reasons.length?reasons.join("；")+"。":"目前可用數據不足，先不強行下結論。"}<br><span class="muted">此分析為資料比較，不代表保證賽果；盤口資料以 PlaySport 實際顯示為準。</span>`;
}
function pitcherHTML(title,p,pstats){
  if(!p)return `<div class="pitch"><div class="muted">${title}</div><div class="pitch-name">尚未公布</div></div>`;
  return `<div class="pitch"><div class="muted">${title}</div><div class="pitch-name">${esc(p.fullName||p.name||"-")}</div>
  <div class="muted">${p.pitchHand?.description||""}</div>
  <div class="statgrid">
  <div class="stat"><span>勝</span><b>${pstats?.wins??"-"}</b></div><div class="stat"><span>敗</span><b>${pstats?.losses??"-"}</b></div>
  <div class="stat"><span>ERA</span><b>${pstats?.era??"-"}</b></div><div class="stat"><span>WHIP</span><b>${pstats?.whip??"-"}</b></div><div class="stat"><span>K</span><b>${pstats?.so??"-"}</b></div>
  </div></div>`;
}
async function renderGame(g,ps,live){
  let a=g.teams.away,h=g.teams.home,ac=code(a),hc=code(h),[status,cls]=gameStatus(g);
  let ap=a.probablePitcher?await pitcher(a.probablePitcher.id):null,hp=h.probablePitcher?await pitcher(h.probablePitcher.id):null;
  let aStats=await teamStats(a.team.id),hStats=await teamStats(h.team.id),p=findPS(ps,g);
  let ls=live?.[g.gamePk]||live?.[g.gamePk.toString()]||{};
  let liveA=ls.r?.[0]??a.score??"-",liveH=ls.r?.[1]??h.score??"-";
  let inning=ls.gs?.ss||ls.gs?.i?`第 ${ls.gs.i} 局 ${ls.gs.ss||""}`:"";
  return `<article class="game-card">
    <div class="game-top"><div><div class="game-time">${timeTW(g)}</div><div class="muted">${g.gamePk} · ${ac}@${hc}</div></div><div class="status ${cls}">${status}</div></div>
    <div class="teams">
      <div class="team away"><div><div class="team-name">${teamNames[ac]||a.team.name}</div><div class="team-sub">${ac} · 客場</div></div><img class="logo" src="${logo(a.team.id)}"></div>
      <div><div class="score">${liveA} - ${liveH}</div><div class="inning">${esc(inning)}</div></div>
      <div class="team home"><img class="logo" src="${logo(h.team.id)}"><div><div class="team-name">${teamNames[hc]||h.team.name}</div><div class="team-sub">${hc} · 主場</div></div></div>
    </div>
    <div class="section"><div class="section-title">先發投手</div><div class="two">${pitcherHTML("客隊先發",a.probablePitcher,ap)}${pitcherHTML("主隊先發",h.probablePitcher,hp)}</div></div>
    <div class="section"><div class="section-title">團隊打擊</div><div class="two">
      <div class="pitch"><b>${teamNames[ac]||ac}</b><div class="statgrid"><div class="stat"><span>AVG</span><b>${aStats.avg}</b></div><div class="stat"><span>OPS</span><b>${aStats.ops}</b></div><div class="stat"><span>R</span><b>${aStats.runs}</b></div></div></div>
      <div class="pitch"><b>${teamNames[hc]||hc}</b><div class="statgrid"><div class="stat"><span>AVG</span><b>${hStats.avg}</b></div><div class="stat"><span>OPS</span><b>${hStats.ops}</b></div><div class="stat"><span>R</span><b>${hStats.runs}</b></div></div></div>
    </div></div>
    <div class="section"><div class="section-title">PlaySport 盤口／戰績</div>${psTable(p)}</div>
    <div class="analysis">${analysis(g,p,aStats,hStats,ap,hp)}</div>
  </article>`;
}
async function load(){
  const my=++version;if(timer){clearInterval(timer);timer=null}
  setDateUI();document.getElementById("games").innerHTML=`<div class="loading">正在載入 ${fmtDate()}…<br><br>同步 MLB 官方資料 + PlaySport</div>`;
  try{
    let [games,ps]=await Promise.all([mlbSchedule(),playsport().catch(()=>new Map())]);
    if(my!==version)return;
    document.getElementById("total").textContent=games.length;
    let counts={preview:0,live:0,final:0};games.forEach(g=>{counts[gameStatus(g)[1]]++});
    document.getElementById("preview").textContent=counts.preview;document.getElementById("live").textContent=counts.live;document.getElementById("final").textContent=counts.final;
    if(!games.length){document.getElementById("games").innerHTML=`<div class="loading">這一天沒有抓到 MLB 賽程。</div>`;return}
    let live=await liveJSON(games.map(g=>{let a=code(g.teams.away),h=code(g.teams.home);return `MLB_${psDate()}_${a}@${h}_${(g.gameDate||"").slice(11,16).replace(":","")}`}));
    let box=document.getElementById("games");box.innerHTML="";
    for(const g of games){if(my!==version)break;box.insertAdjacentHTML("beforeend",await renderGame(g,ps,live))}
    document.getElementById("refreshInfo").textContent=`最後更新：${new Date().toLocaleTimeString("zh-TW")} ｜ 每 15 秒更新比分`;
    timer=setInterval(()=>refreshLive(games,my),15000);
  }catch(e){
    document.getElementById("games").innerHTML=`<div class="error">載入失敗：${esc(e.message)}<br><br>MLB 官方資料或 PlaySport 代理目前無法連線。<br>請稍後重新整理。</div>`;
  }
}
async function refreshLive(games,my){
  if(my!==version)return;
  try{
    let live=await liveJSON(games.map(g=>{let a=code(g.teams.away),h=code(g.teams.home);return `MLB_${psDate()}_${a}@${h}_${(g.gameDate||"").slice(11,16).replace(":","")}`}));
    games.forEach(g=>{
      let x=live[g.gamePk]||live[g.gamePk.toString()];if(!x)return;
      let card=[...document.querySelectorAll(".game-card")].find(c=>c.textContent.includes(String(g.gamePk)));if(!card)return;
      let nums=card.querySelector(".score"),st=x.r||[];if(nums&&st.length>=2)nums.textContent=`${st[0]} - ${st[1]}`;
      let inn=card.querySelector(".inning");if(inn)inn.textContent=x.gs?.ss||"";
    });
    document.getElementById("refreshInfo").textContent=`最後更新：${new Date().toLocaleTimeString("zh-TW")} ｜ 每 15 秒更新比分`;
  }catch(e){}
}
document.getElementById("prev").onclick=()=>{selectedDate=addDays(selectedDate,-1);load()};
document.getElementById("next").onclick=()=>{selectedDate=addDays(selectedDate,1);load()};
