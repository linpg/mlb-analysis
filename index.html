<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB 分析中心</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f4f5f7; color: #222; font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
header { background: #111; color: white; padding: 18px; }
.header-inner { max-width: 1250px; margin: auto; }
h1 { margin: 0; font-size: 26px; }
.subtitle { margin-top: 6px; color: #aaa; font-size: 13px; }
.container { max-width: 1250px; margin: auto; padding: 15px; }

/* DATE BAR */
.date-bar { background: white; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.date-buttons { display: flex; gap: 6px; }
.date-buttons button, .date-bar input[type="date"] { border: 1px solid #ddd; background: white; padding: 9px 14px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.date-buttons button:hover { background: #eee; }
.date-buttons .active { background: #111; color: white; font-weight: bold; }
.date-current { font-weight: bold; }

/* SUMMARY */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
.summary-box { background: white; padding: 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
.summary-title { font-size: 12px; color: #888; }
.summary-value { font-size: 23px; font-weight: bold; margin-top: 4px; }

/* GAME CARD */
.game-card { background: white; margin-bottom: 15px; border-radius: 9px; overflow: hidden; border: 1px solid #ddd; }
.game-top { padding: 11px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.game-time { font-weight: bold; font-size: 18px; }
.game-date-small { color: #888; font-size: 11px; margin-top: 3px; }
.game-status { font-size: 12px; padding: 5px 9px; border-radius: 4px; background: #eee; }
.status-preview { background: #e8f1ff; color: #1455b8; }
.status-live { background: #ffe4e4; color: #c40000; font-weight: bold; }
.status-final { background: #e4f7e9; color: #147333; }

/* TEAMS */
.teams { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; padding: 18px; gap: 10px; }
.team { display: flex; align-items: center; gap: 12px; }
.team.away { justify-content: flex-end; text-align: right; }
.team.home { justify-content: flex-start; }
.logo { width: 50px; height: 50px; object-fit: contain; background: #f9f9f9; border-radius: 50px; padding: 4px; }
.team-name { font-size: 18px; font-weight: bold; }
.team-side { color: #888; font-size: 11px; margin-top: 3px; }
.score { text-align: center; font-size: 26px; font-weight: bold; }
.inning-status { text-align: center; color: #c40000; font-size: 12px; margin-top: 4px; min-height: 16px; font-weight: bold; }

/* PITCHER & DATA & LIVE */
.pitcher { border-top: 1px solid #eee; padding: 12px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.pitcher-box { background: #fafafa; padding: 10px; border-radius: 5px; }
.pitcher-title { font-size: 12px; color: #888; }
.pitcher-name { margin-top: 4px; font-weight: bold; }
.pitcher-stats { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
.pitcher-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.pitcher-stat-item { background: white; border: 1px solid #eee; border-radius: 4px; padding: 5px 3px; text-align: center; }
.pitcher-stat-label { font-size: 9px; color: #999; }
.pitcher-stat-value { font-size: 12px; font-weight: bold; margin-top: 2px; }

.live-section { border-top: 1px solid #eee; padding: 15px; }
.live-title { font-weight: bold; margin-bottom: 8px; font-size: 14px; }
.live-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.live-box { background: #fafafa; border-radius: 5px; padding: 9px; text-align: center; }
.live-label { font-size: 11px; color: #888; }
.live-value { font-weight: bold; margin-top: 3px; }

.analysis { background: #f5f9ff; border-left: 4px solid #2864d7; padding: 13px; margin: 0 15px 15px; border-radius: 4px; }
.analysis-title { font-weight: bold; margin-bottom: 6px; font-size: 13px; }
.analysis-text { font-size: 13px; line-height: 1.7; color: #333; }

.loading, .empty, .error { background: white; padding: 5px; text-align: center; border-radius: 8px; font-size: 16px; color: #666; margin-top: 20px; }
.error { color: #b00000; }
.refresh-info { text-align: center; color: #888; font-size: 11px; margin: 20px 0; }

@media(max-width: 750px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .teams { grid-template-columns: 1fr; text-align: center; }
  .team.away, .team.home { justify-content: center; text-align: center; }
  .score { order: 3; }
  .pitcher { grid-template-columns: 1fr; }
  .live-info { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>⚾ MLB 分析中心</h1>
    <div class="subtitle">MLB 官方即時數據中心｜賽前分析、即時動態、歷史比分</div>
  </div>
</header>

<div class="container">
  <!-- 日期控制列 -->
  <div class="date-bar">
    <div class="date-buttons">
      <button id="btn-prev">前一天</button>
      <button id="btn-today" class="active">今天</button>
      <button id="btn-next">後一天</button>
    </div>
    <span class="date-current" id="current-date-display">載入中...</span>
    <input type="date" id="date-picker">
  </div>

  <!-- 數據統計區 -->
  <div class="summary">
    <div class="summary-box"><div class="summary-title">總場次</div><div class="summary-value" id="sum-total">0</div></div>
    <div class="summary-box"><div class="summary-title">進行中</div><div class="summary-value" id="sum-live" style="color: #c40000;">0</div></div>
    <div class="summary-box"><div class="summary-title">已結束</div><div class="summary-value" id="sum-final" style="color: #147333;">0</div></div>
    <div class="summary-box"><div class="summary-title">未開始</div><div class="summary-value" id="sum-preview" style="color: #1455b8;">0</div></div>
  </div>

  <!-- 賽事卡片容器 -->
  <div id="games-container">
    <div class="loading">正在向 MLB 官方獲取最新賽事資料...</div>
  </div>

  <div class="refresh-info" id="refresh-time">資料更新時間：--:--:--</div>
</div>

<script>
// 初始化設定：使用台北時間轉換為美東適用的日期
let currentDate = new Date();

const container = document.getElementById('games-container');
const datePicker = document.getElementById('date-picker');
const dateDisplay = document.getElementById('current-date-display');

// 格式化日期為 YYYY-MM-DD
function formatDate(date) {
  const d = new Date(date);
  let month = '' + (d.getMonth() + 1);
  let day = '' + d.getDate();
  const year = d.getFullYear();
  if (month.length < 2) month = '0' + month;
  if (day.length < 2) day = '0' + day;
  return [year, month, day].join('-');
}

// 取得球隊帽子/Logo 圖檔網址
function getTeamLogo(teamId) {
  return `https://mlb.com{teamId}.svg`;
}

// 載入 MLB 賽事主函式
async function loadGames() {
  const dateStr = formatDate(currentDate);
  datePicker.value = dateStr;
  dateDisplay.innerText = dityDateText(dateStr);
  container.innerHTML = '<div class="loading">正在同步 MLB 官方資料...</div>';

  try {
    // 串接 MLB StatsAPI Schedule
    const res = await fetch(`https://mlb.com{dateStr}&hydrate=linescore,probablePitcher,decisions`);
    const data = await res.json();
    
    if (!data.dates || data.dates.length === 0 || !data.dates[0].games || data.dates[0].games.length === 0) {
      container.innerHTML = '<div class="empty">本日無任何 MLB 安排之賽事。</div>';
      updateSummary(0, 0, 0, 0);
      return;
    }

    const games = data.dates[0].games;
    let total = games.length, live = 0, final = 0, preview = 0;
    container.innerHTML = '';

    games.forEach(game => {
      const statusCod = game.status.codedGameState; // Pre-game(S/P), Live(I), Final(F)
      let statusClass = 'status-preview', statusText = '未開始';
      
      if (statusCod === 'I') {
        statusClass = 'status-live';
        statusText = 'LIVE';
        live++;
      } else if (statusCod === 'F' || game.status.abstractGameState === 'Final') {
        statusClass = 'status-final';
        statusText = '已結束';
        final++;
      } else {
        preview++;
      }

      const awayTeam = game.teams.away;
      const homeTeam = game.teams.home;
      const linescore = game.linescore || {};
      
      // 解析開賽本地時間
      const gameTimeLocal = new Date(game.gameDate).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

      // 建立卡片元件
      const card = document.createElement('div');
      card.className = 'game-card';
      
      // 卡片頭部
      let headerHtml = `
        <div class="game-top">
          <div>
            <div class="game-time">${gameTimeLocal}</div>
            <div class="game-date-small">賽事 ID: ${game.gamePk}</div>
          </div>
          <span class="game-status ${statusClass}">${statusText}</span>
        </div>
      `;

      // 計分板與球隊名稱
      let inningText = '';
      if (statusCod === 'I' && linescore.currentInning) {
        inningText = `${linescore.isTopInning ? '上' : '下'} ${linescore.currentInning} 局`;
      } else if (statusCod === 'F') {
        inningText = 'FINAL';
      }

      let teamsHtml = `
        <div class="teams">
          <div class="team away">
            <div>
              <div class="team-name">${awayTeam.team.name}</div>
              <div class="team-side">客隊 (${awayTeam.leagueRecord.wins}-${awayTeam.leagueRecord.losses})</div>
            </div>
            <img class="logo" src="${getTeamLogo(awayTeam.team.id)}" onerror="this.src='https://mlbstatic.com'">
          </div>
          <div>
            <div class="score">${awayTeam.score !== undefined ? awayTeam.score : '--'} : ${homeTeam.score !== undefined ? homeTeam.score : '--'}</div>
            <div class="inning-status">${inningText}</div>
          </div>
