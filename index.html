</header>

<div class="container">

  <!-- 日期 -->

    預測功能目前先保留資料入口；後續會加入戰績、近10場、先發投手、
    打線、牛棚、傷兵、H2H、賽程疲勞、天氣、PlaySport 賠率及模型預測。

<script>

  const MLB_API = "https://statsapi.mlb.com/api/v1";

  /*
   * ==========================================================
   * 台灣日期系統
   * ==========================================================
   *
   * 整個網站不使用 new Date() 直接判斷「今天是哪一天」。
   *
   * 所有日期都以：
   *
   * Asia/Taipei
   *
   * 為準。
   */

  function getTaiwanDateString() {

    const parts = new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(new Date());

    const data = {};

    parts.forEach(part => {
      if (part.type !== "literal") {
        data[part.type] = part.value;
      }
    });

    return `${data.year}-${data.month}-${data.day}`;
  }


  /*
   * 日期加減
   *
   * 不直接操作當地時間，
   * 避免時區造成日期跳一天。
   */

  function addDays(dateString, days) {

    const [year, month, day] =
      dateString.split("-").map(Number);

    const date =
      new Date(Date.UTC(year, month - 1, day));

    date.setUTCDate(
      date.getUTCDate() + days
    );

    return date
      .toISOString()
      .slice(0, 10);
  }


  /*
   * 將 MLB gameDate
   * 轉成台灣日期
   */

  function getTaiwanDateFromISO(isoString) {

    const parts = new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(
      new Date(isoString)
    );

    const data = {};

    parts.forEach(part => {
      if (part.type !== "literal") {
        data[part.type] = part.value;
      }
    });

    return `${data.year}-${data.month}-${data.day}`;
  }


  /*
   * 將 MLB 開賽時間
   * 轉成台灣時間
   */

  function formatTaiwanTime(isoString) {

    return new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone: "Asia/Taipei",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).format(
      new Date(isoString)
    );
  }


  /*
   * ==========================================================
   * 全域狀態
   * ==========================================================
   */

  let selectedDate =
    getTaiwanDateString();


  /*
   * ==========================================================
   * 日期顯示
   * ==========================================================
   */

  function updateDateUI() {

    const today =
      getTaiwanDateString();

    const yesterday =
      addDays(today, -1);

    const tomorrow =
      addDays(today, 1);

    let label = "";

    if (selectedDate === today) {

      label =
        `🇹🇼 ${selectedDate}（今天）`;

    } else if (selectedDate === yesterday) {

      label =
        `🇹🇼 ${selectedDate}（昨天）`;

    } else if (selectedDate === tomorrow) {

      label =
        `🇹🇼 ${selectedDate}（明天）`;

    } else {

      label =
        `🇹🇼 ${selectedDate}`;

    }

    document
      .getElementById("selectedDateText")
      .textContent = label;

    document
      .getElementById("dateInput")
      .value = selectedDate;
  }


  /*
   * ==========================================================
   * API
   * ==========================================================
   */

  async function getJSON(url) {

    const response =
      await fetch(url);

    if (!response.ok) {

      throw new Error(
        `API 錯誤：${response.status}`
      );
    }

    return response.json();
  }


  /*
   * ==========================================================
   * 載入指定台灣日期的比賽
   * ==========================================================
   *
   * 注意：
   *
   * MLB API 的 schedule date 是美國賽程日期。
   *
   * 台灣時間可能會跨日。
   *
   * 所以我們抓：
   *
   * 前一天
   * 今天
   * 後一天
   *
   * 再根據 gameDate 真正轉成台灣時間後篩選。
   */

  async function loadGames() {

    const content =
      document.getElementById("content");

    content.innerHTML = `
      <div class="loading">
        正在載入 ${selectedDate} 的 MLB 比賽...
      </div>
    `;

    updateDateUI();

    try {

      const startDate =
        addDays(selectedDate, -1);

      const endDate =
        addDays(selectedDate, 1);

      const url =
        `${MLB_API}/schedule` +
        `?sportId=1` +
        `&startDate=${startDate}` +
        `&endDate=${endDate}` +
        `&hydrate=team,probablePitcher`;

      const data =
        await getJSON(url);

      let allGames = [];

      if (data.dates) {

        data.dates.forEach(date => {

          if (date.games) {

            allGames =
              allGames.concat(date.games);

          }

        });

      }


      /*
       * 真正按照台灣日期篩選
       */

      const games =
        allGames.filter(game => {

          return (
            getTaiwanDateFromISO(
              game.gameDate
            ) === selectedDate
          );

        });


      /*
       * 排序
       */

      games.sort(
        (a, b) =>
          new Date(a.gameDate) -
          new Date(b.gameDate)
      );


      updateSummary(games);

      if (games.length === 0) {

        content.innerHTML = `
          <div class="empty">
            <h3>今天沒有找到 MLB 比賽</h3>
            <p>
              日期：
              ${selectedDate}
            </p>
          </div>
        `;

        return;
      }


      /*
       * 先顯示基本卡片
       */

      content.innerHTML =
        `<div class="games" id="gamesList"></div>`;

      const gamesList =
        document.getElementById("gamesList");


      /*
       * 每場比賽
       */

      for (const game of games) {

        const card =
          await createGameCard(game);

        gamesList.appendChild(card);

      }

    } catch (error) {

      console.error(error);

      content.innerHTML = `
        <div class="error">

          <h3>⚠️ 資料載入失敗</h3>

          <p>
            ${error.message}
          </p>

          <button onclick="loadGames()">
            重新載入
          </button>

        </div>
      `;

    }

  }


  /*
   * ==========================================================
   * 統計
   * ==========================================================
   */

  function updateSummary(games) {

    let preview = 0;
    let live = 0;
    let final = 0;

    games.forEach(game => {

      const state =
        game.status?.abstractGameState;

      if (state === "Preview") {

        preview++;

      } else if (state === "Live") {

        live++;

      } else if (state === "Final") {

        final++;

      }

    });

    document
      .getElementById("totalGames")
      .textContent = games.length;

    document
      .getElementById("previewGames")
      .textContent = preview;

    document
      .getElementById("liveGames")
      .textContent = live;

    document
      .getElementById("finalGames")
      .textContent = final;

  }


  /*
   * ==========================================================
   * 建立比賽卡片
   * ==========================================================
   */

  async function createGameCard(game) {

    /*
     * 再抓一次 live feed
     *
     * 用來取得：
     *
     * - lineup
     * - 即時比分
     * - 更完整資料
     */

    let feed = null;

    try {

      feed =
        await getJSON(
          `${MLB_API}/game/${game.gamePk}/feed/live`
        );

    } catch (error) {

      console.warn(
        "Live feed 取得失敗",
        game.gamePk
      );

    }


    const gameData =
      feed?.gameData || {};

    const liveData =
      feed?.liveData || {};


    const away =
      game.teams.away;

    const home =
      game.teams.home;


    const status =
      game.status?.abstractGameState ||
      "Preview";


    /*
     * 狀態文字
     */

    let statusText =
      "尚未開打";

    let statusClass =
      "status-preview";

    if (status === "Live") {

      statusText =
        "🔴 比賽進行中";

      statusClass =
        "status-live";

    } else if (status === "Final") {

      statusText =
        "✅ 比賽已結束";

      statusClass =
        "status-final";

    }


    /*
     * 比分
     */

    let scoreHTML =
      `<div class="score">VS</div>`;

    if (
      status === "Live" ||
      status === "Final"
    ) {

      scoreHTML = `
        <div class="score">
          ${away.score ?? 0}
          -
          ${home.score ?? 0}
        </div>
      `;

    }


    /*
     * 先發投手
     */

    const probableAway =
      gameData.probablePitchers?.away ||
      game.teams.away.probablePitcher;

    const probableHome =
      gameData.probablePitchers?.home ||
      game.teams.home.probablePitcher;


    const awayPitcher =
      probableAway?.fullName ||
      probableAway?.person?.fullName ||
      "尚未公布";

    const homePitcher =
      probableHome?.fullName ||
      probableHome?.person?.fullName ||
      "尚未公布";


    /*
     * 打線
     */

    const awayLineup =
      getLineup(
        liveData,
        away.team.id,
        "away"
      );

    const homeLineup =
      getLineup(
        liveData,
        home.team.id,
        "home"
      );


    /*
     * 完整度
     */

    const completeness =
      calculateCompleteness(
        probableAway,
        probableHome,
        awayLineup,
        homeLineup
      );


    /*
     * 建立卡片
     */

    const card =
      document.createElement("article");

    card.className =
      "game-card";


    /*
     * 賽季階段
     */

    const seasonStage =
      getSeasonStage();


    card.innerHTML = `

      <div class="game-header">

        <div>

          <div class="game-time">
            ${formatTaiwanTime(game.gameDate)}
          </div>

          <div style="
            color:#6b7280;
            font-size:12px;
            margin-top:4px;
          ">
            台灣時間｜${seasonStage}
          </div>

        </div>

        <div class="game-status ${statusClass}">
          ${statusText}
        </div>

      </div>


      <div class="teams">

        <div class="team away">

          <div>

            <div class="team-name">
              ${away.team.name}
            </div>

            <div class="team-record">
              客場｜2026 賽季
            </div>

          </div>

          <img
            class="team-logo"
            src="https://www.mlbstatic.com/team-logos/${away.team.id}.svg"
            alt="${away.team.name}"
            onerror="this.style.display='none'"
          />

        </div>


        ${scoreHTML}


        <div class="team home">

          <img
            class="team-logo"
            src="https://www.mlbstatic.com/team-logos/${home.team.id}.svg"
            alt="${home.team.name}"
            onerror="this.style.display='none'"
          />

          <div>

            <div class="team-name">
              ${home.team.name}
            </div>

            <div class="team-record">
              主場｜2026 賽季
            </div>

          </div>

        </div>

      </div>


      <div class="pitchers">

        <div class="pitcher-box">

          <div class="pitcher-label">
            客隊先發
          </div>

          <div class="pitcher-name">
            ${awayPitcher}
          </div>

        </div>


        <div class="pitcher-box">

          <div class="pitcher-label">
            主隊先發
          </div>

          <div class="pitcher-name">
            ${homePitcher}
          </div>

        </div>

      </div>


      <div class="analysis-box">

        <div class="analysis-title">
          ${status === "Preview"
            ? "🔍 賽前分析狀態"
            : status === "Live"
              ? "📡 比賽進行中"
              : "📊 賽後資料"}
        </div>

        <div class="analysis-text">

          ${
            status === "Preview"
            ?
            `
              目前進入賽前分析流程。<br>
              先發投手：
              ${probableAway ? "✔" : "✖"}
              客隊｜
              ${probableHome ? "✔" : "✖"}
              主隊<br>
              打線：
              ${awayLineup.length}/9 客隊｜
              ${homeLineup.length}/9 主隊
            `
            :
            status === "Live"
            ?
            `
              比賽已開始，網站會優先保留賽前資料，
              並逐步更新即時比分與比賽狀態。
            `
            :
            `
              比賽已結束，後續將進入
              「預測 vs 實際結果」評估。
            `
          }

        </div>

      </div>


      <div class="lineup-section">

        <div class="lineup-title">
          預計 / 已公布打線
        </div>

        <div class="lineups">

  function getLineup(
    liveData,
    teamId,
    side
  ) {

    const boxscore =
      liveData.boxscore;

    const teamData =
      boxscore?.teams?.[side];

    if (!teamData) {
      return [];
    }

    /*
     * MLB boxscore 的 battingOrder
     * 通常會是：
     *
     * 1, 2, 3...
     *
     * 實際玩家資料則在 players。
     */

    const order =
      teamData.battingOrder || [];

    const players =
      teamData.players || {};

    const lineup = [];

    order.forEach(orderNumber => {

      const playerKey =
        `ID${String(orderNumber).padStart(6, "0")}`;

      /*
       * 有些資料結構不直接使用這個 key，
       * 所以另外搜尋。
       */

      let found = null;

      Object.values(players).forEach(player => {

        if (
          player.battingOrder === orderNumber
        ) {
          found = player;
        }

      });

      if (found) {

        const name =
          found.person?.fullName;

        if (name) {
          lineup.push(name);
        }

      }

    });


    /*
     * 如果上面的結構沒有抓到，
     * 再使用 players 搜尋 battingOrder。
     */

    if (lineup.length === 0) {

      Object.values(players)
        .filter(player =>
          player.battingOrder
        )
        .sort(
          (a, b) =>
            a.battingOrder -
            b.battingOrder
        )
        .forEach(player => {

          if (
            player.person?.fullName &&
            !lineup.includes(
              player.person.fullName
            )
          ) {

            lineup.push(
              player.person.fullName
            );

          }

        });

    }


    return lineup.slice(0, 9);

  }


  /*
   * ==========================================================
   * 資料完整度
   * ==========================================================
   *
   * 目前只是第一版。
   *
   * 後面加入：
   *
   * - 戰績

   *
   * 之後會重新計算。
   */

  function calculateCompleteness(
    awayPitcher,
    homePitcher,
    awayLineup,
    homeLineup
  ) {

    let score = 0;

    /*
     * 客隊先發
     */
    if (awayPitcher) {
      score += 15;
    }

    /*
     * 主隊先發
     */
    if (homePitcher) {
      score += 15;
    }

    /*
     * 客隊打線
     */
    if (awayLineup.length >= 9) {
      score += 20;
    } else if (awayLineup.length >= 6) {
      score += 10;
    }

    /*
     * 主隊打線
     */
    if (homeLineup.length >= 9) {
      score += 20;
    } else if (homeLineup.length >= 6) {
      score += 10;
    }

    /*
     * 目前先保留 30 分
     *
     * 未來會分配給：
     *
     * 戰績
     * 近10
     * 牛棚
     * 傷兵
     * 市場
     * 天氣
     */

    score += 30;

    return Math.min(
      100,
      score
    );

  }
