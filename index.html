<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MLB 分析中心</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #222;
  font-family:
    Arial,
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;
}


/* ========================================
   HEADER
======================================== */

header {
  background: #111;
  color: white;
  padding: 18px;
}

.header-inner {
  max-width: 1250px;
  margin: auto;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  margin-top: 6px;
  color: #aaa;
  font-size: 13px;
}


/* ========================================
   CONTAINER
======================================== */

.container {
  max-width: 1250px;
  margin: auto;
  padding: 15px;
}


/* ========================================
   DATE BAR
======================================== */

.date-bar {
  background: white;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
  flex-wrap: wrap;
}

.date-buttons {
  display: flex;
  gap: 6px;
}

.date-buttons button {
  border: 1px solid #ddd;
  background: white;

  padding: 9px 14px;

  border-radius: 5px;

  cursor: pointer;

  font-size: 14px;
}

.date-buttons button:hover {
  background: #eee;
}

.date-buttons .today {
  background: #111;
  color: white;
  font-weight: bold;
}

.date-current {
  font-weight: bold;
}


/* ========================================
   SUMMARY
======================================== */

.summary {
  display: grid;
  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

  margin-bottom: 15px;
}

.summary-box {
  background: white;

  padding: 14px;

  border-radius: 8px;
}

.summary-title {
  font-size: 12px;
  color: #888;
}

.summary-value {
  font-size: 23px;
  font-weight: bold;

  margin-top: 4px;
}


/* ========================================
   GAME CARD
======================================== */

.game-card {
  background: white;

  margin-bottom: 15px;

  border-radius: 9px;

  overflow: hidden;

  border: 1px solid #ddd;
}


/* ========================================
   GAME HEADER
======================================== */

.game-top {
  padding: 11px 15px;

  border-bottom: 1px solid #eee;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.game-time {
  font-weight: bold;
  font-size: 18px;
}

.game-date-small {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

.game-status {
  font-size: 12px;

  padding: 5px 9px;

  border-radius: 4px;

  background: #eee;
}

.status-preview {
  background: #e8f1ff;
  color: #1455b8;
}

.status-live {
  background: #ffe4e4;
  color: #c40000;

  font-weight: bold;
}

.status-final {
  background: #e4f7e9;
  color: #147333;
}


/* ========================================
   TEAMS
======================================== */

.teams {
  display: grid;

  grid-template-columns:
    1fr 100px 1fr;

  align-items: center;

  padding: 18px;

  gap: 10px;
}

.team {
  display: flex;

  align-items: center;

  gap: 12px;
}

.team.away {
  justify-content: flex-end;

  text-align: right;
}

.team.home {
  justify-content: flex-start;
}

.logo {
  width: 58px;
  height: 58px;

  object-fit: contain;
}

.team-name {
  font-size: 18px;

  font-weight: bold;
}

.team-side {
  color: #888;

  font-size: 11px;

  margin-top: 3px;
}

.score {
  text-align: center;

  font-size: 26px;

  font-weight: bold;
}

.inning-status {
  text-align: center;

  color: #c40000;

  font-size: 12px;

  margin-top: 4px;

  min-height: 16px;
}


/* ========================================
   PITCHER
======================================== */

.pitcher {
  border-top: 1px solid #eee;

  padding: 12px 18px;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 15px;
}

.pitcher-box {
  background: #fafafa;

  padding: 10px;

  border-radius: 5px;
}

.pitcher-title {
  font-size: 12px;

  color: #888;
}

.pitcher-name {
  margin-top: 4px;

  font-weight: bold;
}

.pitcher-hand {
  margin-top: 4px;

  font-size: 11px;

  color: #777;
}

.pitcher-stats {
  margin-top: 10px;

  border-top: 1px solid #eee;

  padding-top: 8px;
}

.pitcher-stats-title {
  font-size: 11px;

  color: #888;

  margin-bottom: 6px;
}

.pitcher-stat-grid {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 5px;
}

.pitcher-stat-item {
  background: white;

  border: 1px solid #eee;

  border-radius: 4px;

  padding: 5px 3px;

  text-align: center;
}

.pitcher-stat-label {
  font-size: 9px;

  color: #999;
}

.pitcher-stat-value {
  font-size: 12px;

  font-weight: bold;

  margin-top: 2px;
}

.pitcher-recent {
  margin-top: 7px;

  padding: 6px;

  background: white;

  border-radius: 4px;

  font-size: 11px;

  color: #555;
}


/* ========================================
   DATA SECTION
======================================== */

.data-section {
  border-top: 1px solid #eee;

  padding: 15px;
}

.data-title {
  font-size: 16px;

  font-weight: bold;

  margin-bottom: 8px;
}

.data-table {
  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}

.data-table th,
.data-table td {
  padding: 8px;

  border-bottom: 1px solid #eee;

  text-align: center;
}

.data-table th {
  background: #f5f5f5;
}

.data-loading {
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}

.data-error {
  color: #b00000;
  font-size: 12px;
  margin-bottom: 8px;
}


/* ========================================
   LIVE INFO
======================================== */

.live-section {
  border-top: 1px solid #eee;

  padding: 15px;
}

.live-title {
  font-weight: bold;

  margin-bottom: 8px;
}

.live-info {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;
}

.live-box {
  background: #fafafa;

  border-radius: 5px;

  padding: 9px;

  text-align: center;
}

.live-label {
  font-size: 11px;

  color: #888;
}

.live-value {
  font-weight: bold;

  margin-top: 3px;
}


/* ========================================
   ANALYSIS
======================================== */

.analysis {
  background: #f5f9ff;

  border-left: 4px solid #2864d7;

  padding: 13px;

  margin: 0 15px 15px;

  border-radius: 4px;
}

.analysis-title {
  font-weight: bold;

  margin-bottom: 6px;
}

.analysis-text {
  font-size: 13px;

  line-height: 1.7;
}


/* ========================================
   LOADING
======================================== */

.loading,
.empty,
.error {
  background: white;

  padding: 35px;

  text-align: center;

  border-radius: 8px;
}

.error {
  color: #b00000;
}


/* ========================================
   REFRESH
======================================== */

.refresh-info {
  text-align: center;

  color: #888;

  font-size: 11px;

  margin: 20px 0;
}


/* ========================================
   RESPONSIVE
======================================== */

@media(max-width: 750px) {

  .summary {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .teams {
    grid-template-columns: 1fr;

    text-align: center;
  }

  .team.away,
  .team.home {
    justify-content: center;

    text-align: center;
  }

  .score {
    order: 3;
  }

  .pitcher {
    grid-template-columns: 1fr;
  }

  .pitcher-stat-grid {
    grid-template-columns:
      repeat(5, 1fr);
  }

  .live-info {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .data-table {
    font-size: 11px;
  }

  .data-table th,
  .data-table td {
    padding: 6px 3px;
  }

}


@media(max-width: 500px) {

  h1 {
    font-size: 22px;
  }

  .team-name {
    font-size: 16px;
  }

  .logo {
    width: 48px;
    height: 48px;
  }

  .pitcher-stat-grid {
    grid-template-columns:
      repeat(5, 1fr);
  }

  .pitcher-stat-label {
    font-size: 8px;
  }

  .pitcher-stat-value {
    font-size: 11px;
  }

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <h1>
      ⚾ MLB 分析中心
    </h1>

    <div class="subtitle">
      PlaySport 賽事日期｜
      MLB 官方即時資料｜
      賽前 / LIVE / 賽後
    </div>

  </div>

</header>


<div class="container">


<!-- ========================================
     DATE
======================================== -->

<div class="date-bar">

  <div class="date-buttons">

    <button id="prevDay">
      ← 前一天
    </button>

    <button
      id="today"
      class="today"
    >
      09/13 今天
    </button>

    <button id="nextDay">
      後一天 →
    </button>

  </div>


  <div
    class="date-current"
    id="dateText"
  >
    🇹🇼 2026/09/13
  </div>

</div>


<!-- ========================================
     SUMMARY
======================================== -->

<div class="summary">

  <div class="summary-box">

    <div class="summary-title">
      今日比賽
    </div>

    <div
      class="summary-value"
      id="totalGames"
    >
      -
    </div>

  </div>


  <div class="summary-box">

    <div class="summary-title">
      尚未開打
    </div>

    <div
      class="summary-value"
      id="previewGames"
    >
      -
    </div>

  </div>


  <div class="summary-box">

    <div class="summary-title">
      🔴 進行中
    </div>

    <div
      class="summary-value"
      id="liveGames"
    >
      -
    </div>

  </div>


  <div class="summary-box">

    <div class="summary-title">
      已結束
    </div>

    <div
      class="summary-value"
      id="finalGames"
    >
      -
    </div>

  </div>

</div>


<!-- ========================================
     GAMES
======================================== -->

<div id="games">

  <div class="loading">
    正在載入 MLB 比賽...
  </div>

</div>


<div
  class="refresh-info"
  id="refreshInfo"
>
  即時比分每 15 秒自動更新
</div>


</div>


<script>


/* =========================================================
   基本設定
========================================================= */

const MLB_API =
  "https://statsapi.mlb.com/api/v1";


/*
 * ========================================================
 * PlaySport / 台灣日期
 *
 * 這裡維持目前版本的邏輯：
 *
 * 2026-09-13
 * ↓
 * MLB API 查 2026-09-12
 *
 * 不修改。
 * ========================================================
 */

let selectedDate =
  "2026-09-13";


let liveUpdateTimer = null;


/*
 * 防止切日期後，
 * 舊請求覆蓋新頁面
 */

let pageVersion = 0;


/*
 * 團隊資料快取
 */

const teamAnalysisCache =
  new Map();


/*
 * ========================================================
 * 投手資料快取
 *
 * key：
 * pitcherId + season
 *
 * 投手資料不需要每 15 秒重新抓。
 * ========================================================
 */

const pitcherAnalysisCache =
  new Map();


/* =========================================================
   日期工具
========================================================= */

function dateToPlaySport(date) {

  return date.replaceAll(
    "-",
    ""
  );

}


function addDays(
  dateString,
  days
) {

  const parts =
    dateString
      .split("-")
      .map(Number);


  const date =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
      )
    );


  date.setUTCDate(
    date.getUTCDate() + days
  );


  return date
    .toISOString()
    .slice(0, 10);

}


function formatDate(date) {

  return date.replaceAll(
    "-",
    "/"
  );

}


/* =========================================================
   MLB 查詢日期
========================================================= */

function getMLBQueryDate() {

  return addDays(
    selectedDate,
    -1
  );

}


/* =========================================================
   PlaySport URL
========================================================= */

function getPlaySportURL() {

  return (
    "https://www.playsport.cc/livescore/1" +
    "?gamedate=" +
    dateToPlaySport(selectedDate) +
    "&mode=2"
  );

}


/* =========================================================
   日期 UI
========================================================= */

function updateDateUI() {

  const previous =
    addDays(
      selectedDate,
      -1
    );


  const next =
    addDays(
      selectedDate,
      1
    );


  document
    .getElementById("prevDay")
    .textContent =
      `← ${previous.slice(5).replace("-", "/")}`;


  document
    .getElementById("nextDay")
    .textContent =
      `${next.slice(5).replace("-", "/")} →`;


  document
    .getElementById("today")
    .textContent =
      selectedDate === "2026-09-13"
        ? "09/13 今天"
        : "回到 09/13";


  document
    .getElementById("dateText")
    .textContent =
      `🇹🇼 ${formatDate(selectedDate)} ｜ PlaySport ${dateToPlaySport(selectedDate)}`;

}


/* =========================================================
   API
========================================================= */

async function getJSON(url) {

  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `API 錯誤：${response.status}`
    );

  }


  return response.json();

}


/* =========================================================
   MLB 賽程
========================================================= */

async function getMLBSchedule() {

  const mlbQueryDate =
    getMLBQueryDate();


  const url =
    `${MLB_API}/schedule` +
    `?sportId=1` +
    `&date=${mlbQueryDate}` +
    `&hydrate=team,probablePitcher`;


  console.log(
    "PlaySport 日期：",
    selectedDate
  );


  console.log(
    "MLB API 查詢日期：",
    mlbQueryDate
  );


  const data =
    await getJSON(url);


  let games = [];


  if (data.dates) {

    data.dates.forEach(
      day => {

        if (day.games) {

          games =
            games.concat(
              day.games
            );

        }

      }
    );

  }


  games =
    games.filter(
      game =>
        game.sport?.id === 1 ||
        game.sport?.name ===
          "Major League Baseball" ||
        game.gameType === "R"
    );


  games.sort(
    (a, b) =>
      new Date(a.gameDate) -
      new Date(b.gameDate)
  );


  return games;

}


/* =========================================================
   載入 MLB 比賽
========================================================= */

async function loadMLBGames() {

  pageVersion++;


  const currentVersion =
    pageVersion;


  if (liveUpdateTimer) {

    clearInterval(
      liveUpdateTimer
    );

    liveUpdateTimer = null;

  }


  const gamesBox =
    document.getElementById(
      "games"
    );


  gamesBox.innerHTML = `

    <div class="loading">

      正在載入
      ${formatDate(selectedDate)}
      MLB 比賽...

      <br><br>

      PlaySport：
      ${dateToPlaySport(selectedDate)}

    </div>

  `;


  updateDateUI();


  try {

    const games =
      await getMLBSchedule();


    if (
      currentVersion !==
      pageVersion
    ) {

      return;

    }


    updateSummary(
      games
    );


    if (!games.length) {

      gamesBox.innerHTML = `

        <div class="empty">

          <h3>
            ${formatDate(selectedDate)}
            沒有找到 MLB 比賽
          </h3>

          <p>
            PlaySport：
            ${dateToPlaySport(selectedDate)}
          </p>

          <p>
            MLB API 查詢日期：
            ${formatDate(
              getMLBQueryDate()
            )}
          </p>

        </div>

      `;

      return;

    }


    gamesBox.innerHTML = "";


    /*
     * 同時建立所有卡片
     */

    const cards =
      await Promise.all(
        games.map(
          game =>
            createGameCard(
              game
            )
        )
      );


    if (
      currentVersion !==
      pageVersion
    ) {

      return;

    }


    cards.forEach(
      card => {

        gamesBox.appendChild(
          card
        );

      }
    );


    updateRefreshTime();

    startLiveRefresh();

  }


  catch(error) {

    console.error(
      error
    );


    if (
      currentVersion !==
      pageVersion
    ) {

      return;

    }


    gamesBox.innerHTML = `

      <div class="error">

        <h3>
          ⚠️ MLB 資料載入失敗
        </h3>

        <p>
          ${error.message}
        </p>

        <p>
          PlaySport 日期：
          ${dateToPlaySport(selectedDate)}
        </p>

        <p>
          MLB API 查詢：
          ${formatDate(
            getMLBQueryDate()
          )}
        </p>

        <button
          onclick="loadMLBGames()"
        >
          重新載入
        </button>

      </div>

    `;

  }

}


/* =========================================================
   Summary
========================================================= */

function updateSummary(
  games
) {

  let preview = 0;

  let live = 0;

  let final = 0;


  games.forEach(
    game => {

      const state =
        game.status
          ?.abstractGameState;


      if (
        state === "Preview"
      ) {

        preview++;

      }

      else if (
        state === "Live"
      ) {

        live++;

      }

      else if (
        state === "Final"
      ) {

        final++;

      }

    }
  );


  document
    .getElementById(
      "totalGames"
    )
    .textContent =
      games.length;


  document
    .getElementById(
      "previewGames"
    )
    .textContent =
      preview;


  document
    .getElementById(
      "liveGames"
    )
    .textContent =
      live;


  document
    .getElementById(
      "finalGames"
    )
    .textContent =
      final;

}


/* =========================================================
   台灣時間
========================================================= */

function getTaiwanTime(
  gameDate
) {

  return new Intl.DateTimeFormat(
    "zh-TW",
    {
      timeZone:
        "Asia/Taipei",

      hour:
        "2-digit",

      minute:
        "2-digit",

      hour12: false
    }
  )
  .format(
    new Date(gameDate)
  );

}


/* =========================================================
   狀態
========================================================= */

function getStatusInfo(
  game
) {

  const status =
    game.status
      ?.abstractGameState ||
    "Preview";


  if (
    status === "Live"
  ) {

    return {

      text: "🔴 進行中",

      className:
        "status-live"

    };

  }


  if (
    status === "Final"
  ) {

    return {

      text: "✅ 比賽結束",

      className:
        "status-final"

    };

  }


  return {

    text: "尚未開打",

    className:
      "status-preview"

  };

}


/* =========================================================
   先發投手名稱
========================================================= */

function getPitcherName(
  pitcher
) {

  return (
    pitcher?.fullName ||
    pitcher?.name ||
    "尚未公布"
  );

}


/* =========================================================
   投手左右投
========================================================= */

function getPitcherHand(
  pitcher
) {

  const hand =
    pitcher?.pitchHand;


  if (!hand) {

    return "投手資料待取得";

  }


  if (
    hand.code === "R" ||
    hand.description === "Right"
  ) {

    return "右投";

  }


  if (
    hand.code === "L" ||
    hand.description === "Left"
  ) {

    return "左投";

  }


  return (
    hand.description ||
    "投手資料待取得"
  );

}


/* =========================================================
   投手數值格式
========================================================= */

function pitcherStatValue(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "—";

  }


  return value;

}


/* =========================================================
   投手百分比
========================================================= */

function calculatePitcherRate(
  numerator,
  denominator
) {

  const n =
    Number(numerator);


  const d =
    Number(denominator);


  if (
    !Number.isFinite(n) ||
    !Number.isFinite(d) ||
    d <= 0
  ) {

    return "—";

  }


  return (
    (n / d) *
    100
  ).toFixed(1) + "%";

}


/* =========================================================
   投手 IP 格式
========================================================= */

function formatPitcherIP(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "—";

  }


  return value;

}


/* =========================================================
   取得先發投手 Season Stats
========================================================= */

async function getPitcherSeasonStats(
  pitcherId
) {

  if (!pitcherId) {

    return {};

  }


  const cacheKey =
    `pitcher-season-${pitcherId}-2026`;


  if (
    pitcherAnalysisCache.has(
      cacheKey
    )
  ) {

    return pitcherAnalysisCache.get(
      cacheKey
    );

  }


  const url =
    `${MLB_API}/people/${pitcherId}/stats` +
    `?stats=season` +
    `&group=pitching` +
    `&season=2026`;


  try {

    const data =
      await getJSON(
        url
      );


    const stats =
      data.stats?.[0]
        ?.splits?.[0]
        ?.stat || {};


    pitcherAnalysisCache.set(
      cacheKey,
      stats
    );


    return stats;

  }


  catch(error) {

    console.warn(
      "先發投手 Season Stats 取得失敗",
      pitcherId,
      error
    );


    return {};

  }

}


/* =========================================================
   取得先發投手 Game Log
========================================================= */

async function getPitcherGameLog(
  pitcherId
) {

  if (!pitcherId) {

    return [];

  }


  const cacheKey =

/* =========================================================
   近 5 場先發摘要
========================================================= */

function getRecentStartsSummary(
  recentStarts
) {

  if (
    !recentStarts ||
    !recentStarts.length
  ) {

    return "近5場：—";

  }


  let wins = 0;

  let losses = 0;

  let totalIP = 0;

  let totalER = 0;

  let totalSO = 0;


  recentStarts.forEach(
    split => {

      const stat =
        split.stat || {};


      const decision =
        stat.decision ||
        split.isWinner;


      if (
        decision === "W" ||
        stat.wins > 0
      ) {

        wins++;

      }


      if (
        decision === "L" ||
        stat.losses > 0
      ) {

        losses++;

      }


      totalIP +=
        inningsToNumber(
          stat.inningsPitched
        );


      totalER +=
        Number(
          stat.earnedRuns ?? 0
        );


      totalSO +=
        Number(
          stat.strikeOuts ?? 0
        );

    }
  );


  let recentERA =
    "—";


  if (
    totalIP > 0
  ) {

    recentERA =
      (
        totalER *
        9 /
        totalIP
      ).toFixed(2);

  }


  return (
    `近${recentStarts.length}場：` +
    `${wins}-${losses}` +
    `｜ERA ${recentERA}` +
    `｜SO ${totalSO}`
  );

}


/* =========================================================
   Baseball IP 轉換
 *
 * MLB：
 * 5.0 = 5 innings
 * 5.1 = 5 1/3
 * 5.2 = 5 2/3
 * =========================================================
 */

function inningsToNumber(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return 0;

  }


  const text =
    String(value);


  if (
    !text.includes(".")
  ) {

    return Number(text) || 0;

  }


  const parts =
    text.split(".");


  const whole =
    Number(parts[0]) || 0;


  const fraction =
    Number(parts[1]);


  if (
    fraction === 1
  ) {

    return whole + 1 / 3;

  }


  if (
    fraction === 2
  ) {

    return whole + 2 / 3;

  }


  return Number(value) || 0;

}

/* =========================================================
   近況
========================================================= */

function calculateTeamForm(
  games,
  teamId
) {

  const last10 =
    games.slice(
      0,
      10
    );


  let wins = 0;

  let losses = 0;

  let runsFor = 0;

  let runsAgainst = 0;


  last10.forEach(
    game => {

      const isAway =
        game.teams.away.team.id ===
        teamId;


      const team =
        isAway
          ? game.teams.away
          : game.teams.home;


      const opponent =
        isAway
          ? game.teams.home
          : game.teams.away;


      const teamScore =
        Number(
          team.score ?? 0
        );


      const opponentScore =
        Number(
          opponent.score ?? 0
        );


      runsFor +=
        teamScore;


      runsAgainst +=
        opponentScore;


      if (
        team.isWinner
      ) {

        wins++;

      }

      else {

        losses++;

      }

    }
  );


  let streakType =
    "";

  let streakCount =
    0;


  if (
    last10.length
  ) {

    const first =
      last10[0];


    const firstIsAway =
      first.teams.away.team.id ===
      teamId;


    const firstTeam =
      firstIsAway
        ? first.teams.away
        : first.teams.home;


    const firstResult =
      !!firstTeam.isWinner;


    streakType =
      firstResult
        ? "W"
        : "L";


    for (
      const game of last10
    ) {

      const isAway =
        game.teams.away.team.id ===
        teamId;


      const team =
        isAway
          ? game.teams.away
          : game.teams.home;


      const result =
        !!team.isWinner;


      if (
        result === firstResult
      ) {

        streakCount++;

      }

      else {

        break;

      }

    }

  }


  return {

    wins,

    losses,

    runsFor,

    runsAgainst,

    games:
      last10.length,

    streakType,

    streakCount

  };

}


/* =========================================================
   主客場
========================================================= */

function calculateHomeAwayRecord(
  games,
  teamId,
  location
) {

  const filtered =
    games.filter(
      game => {

        const isHome =
          game.teams.home.team.id ===
          teamId;


        const isAway =
          game.teams.away.team.id ===
          teamId;


        if (
          location ===
          "home"
        ) {

          return isHome;

        }


        return isAway;

      }
    );


  let wins = 0;

  let losses = 0;


  filtered.forEach(
    game => {

      const isAway =
        game.teams.away.team.id ===
        teamId;


      const team =
        isAway
          ? game.teams.away
          : game.teams.home;


      if (
        team.isWinner
      ) {

        wins++;

      }

      else {

        losses++;

      }

    }
  );


  return {

    wins,

    losses

  };

}


/* =========================================================
   H2H
========================================================= */

function calculateH2H(
  games,
  teamId,
  opponentId
) {

  const h2hGames =
    games.filter(
      game => {

        const awayId =
          game.teams.away.team.id;


        const homeId =
          game.teams.home.team.id;


        return (

          (
            awayId === teamId &&
            homeId === opponentId
          )

          ||

          (
            homeId === teamId &&
            awayId === opponentId
          )

        );

      }
    );


  let wins = 0;

  let losses = 0;

  let runsFor = 0;

  let runsAgainst = 0;


  h2hGames.forEach(
    game => {

      const isAway =
        game.teams.away.team.id ===
        teamId;


      const team =
        isAway
          ? game.teams.away
          : game.teams.home;


      const opponent =
        isAway
          ? game.teams.home
          : game.teams.away;


      const teamScore =
        Number(
          team.score ?? 0
        );


      const opponentScore =
        Number(
          opponent.score ?? 0
        );


      runsFor +=
        teamScore;


      runsAgainst +=
        opponentScore;


      if (
        team.isWinner
      ) {

        wins++;

      }

      else {

        losses++;

      }

    }
  );


  return {

    wins,

    losses,

    runsFor,

    runsAgainst,

    games:
      h2hGames.length

  };

}

/* =========================================================
   格式化
========================================================= */

function statValue(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "—";

  }


  return value;

}


function average(
  total,
  games
) {

  if (
    !games
  ) {

    return "—";

  }


  return (
    Number(total) /
    Number(games)
  ).toFixed(1);

}

/* =========================================================
   局數
========================================================= */

function getInningText(
  linescore,
  status
) {

  if (
    status === "Final"
  ) {

    return "比賽結束";

  }


  if (
    !linescore?.currentInning
  ) {

    return "";

  }


  return `${
    linescore.inningHalf ===
    "Top"
      ? "上"
      : "下"
  }${linescore.currentInning}局`;

}


/* =========================================================
   球數
========================================================= */

function getCount(
  liveData
) {

  const linescore =
    liveData?.linescore;


  if (!linescore) {

    return "-";

  }


  const balls =
    linescore.balls;


  const strikes =
    linescore.strikes;


  if (
    balls === undefined ||
    strikes === undefined
  ) {

    return "-";

  }


  return `${balls}-${strikes}`;

}


/* =========================================================
   即時比分更新
========================================================= */

async function refreshLiveScores() {

  if (
    !document.querySelector(
      ".game-card"
    )
  ) {

    return;

  }


  const currentVersion =
    pageVersion;


  try {

    const games =
      await getMLBSchedule();


    if (
      currentVersion !==
      pageVersion
    ) {

      return;

    }


    updateSummary(
      games
    );


    for (
      const game of games
    ) {

      if (
        currentVersion !==
        pageVersion
      ) {

        return;

      }


      const card =
        document.querySelector(
          `[data-game-id="${game.gamePk}"]`
        );


      if (!card) {

        continue;

      }


      const state =
        game.status
          ?.abstractGameState;


      /*
       * 只有 LIVE / FINAL
       * 需要即時 Feed
       */

      if (
        state !== "Live" &&
        state !== "Final"
      ) {

        continue;

      }


      try {

        const feed =
          await getJSON(
            `${MLB_API}/game/${game.gamePk}/feed/live`
          );


        updateGameCardLive(
          card,
          game,
          feed
        );

      }


      catch(error) {

        console.warn(
          "Live Feed 更新失敗",
          game.gamePk,
          error
        );

      }

    }


    updateRefreshTime();

  }


  catch(error) {

    console.warn(
      "即時更新失敗",
      error
    );

  }

}


/* =========================================================
   更新 LIVE 卡片
========================================================= */

function updateGameCardLive(
  card,
  game,
  feed
) {

  const away =
    game.teams.away;


  const home =
    game.teams.home;


  const status =
    game.status
      ?.abstractGameState;


  /*
   * 比分
   */

  const scoreElement =
    card.querySelector(
      ".score"
    );


  if (scoreElement) {

    if (
      status === "Live" ||
      status === "Final"
    ) {

      scoreElement.textContent =
        `${away.score ?? 0} - ${home.score ?? 0}`;

    }

    else {

      scoreElement.textContent =
        "VS";

    }

  }


  /*
   * 狀態
   */

  const statusElement =
    card.querySelector(
      ".game-status"
    );


  if (statusElement) {

    const info =
      getStatusInfo(
        game
      );


    statusElement.textContent =
      info.text;


    statusElement.className =
      `game-status ${info.className}`;

  }


  /*
   * 局數
   */

  const linescore =
    feed?.liveData?.linescore;


  const inningText =
    getInningText(
      linescore,
      status
    );


  const inningElement =
    card.querySelector(
      ".inning-status"
    );


  if (inningElement) {

    inningElement.textContent =
      inningText;

  }


  /*
   * LIVE 局數
   */

  const liveInning =
    card.querySelector(
      ".live-inning"
    );


  if (liveInning) {

    liveInning.textContent =
      inningText || "-";

  }


  /*
   * OUTS
   */

  const liveOuts =
    card.querySelector(
      ".live-outs"
    );


  if (liveOuts) {

    liveOuts.textContent =
      linescore?.outs ?? "-";

  }


  /*
   * 球數
   */

  const liveCount =
    card.querySelector(
      ".live-count"
    );


  if (liveCount) {

    liveCount.textContent =
      getCount(
        feed?.liveData
      );

  }


  /*
   * LIVE → FINAL
   */

  if (
    status === "Final"
  ) {

    const liveState =
      card.querySelector(
        ".live-state"
      );


    if (liveState) {

      liveState.textContent =
        "FINAL";

    }

  }

}


/* =========================================================
   啟動 LIVE Refresh
========================================================= */

function startLiveRefresh() {

  if (liveUpdateTimer) {

    clearInterval(
      liveUpdateTimer
    );

  }


  liveUpdateTimer =
    setInterval(
      refreshLiveScores,
      15000
    );

}


/* =========================================================
   更新時間
========================================================= */

function updateRefreshTime() {

  const now =
    new Date();


  const time =
    new Intl.DateTimeFormat(
      "zh-TW",
      {

        timeZone:
          "Asia/Taipei",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .format(now);


  document
    .getElementById(
      "refreshInfo"
    )
    .textContent =
      `🔄 最後更新：${time} ｜ 每 15 秒自動更新`;

}


/* =========================================================
   日期按鈕
========================================================= */


/*
 * 前一天
 */

document
  .getElementById(
    "prevDay"
  )
  .addEventListener(
    "click",
    () => {

      selectedDate =
        addDays(
          selectedDate,
          -1
        );


      loadMLBGames();

    }
  );


/*
 * 後一天
 */

document
  .getElementById(
    "nextDay"
  )
  .addEventListener(
    "click",
    () => {

      selectedDate =
        addDays(
          selectedDate,
          1
        );


      loadMLBGames();

    }
  );


/*
 * 回到 09/13
 */

document
  .getElementById(
    "today"
  )
  .addEventListener(
    "click",
    () => {

      selectedDate =
        "2026-09-13";


      loadMLBGames();

    }
  );


/* =========================================================
   啟動
========================================================= */

updateDateUI();

loadMLBGames();

</script>

</body>

</html>
