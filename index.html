<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MLB 賽事分析</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-bottom: 15px;
            color: #64748b;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .game-time {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .team {
            width: 40%;
        }

        .team.away {
            text-align: left;
        }

        .team.home {
            text-align: right;
        }

        .vs {
            width: 20%;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .section {
            border-top: 1px solid #e5e7eb;
            margin-top: 15px;
            padding-top: 15px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111827;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 6px 0;
            font-size: 14px;
        }

        .label {
            color: #64748b;
        }

        .pitchers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pitcher-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px;
        }

        .pitcher-team {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .pitcher-name {
            font-weight: bold;
            font-size: 15px;
        }

        .season-box {
            background: #eff6ff;
            border-radius: 8px;
            padding: 12px;
        }

        .season-progress {
            margin-top: 8px;
            height: 8px;
            background: #dbeafe;
            border-radius: 10px;
            overflow: hidden;
        }

        .season-progress-bar {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
        }

        .small-note {
            color: #64748b;
            font-size: 12px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .games {
                grid-template-columns: 1fr;
            }

            .pitchers {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>⚾ MLB 賽事分析</h1>
        <p>MLB 官方資料分析系統</p>
    </div>
</header>

<div class="container">

    <div class="top-bar">
        <h2>今日 MLB 賽事</h2>

        <button onclick="loadGames()">
            🔄 重新整理
        </button>
    </div>

    <div id="status">
        正在取得 MLB 賽程...
    </div>

    <div id="games" class="games">

        <div class="loading">
            正在載入比賽資料...
        </div>

    </div>

</div>


<script>

    // ==========================================
    // 基本設定
    // ==========================================

    const MLB_API =
        "https://statsapi.mlb.com/api/v1";

    const CURRENT_SEASON = 2026;

    const TOTAL_REGULAR_SEASON_GAMES = 162;


    // ==========================================
    // 取得今天日期
    // ==========================================

    function getToday() {

        const today = new Date();

        const year = today.getFullYear();

        const month =
            String(today.getMonth() + 1)
            .padStart(2, "0");

        const day =
            String(today.getDate())
            .padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    // ==========================================
    // 計算目前賽季進度
    // ==========================================

    function getSeasonProgress() {

        const today = new Date();

        const seasonStart =
            new Date(`${CURRENT_SEASON}-03-01`);

        const seasonEnd =
            new Date(`${CURRENT_SEASON}-11-01`);

        let progress =
            ((today - seasonStart) /
            (seasonEnd - seasonStart)) * 100;

        progress =
            Math.max(0, Math.min(100, progress));

        return progress;
    }


    // ==========================================
    // 判斷賽季階段
    // ==========================================

    function getSeasonStage() {

        const today = new Date();

        const month = today.getMonth() + 1;

        const day = today.getDate();

        if (month <= 4) {

            return "🟢 賽季初期";

        }

        if (month <= 6) {

            return "🔵 賽季前段";

        }

        if (month <= 7) {

            return "🟡 賽季中段";

        }

        if (month <= 8) {

            return "🟠 賽季後段";

        }

        return "🔴 賽季末段";
    }


    // ==========================================
    // 取得 MLB 賽程
    // ==========================================

    async function loadGames() {

        const gamesContainer =
            document.getElementById("games");

        const status =
            document.getElementById("status");

        gamesContainer.innerHTML = `
            <div class="loading">
                正在取得 MLB 賽程...
            </div>
        `;

        status.innerText =
            "正在連線 MLB 官方資料...";


        const today = getToday();


        const apiUrl =
            `${MLB_API}/schedule?sportId=1&date=${today}`;


        try {

            const response =
                await fetch(apiUrl);


            if (!response.ok) {

                throw new Error(
                    "MLB API 回應錯誤"
                );

            }


            const data =
                await response.json();


            console.log(
                "MLB API 資料：",
                data
            );


            await displayGames(data);


        } catch (error) {

            console.error(error);

            status.innerText = "";

            gamesContainer.innerHTML = `
                <div class="error">
                    ⚠️ 無法取得 MLB 賽程。<br><br>
                    請稍後重新整理頁面。
                </div>
            `;
        }
    }


    // ==========================================
    // 取得單場比賽詳細資料
    // ==========================================

    async function getGameDetails(gamePk) {

        const url =
            `${MLB_API}/game/${gamePk}/feed/live`;

        try {

            const response =
                await fetch(url);

            if (!response.ok) {

                throw new Error(
                    "比賽詳細資料取得失敗"
                );

            }

            return await response.json();

        } catch (error) {

            console.error(
                "Game API Error:",
                error
            );

            return null;
        }
    }


    // ==========================================
    // 取得先發投手
    // ==========================================

    function getProbablePitcher(
        gameData,
        side
    ) {

        if (
            !gameData ||
            !gameData.gameData ||
            !gameData.gameData.probablePitchers
        ) {

            return null;
        }


        const pitcher =
            gameData.gameData.probablePitchers[side];


        if (!pitcher) {

            return null;
        }


        return pitcher;
    }


    // ==========================================
    // 顯示所有比賽
    // ==========================================

    async function displayGames(data) {

        const gamesContainer =
            document.getElementById("games");

        const status =
            document.getElementById("status");


        gamesContainer.innerHTML = "";


        if (
            !data.dates ||
            data.dates.length === 0
        ) {

            gamesContainer.innerHTML = `
                <div class="empty">
                    今天沒有 MLB 比賽。
                </div>
            `;

            status.innerText =
                "資料來源：MLB 官方資料";

            return;
        }


        const games =
            data.dates[0].games;


        status.innerText =
            `今天共有 ${games.length} 場 MLB 比賽`;


        const seasonStage =
            getSeasonStage();


        const seasonProgress =
            getSeasonProgress();


        // 一場一場取得詳細資料
        for (const game of games) {

            const awayTeam =
                game.teams.away.team.name;

            const homeTeam =
                game.teams.home.team.name;


            const gameTime =
                new Date(game.gameDate)
                .toLocaleTimeString(
                    "zh-TW",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            const venue =
                game.venue?.name ||
                "球場資料讀取中";


            const statusText =
                game.status?.detailedState ||
                "未知";


            // 取得這場比賽詳細資料
            const gameData =
                await getGameDetails(
                    game.gamePk
                );


            const awayPitcher =
                getProbablePitcher(
                    gameData,
                    "away"
                );


            const homePitcher =
                getProbablePitcher(
                    gameData,
                    "home"
                );


            const awayPitcherName =
                awayPitcher?.fullName ||
                "尚未公布";


            const homePitcherName =
                homePitcher?.fullName ||
                "尚未公布";


            const gameCard =
                document.createElement("div");


            gameCard.className =
                "game-card";


            gameCard.innerHTML = `

                <div class="game-time">
                    🕐 ${gameTime}
                </div>


                <div class="teams">

                    <div class="team away">
                        ${awayTeam}
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="team home">
                        ${homeTeam}
                    </div>

                </div>


                <div class="section">

                    <div class="section-title">
                        🧑‍⚾ 預計先發投手
                    </div>


                    <div class="pitchers">

                        <div class="pitcher-box">

                            <div class="pitcher-team">
                                ${awayTeam}
                            </div>

                            <div class="pitcher-name">
                                ${awayPitcherName}
                            </div>

                        </div>


                        <div class="pitcher-box">

                            <div class="pitcher-team">
                                ${homeTeam}
                            </div>

                            <div class="pitcher-name">
                                ${homePitcherName}
                            </div>

                        </div>

                    </div>


                    <div class="small-note">
                        ※ MLB 官方資料；尚未公布時顯示「尚未公布」
                    </div>

                </div>


                <div class="section">

                    <div class="section-title">
                        🗓️ 賽季狀態
                    </div>


                    <div class="season-box">

                        <div class="info-row">

                            <span class="label">
                                賽季
                            </span>

                            <span>
                                ${CURRENT_SEASON} MLB
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="label">
                                賽季階段
                            </span>

                            <span>
                                ${seasonStage}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="label">
                                正規賽
                            </span>

                            <span>
                                162 場
                            </span>

                        </div>


                        <div class="season-progress">

                            <div
                                class="season-progress-bar"
                                style="width:${seasonProgress}%"
                            ></div>

                        </div>


                        <div class="small-note">

                            賽季時間進度約
                            ${seasonProgress.toFixed(1)}%

                        </div>

                    </div>

                </div>


                <div class="section">

                    <div class="info-row">

                        <span class="label">
                            比賽狀態
                        </span>

                        <span>
                            ${statusText}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">
                            球場
                        </span>

                        <span>
                            ${venue}
                        </span>

                    </div>

                </div>

            `;


            gamesContainer.appendChild(
                gameCard
            );
        }
    }


    // ==========================================
    // 啟動
    // ==========================================

    loadGames();

</script>

</body>
</html>
