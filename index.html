<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#222;font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif}
header{background:#111;color:#fff;padding:18px}.header-inner,.container{max-width:1280px;margin:auto}.subtitle{color:#aaa;font-size:13px;margin-top:5px}

.game-card{overflow:hidden;margin-bottom:15px}.game-top{padding:10px 15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.game-time{font-size:18px;font-weight:bold}.status{padding:5px 9px;border-radius:5px;font-size:12px;background:#eee}.result-badges{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.result-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold}.hit{background:#e4f7e9;color:#147333;border:1px solid #b8e2c2}.miss{background:#ffe7e7;color:#b42318;border:1px solid #f2b8b5}.pending{background:#f2f3f5;color:#777;border:1px solid #ddd}.analysis hr{border:0;border-top:1px solid #eee;margin:10px 0}.result-note{font-size:12px;color:#666;margin-top:8px}.preview{background:#e8f1ff;color:#1455b8}.live{background:#ffe3e3;color:#c00000;font-weight:bold}.final{background:#e4f7e9;color:#147333}
.teams{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;padding:18px;gap:10px}.team{display:flex;align-items:center;gap:10px}.away{justify-content:flex-end;text-align:right}.logo{width:54px;height:54px;object-fit:contain}.team-name{font-size:18px;font-weight:bold}.team-sub{font-size:11px;color:#888;margin-top:3px}.score{text-align:center;font-size:27px;font-weight:bold}.inning{text-align:center;font-size:12px;color:#c00000;min-height:17px}
.section{border-top:1px solid #eee;padding:14px 15px}.section-title{font-weight:bold;font-size:15px;margin-bottom:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pitch{background:#fafafa;border:1px solid #eee;border-radius:7px;padding:10px}.pitch-name{font-weight:bold}.muted{font-size:11px;color:#888}.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.stat{background:#fff;border:1px solid #eee;border-radius:5px;padding:6px;text-align:center}.stat b{display:block;font-size:13px}.stat span{font-size:9px;color:#888}
.tablewrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{border-bottom:1px solid #eee;padding:7px;text-align:center;white-space:nowrap}.data-table th{background:#f5f5f5}
.analysis{background:#f5f9ff;border-left:4px solid #2864d7;padding:12px;margin:0 15px 15px;border-radius:5px;line-height:1.7;font-size:13px}.analysis strong{font-size:15px}
.loading,.error{text-align:center;padding:35px}.error{color:#a40000}.source{font-size:11px;color:#888;text-align:center;margin:18px}.tag{display:inline-block;border:1px solid #ddd;border-radius:12px;padding:2px 7px;margin:2px;font-size:11px;background:#fff}
@media(max-width:750px){.summary{grid-template-columns:repeat(2,1fr)}.teams{grid-template-columns:1fr;text-align:center}.away,.home{justify-content:center;text-align:center}.two{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(5,1fr)}}
.weather-value{font-size:18px;font-weight:700;margin-top:5px}.weather-value .muted{font-size:14px;font-weight:400}.score-prediction{display:flex;align-items:center;gap:14px;margin:10px 0;padding:12px 14px;border:1px solid #d9e0e8;border-radius:12px;background:#f8fafc}.score-prediction>div{display:flex;flex-direction:column;gap:3px}.score-prediction strong{font-size:22px}.score-dash{font-size:22px!important;font-weight:700!important}.score-total{margin-left:auto;padding-left:16px;border-left:1px solid #d9e0e8}.accuracy-box{background:#fff;border:1px solid #ddd;border-radius:9px;padding:13px;margin-bottom:15px}.accuracy-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.accuracy-item{background:#f7f8fa;border:1px solid #eee;border-radius:7px;padding:9px;text-align:center}.accuracy-item b{display:block;font-size:20px;margin-top:3px}.accuracy-note{font-size:11px;color:#777;margin-top:8px}.phase-tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef3ff;color:#2454a6;font-size:11px;font-weight:bold}.calc-detail{margin-top:8px;background:#fff;border:1px solid #e1e6ed;border-radius:7px;padding:9px}.calc-detail ul{margin:6px 0 0 18px;padding:0}@media(max-width:750px){.accuracy-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.score-prediction{gap:8px}.score-prediction strong{font-size:18px}.score-total{padding-left:8px}}
</style>

<body>
<header><div class="header-inner"><h1>⚾ MLB 分析中心</h1><div class="subtitle">MLB 官方球隊／投手數據 + 自動勝負／預估分數分析</div></div></header>
<div class="container">
  <div class="bar">
    <div class="buttons"><button id="prev">← 前一天</button><button id="today">今天</button><button id="next">後一天 →</button></div>
    <div id="dateText"></div>
  </div>
  <div class="summary">
    <div class="summary-box"><div class="summary-title">今日比賽</div><div class="summary-value" id="total">-</div></div>
    <div class="summary-box"><div class="summary-title">尚未開打</div><div class="summary-value" id="preview">-</div></div>
    <div class="summary-box"><div class="summary-title">🔴 進行中</div><div class="summary-value" id="live">-</div></div>
    <div class="summary-box"><div class="summary-title">已結束</div><div class="summary-value" id="final">-</div></div>
  </div>
  <div id="accuracy"></div>
  <div id="games"><div class="loading">正在載入 MLB 比賽…</div></div>
  <div class="source" id="refreshInfo">MLB 官方資料載入中</div>
</div>

<script>
const MLB_API="https://statsapi.mlb.com/api/v1";
const PS="https://www.playsport.cc/livescore/1";
const PSP="https://www.playsport.cc/predict/scale?allianceid=1&gametime=";
const LS=["https://ls6.playsport.cc","https://ls7.playsport.cc"];
let selectedDate=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
const teamCache=new Map(),playerCache=new Map();

const teamNames={
ARI:"響尾蛇",ATL:"勇士",BAL:"金鶯",BOS:"紅襪",CHC:"小熊",CWS:"白襪",CIN:"紅人",CLE:"守護者",
COL:"落磯",DET:"老虎",HOU:"太空人",KC:"皇家",LAA:"天使",LAD:"道奇",MIA:"馬林魚",MIL:"釀酒人",
MIN:"雙城",NYM:"大都會",NYY:"洋基",OAK:"運動家",PHI:"費城人",PIT:"海盜",SD:"教士",SF:"巨人",
SEA:"水手",STL:"紅雀",TB:"光芒",TEX:"遊騎兵",TOR:"藍鳥",WSH:"國民"
};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function addDays(s,n){let d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function psDate(){return selectedDate.replaceAll("-","")}
function fmtDate(){return selectedDate.replaceAll("-","/")}
function setDateUI(){
  document.getElementById("dateText").textContent=`🇹🇼 ${fmtDate()} ｜ MLB 官方賽程`;
  document.getElementById("prev").textContent=`← ${addDays(selectedDate,-1).slice(5).replace("-","/")}`;
  document.getElementById("next").textContent=`${addDays(selectedDate,1).slice(5).replace("-","/")} →`;
}
async function json(url,timeout=15000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);
  try{let r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
async function mlbSchedule(){
  const begin=addDays(selectedDate,-1), end=addDays(selectedDate,1);
  const d=await json(`${MLB_API}/schedule?sportId=1&startDate=${begin}&endDate=${end}&hydrate=team,probablePitcher`).catch(()=>null);
  if(!d)return [];

  const taiwanDate=g=>{
    try{
      return new Intl.DateTimeFormat("en-CA",{
        year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Asia/Taipei"
      }).format(new Date(g.gameDate));
    }catch{return ""}
  };

  const seen=new Set();
  return (d.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>taiwanDate(g)===selectedDate)
    .filter(g=>{
      if(seen.has(g.gamePk))return false;
      seen.add(g.gamePk);
      return true;
    })
    .sort((a,b)=>new Date(a.gameDate)-new Date(b.gameDate));
}
function logo(id){return `https://www.mlbstatic.com/team-logos/${id}.svg`}
function code(t){return t?.abbreviation||t?.team?.abbreviation||""}
function gameStatus(g){
  let s=g.status?.abstractGameState||"Preview";
  if(s==="Live")return ["進行中","live"];
  if(s==="Final")return ["已結束","final"];
  return [g.status?.detailedState||"尚未開打","preview"];
}
function timeTW(g){try{return new Intl.DateTimeFormat("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Taipei"}).format(new Date(g.gameDate))}catch{return "--:--"}}
async function feed(g){
  return json(`https://statsapi.mlb.com/api/v1.1/game/${g.gamePk}/feed/live`,12000).catch(()=>null);
}
function extractWeather(feedData){
  const w=feedData?.gameData?.weather||{};
  const temp=Number(w.temp);
  const rawWind=String(w.wind??"").trim();
  const wm=rawWind.match(/(-?\d+(?:\.\d+)?)\s*mph/i);
  return {
    temp:Number.isFinite(temp)?temp:null,
    condition:w.condition?String(w.condition):null,
    wind:wm?Number(wm[1]):null,
    windText:rawWind||null,
    source:(w.temp!=null||w.condition||w.wind)?"MLB 官方 feed/live gameData.weather":"資料不足"
  };
}
async function teamStats(id){
  const key=`season-${id}-${new Date().getFullYear()}`;
  if(teamCache.has(key))return teamCache.get(key);
  let season=new Date().getFullYear();
  let d=await json(`${MLB_API}/teams/${id}/stats?stats=season&group=hitting&season=${season}`).catch(()=>null);
  let s=d?.stats?.[0]?.splits?.[0]?.stat||{};
  let v={avg:s.avg??null,ops:s.ops??null,runs:s.runs??null,games:s.gamesPlayed??null,obp:s.obp??null,slg:s.slg??null,source:"MLB 官方本季"};
  teamCache.set(key,v);return v;
}
async function recentTeamStats(id){
  const key=`recent10-${id}-${selectedDate}`;
  if(teamCache.has(key))return teamCache.get(key);
  const end=addDays(selectedDate,-1);
  const begin=addDays(end,-30);
  let d=await json(`${MLB_API}/schedule?sportId=1&teamId=${id}&startDate=${begin}&endDate=${end}&hydrate=team`).catch(()=>null);
  let games=(d?.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>g.status?.abstractGameState==="Final")
    .sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate))
    .slice(0,10);
  if(games.length<10){
    const v={games:games.length,avg:null,ops:null,obp:null,slg:null,runs:null,allowed:null,source:"MLB 官方近10場（資料不足10場）"};
    teamCache.set(key,v);return v;
  }
  let totals={ab:0,h:0,bb:0,hbp:0,sf:0,db:0,tb3:0,hr:0,r:0,pa:0,allowed:0};
  let ok=0;
  for(const g of games){
    let b=await json(`${MLB_API}/game/${g.gamePk}/boxscore`,12000).catch(()=>null);
    let side=g.teams?.away?.team?.id===id?"away":g.teams?.home?.team?.id===id?"home":null;
    let st=side?b?.teams?.[side]?.teamStats?.batting:null;
    let opp=side==="away"?b?.teams?.home?.teamStats?.batting:b?.teams?.away?.teamStats?.batting;
    if(!st||!opp)continue;
    totals.ab+=Number(st.atBats)||0; totals.h+=Number(st.hits)||0; totals.bb+=Number(st.baseOnBalls)||0;
    totals.hbp+=Number(st.hitByPitch)||0; totals.sf+=Number(st.sacFlies)||0; totals.db+=Number(st.doubles)||0;
    totals.tb3+=Number(st.triples)||0; totals.hr+=Number(st.homeRuns)||0; totals.r+=Number(st.runs)||0;
    totals.pa+=Number(st.plateAppearances)||0; totals.allowed+=Number(opp.runs)||0; ok++;
  }
  if(ok<10||totals.ab<=0){
    const v={games:ok,avg:null,ops:null,obp:null,slg:null,runs:null,allowed:null,source:"MLB 官方近10場（資料不足）"};
    teamCache.set(key,v);return v;
  }
  const singles=totals.h-totals.db-totals.tb3-totals.hr;
  const tb=singles+2*totals.db+3*totals.tb3+4*totals.hr;
  const obp=(totals.h+totals.bb+totals.hbp)/(totals.ab+totals.bb+totals.hbp+totals.sf);
  const slg=tb/totals.ab;
  const avg=totals.h/totals.ab;
  const v={games:10,avg:avg.toFixed(3),ops:(obp+slg).toFixed(3),obp:obp.toFixed(3),slg:slg.toFixed(3),runs:totals.r/10,allowed:totals.allowed/10,source:"MLB 官方近10場實際比賽"};
  teamCache.set(key,v);return v;
}
async function recentBullpenStats(id){
  const key=`bullpen-${id}-${selectedDate}`;
  if(teamCache.has(key))return teamCache.get(key);
  const end=addDays(selectedDate,-1),begin=addDays(end,-30);
  let d=await json(`${MLB_API}/schedule?sportId=1&teamId=${id}&startDate=${begin}&endDate=${end}&hydrate=team`,12000).catch(()=>null);
  let games=(d?.dates||[]).flatMap(x=>x.games||[])
    .filter(g=>g.status?.abstractGameState==='Final')
    .sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate)).slice(0,10);
  if(games.length<10){const v={games:games.length,ip:null,era:null,whip:null,er:null,bb:null,h:null,complete:false};teamCache.set(key,v);return v}
  let ip=0,er=0,bb=0,h=0,ok=0;
  for(const g of games){
    const b=await json(`${MLB_API}/game/${g.gamePk}/boxscore`,12000).catch(()=>null);
    const side=g.teams?.away?.team?.id===id?'away':g.teams?.home?.team?.id===id?'home':null;
    const team=b?.teams?.[side];
    if(!team?.players)continue;
    const pitchers=Object.values(team.players).filter(x=>x?.stats?.pitching);
    if(!pitchers.length)continue;
    for(const pl of pitchers){
      const ps=pl.stats.pitching;
      if(Number(ps.gamesStarted||0)>0)continue;
      ip+=Number(ps.inningsPitched)||0;
      er+=Number(ps.earnedRuns)||0;
      bb+=Number(ps.baseOnBalls)||0;
      h+=Number(ps.hits)||0;
    }
    ok++;
  }
  const v=ok===10&&ip>0?{games:10,ip,er,bb,h,era:er*9/ip,whip:(h+bb)/ip,complete:true}:{games:ok,ip:null,era:null,whip:null,er:null,bb:null,h:null,complete:false};
  teamCache.set(key,v);return v;
}
async function pitcher(id){
  if(!id)return null;if(playerCache.has(id))return playerCache.get(id);
  let season=new Date().getFullYear();
  let d=await json(`${MLB_API}/people/${id}/stats?stats=season,seasonAdvanced&group=pitching&season=${season}`).catch(()=>null);
  const splits=d?.stats||[];
  const basic=splits.find(x=>x.type?.displayName==="season"||x.type?.name==="season")?.splits?.[0]?.stat||splits?.[0]?.splits?.[0]?.stat||{};
  const adv=splits.find(x=>x.type?.displayName==="seasonAdvanced"||x.type?.name==="seasonAdvanced")?.splits?.[0]?.stat||{};
  const s={...basic,...adv};
  let p={
    era:s.era||"-",wins:s.wins??"-",losses:s.losses??"-",avg:s.avg||"-",whip:s.whip||"-",so:s.strikeOuts??"-",
    fip:s.fip??s.fipMinus??null,
    k9:s.strikeoutsPer9Inn??s.kPer9??null,
    bb9:s.walksPer9Inn??s.bbPer9??null,
    inningsPitched:s.inningsPitched??null,
    homeRuns:s.homeRuns??null,baseOnBalls:s.baseOnBalls??null
  };
  playerCache.set(id,p);return p;
}
async function fetchText(url){
  const targets=[
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(url)}`
  ];
  for(const u of targets){
    try{let r=await fetch(u);if(r.ok){let x=await r.text();if(x.includes("PlaySport")||x.includes("先發投手")||x.includes("gamelist"))return x}}catch(e){}
  }
  throw Error("PlaySport proxy 無法連線");
}
function strip(s){return (s||"").replace(/\s+/g," ").trim()}
function textBetween(text,label,nextLabels=[]){
  let i=text.indexOf(label);if(i<0)return "";
  let x=text.slice(i+label.length);
  let end=x.length;
  nextLabels.forEach(n=>{let j=x.indexOf(n);if(j>=0&&j<end)end=j});
  return strip(x.slice(0,end)).slice(0,160);
}
function parsePS(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  const map=new Map();
  const names=Object.values(teamNames);
  const codeByName={};Object.entries(teamNames).forEach(([k,v])=>codeByName[v]=k);
  const clean=s=>strip(String(s||"")).replace(/\u00a0/g," ").replace(/[\t\r\n]+/g," ").replace(/\s+/g," ").trim();

  function market(tx){
    tx=clean(tx);
    const spreadAway=(tx.match(/客\s*([+-]?\d+(?:\.\d+)?)\s*[,，@]\s*(\d+(?:\.\d+)?)/)||[]);
    const spreadHome=(tx.match(/主\s*([+-]?\d+(?:\.\d+)?)\s*[,，@]\s*(\d+(?:\.\d+)?)/)||[]);
    const mlAway=(tx.match(/(?:^|[\s|])客\s*(\d+(?:\.\d+)?)(?=\s|\||$)/)||[]);
    const mlHome=(tx.match(/(?:^|[\s|])主\s*(\d+(?:\.\d+)?)(?=\s|\||$)/)||[]);
    const intlTotals=[...tx.matchAll(/(?:^|[\s|])([大小])\s*(\d+(?:\.\d+)?)\s*(?:(贏|輸|平)\s*)?(\d+(?:\.\d+)?)?\s*%/g)];
    const intl= intlTotals[0] || null;
    const intlPick=intl?intl[1]:null;
    const intlLine=intl?+intl[2]:null;
    const intlResult=intl?intl[3]||null:null;
    const intlRate=intl&&intl[4]!=null?+intl[4]:null;

    const totals=[...tx.matchAll(/(?:^|[\s|])([大小])\s*(\d+(?:\.\d+)?)\s*(?:[,，@]\s*|\s+)(\d+(?:\.\d+)?)(?=\s|\||$)/g)];
    const ov=totals.find(x=>x[1]==="大"), un=totals.find(x=>x[1]==="小");
    const line=intlLine!=null?intlLine:(ov?+ov[2]:(un?+un[2]:null));
    return {
      spread:`${spreadAway[1]?"客"+spreadAway[1]+" @"+spreadAway[2]:"-"} / ${spreadHome[1]?"主"+spreadHome[1]+" @"+spreadHome[2]:"-"}`,
      spreadAway:spreadAway[1]?+spreadAway[1]:null,spreadAwayOdds:spreadAway[2]?+spreadAway[2]:null,
      spreadHome:spreadHome[1]?+spreadHome[1]:null,spreadHomeOdds:spreadHome[2]?+spreadHome[2]:null,
      moneyline:`${mlAway[1]?"客 @"+mlAway[1]:"-"} / ${mlHome[1]?"主 @"+mlHome[1]:"-"}`,
      moneyAway:mlAway[1]?+mlAway[1]:null,moneyHome:mlHome[1]?+mlHome[1]:null,
      totalLine:line,
      totalPick:intlPick,
      totalResult:intlResult,
      overRate:intlPick==="大"&&intlRate!=null?intlRate:(intlPick==="小"&&intlRate!=null?100-intlRate:null),
      totalRate:intlRate,
      overOdds:intlLine!=null?null:(ov?+ov[3]:null),
      underOdds:intlLine!=null?null:(un?+un[3]:null),
      total:intlLine!=null?`${intlPick||"-"} ${intlLine}${intlResult?intlResult:""}${intlRate!=null?` ${intlRate}%`:""}`:(line!=null?`${line}（大 ${ov?ov[3]:"-"} / 小 ${un?un[3]:"-"}）`:"")
    };
  }

  function addGame(away,home,tx,oid=""){
    if(!away||!home||away===home)return;
    const key=away+"@"+home;
    tx=clean(tx);
    const existing=map.get(key);
    if(existing){
      const mk=market(tx);
      if(mk.totalLine!=null){
        existing.totalLine=mk.totalLine; existing.overOdds=mk.overOdds; existing.underOdds=mk.underOdds; existing.total=mk.total;
      }
      if(mk.spreadAway!=null){existing.spreadAway=mk.spreadAway;existing.spreadAwayOdds=mk.spreadAwayOdds;existing.spreadHome=mk.spreadHome;existing.spreadHomeOdds=mk.spreadHomeOdds;existing.spread=mk.spread;}
      if(mk.moneyAway!=null||mk.moneyHome!=null){existing.moneyAway=mk.moneyAway;existing.moneyHome=mk.moneyHome;existing.moneyline=mk.moneyline;}
      if(tx.length>existing.text.length)existing.text=tx;
      map.set(key,existing);
      return;
    }
    const mk=market(tx);
    const pitchers={};
    [away,home].forEach((n,i)=>{
      const pos=tx.indexOf(n);
      const after=pos>=0?tx.slice(pos+n.length,pos+n.length+120):"";
      const m=after.match(/^([A-Za-zÀ-ÿ.\-’' ]{2,40})/);
      pitchers[i]=m?m[1].trim():"";
    });
    map.set(key,{oid:oid||key,awayName:away,homeName:home,awayCode:codeByName[away],homeCode:codeByName[home],text:tx,
      pitching:`${pitchers[0]||""} / ${pitchers[1]||""}`,...mk,
      over:"",record:"",homeAway:"",h2h:"",last10:"",vsR:"",vsL:"",avgRun:"",avgRun10:""});
  }

  const teamAnchors=[...doc.querySelectorAll('a')].filter(a=>names.includes(clean(a.textContent)));
  teamAnchors.forEach(a=>{
    let node=a,best=null,bestScore=-999;
    for(let up=0;up<14&&node;up++,node=node.parentElement){
      const tx=clean(node.innerText||node.textContent||"");
      const found=names.filter(n=>tx.includes(n));
      if(found.length<2||tx.length>7000)continue;
      let score=found.length*2-up*.2;
      if(tx.includes("今日大小盤口"))score+=12;
      if(/(?:大|小)\s*\d+(?:\.\d+)?\s*(?:[,，@]|\s+)\s*\d+(?:\.\d+)?/.test(tx))score+=10;
      if(tx.includes("今日讓分盤口"))score+=4;
      if(score>bestScore){best=node;bestScore=score;}
      if(score>=26)break;
    }
    if(!best)return;
    const tx=clean(best.innerText||best.textContent||"");
    const found=[];names.forEach(n=>{if(tx.includes(n)&&!found.includes(n))found.push(n)});
    if(found.length>=2)addGame(found[0],found[1],tx);
  });

  const textDoc=doc.cloneNode(true);
  textDoc.querySelectorAll("input").forEach(inp=>{
    const v=inp.getAttribute("value") ?? inp.value ?? "";
    if(v) inp.replaceWith(textDoc.createTextNode(" "+v+" "));
  });
  const bodyText=clean(textDoc.body?.innerText||textDoc.body?.textContent||"");
  if(bodyText){
    for(let i=0;i<names.length;i++)for(let j=0;j<names.length;j++){
      if(i===j)continue;
      const away=names[i],home=names[j];
      const pa=bodyText.indexOf(away),ph=bodyText.indexOf(home,pa+away.length);
      if(pa<0||ph<0||ph-pa>4500)continue;
      const tx=bodyText.slice(pa,Math.min(bodyText.length,ph+1800));
      if(!/(?:大|小)\s*\d+(?:\.\d+)?\s*(?:(?:贏|輸|平)\s*\d+(?:\.\d+)?\s*%|(?:[,，@]|\s+)\s*\d+(?:\.\d+)?)/.test(tx))continue;
      addGame(away,home,tx);
    }
  }

  doc.querySelectorAll('[data-oid]').forEach(el=>{
    const oid=el.getAttribute('data-oid')||"",txt=clean(el.innerText||el.textContent||"");
    if(!oid||!txt)return;
    let obj=map.get(oid);
    if(!obj){
      const found=names.filter(n=>txt.includes(n));
      if(found.length>=2){addGame(found[0],found[1],txt,oid);obj=map.get(found[0]+"@"+found[1]);}
    }
    if(!obj)return;
    obj.text=obj.text||txt;
    obj.pitching=obj.pitching||textBetween(txt,"先發投手",["團隊打擊","今日讓分盤口","戰績"]);
    obj.batting=obj.batting||textBetween(txt,"團隊打擊",["今日讓分盤口","戰績"]);
    obj.spreadRate=textBetween(txt,"讓分過盤率",["近十場讓分盤過盤率","今日大小盤口","戰績"]);
    obj.spread10=textBetween(txt,"近十場讓分盤過盤率",["今日大小盤口","戰績"]);
    obj.over=textBetween(txt,"大分過盤率",["戰績","主 / 客戰績"]);
    obj.overRate=rateFromText(obj.over);
    if(obj.overRate==null){
      const om=txt.match(/大分(?:預測比例|預測|過盤率)?[^0-9]{0,20}(\d+(?:\.\d+)?)\s*%/);
      if(om)obj.overRate=+om[1];
    }
    obj.record=textBetween(txt,"戰績",["主 / 客戰績","對戰紀錄"]);
    obj.homeAway=textBetween(txt,"主 / 客戰績",["對戰紀錄","近十場"]);
    obj.h2h=textBetween(txt,"對戰紀錄",["近十場","面對先發右投"]);
    obj.last10=textBetween(txt,"近十場",["面對先發右投","面對先發左投"]);
    obj.vsR=textBetween(txt,"面對先發右投",["面對先發左投","平均得 / 失分"]);
    obj.vsL=textBetween(txt,"面對先發左投",["平均得 / 失分","近十場平均得 / 失分"]);
    obj.avgRun=textBetween(txt,"平均得 / 失分",["近十場平均得 / 失分"]);
    obj.avgRun10=textBetween(txt,"近十場平均得 / 失分",[]);
    if(obj.totalLine==null){
      const fallback=market(txt);
      if(fallback.totalLine!=null){
        obj.totalLine=fallback.totalLine;
        if(obj.overOdds==null)obj.overOdds=fallback.overOdds;
        if(obj.underOdds==null)obj.underOdds=fallback.underOdds;
        if(!obj.total)obj.total=fallback.total;
      }
    }
    map.set(obj.awayName+"@"+obj.homeName,obj);
  });
  for(const obj of map.values()){
    if(obj.overRate==null)obj.overRate=rateFromText(obj.over||obj.text||"");
  }
  return map;
}

async function playsport(){
  const predictUrl=`${PSP}${psDate()}&sid=0`;
  const liveUrl=`${PS}?gamedate=${psDate()}&mode=2`;
  const [predictHtml,liveHtml]=await Promise.all([
    fetchText(predictUrl).catch(()=>""),
    fetchText(liveUrl).catch(()=>"")
  ]);
  let map=predictHtml?parsePS(predictHtml):new Map();
  if(liveHtml){
    let detail=parsePS(liveHtml);
    for(const [k,v] of detail){
      let hit=map.get(k);
      if(hit){
        const keepIfMissing=[
          "totalLine","overOdds","underOdds","spreadAway","spreadAwayOdds",
          "spreadHome","spreadHomeOdds","moneyAway","moneyHome","overRate",
          "spreadRate","spread10","record","homeAway","h2h","last10",
          "vsR","vsL","avgRun","avgRun10","text","pitching","batting"
        ];
        for(const [field,value] of Object.entries(v)){
          const missing=value===null||value===undefined||value===""||value==="-";
          const existingMissing=hit[field]===null||hit[field]===undefined||hit[field]===""||hit[field]==="-";
          if(!missing || existingMissing){ hit[field]=value; }
        }
        if(hit.totalLine!=null){
          hit.total=`${hit.totalLine}（大 ${hit.overOdds??"-"} / 小 ${hit.underOdds??"-"}）`;
        }
      }else map.set(k,v);
    }
  }
  return map;
}

function findPS(ps,g){
  let a=code(g.teams?.away),h=code(g.teams?.home);
  let an=teamNames[a]||g.teams?.away?.team?.name||"",hn=teamNames[h]||g.teams?.home?.team?.name||"";
  for(let [k,v] of ps){
    if(v.awayCode===a&&v.homeCode===h)return v;
    if(v.awayName===an&&v.homeName===hn)return v;
    if(k.includes(`${a}@${h}`)||k.includes(`${h}@${a}`))return v;
  }
  return null;
}
function val(x){return x&&x!=="-"?esc(x):"<span class='muted'>尚無資料</span>"}
function psTable(p){

}
function rateFromText(s){
  let m=String(s||"").match(/(\d+(?:\.\d+)?)\s*%/);
  return m?+m[1]:null;
}
const MODEL_VERSION="V2.0";
const PRED_STORE_KEY="mlb_model_predictions_v2";
function seasonPhase(date){
  const m=Number(String(date||"").slice(5,7));
  if(!m)return {name:"未知",recentWeight:0.20};
  if(m<=4)return {name:"開季",recentWeight:0.12};
  if(m<=6)return {name:"前半季",recentWeight:0.16};
  if(m===7)return {name:"全明星前後",recentWeight:0.18};
  if(m===8)return {name:"後半季",recentWeight:0.22};
  if(m===9)return {name:"9月／季末",recentWeight:0.26};
  return {name:"季末",recentWeight:0.24};
}
function loadPredictionRecords(){
  try{return JSON.parse(localStorage.getItem(PRED_STORE_KEY)||"[]")}catch{return []}
}
function savePredictionRecord(rec){
  try{
    const all=loadPredictionRecords();
    const i=all.findIndex(x=>x.gamePk===rec.gamePk);
    if(i>=0){
      all[i]={...all[i],...rec, predA:all[i].predA, predH:all[i].predH, winnerSide:all[i].winnerSide, createdAt:all[i].createdAt};
    }else all.push(rec);
    localStorage.setItem(PRED_STORE_KEY,JSON.stringify(all.slice(-2000)));
  }catch{}
}
function settlePredictionRecord(g){
  if(!g?.gamePk)return;
  const a=Number(g.teams?.away?.score),h=Number(g.teams?.home?.score);
  if(!Number.isFinite(a)||!Number.isFinite(h))return;
  const actual=a>h?'away':h>a?'home':'tie';
  const all=loadPredictionRecords();
  const i=all.findIndex(x=>x.gamePk===g.gamePk);
  if(i<0)return;
  const rec=all[i];
  if(rec.settled)return;
  rec.actualWinner=actual;rec.actualAway=a;rec.actualHome=h;rec.settled=true;
  rec.winnerHit=rec.winnerSide===actual;
  if(rec.predA!=null&&rec.predH!=null){
    rec.awayError=Math.abs(Number(rec.predA)-a);
    rec.homeError=Math.abs(Number(rec.predH)-h);
    rec.totalError=Math.abs((Number(rec.predA)+Number(rec.predH))-(a+h));
    rec.scoreMAE=(rec.awayError+rec.homeError)/2;
  }
  localStorage.setItem(PRED_STORE_KEY,JSON.stringify(all));
}
function updateAccuracy(g,p){
  settlePredictionRecord(g);
}
function accuracySummary(){
  const date=selectedDate;
  const all=loadPredictionRecords().filter(x=>x.selectedDate===date && x.settled);
  const scored=all.filter(x=>Number.isFinite(x.awayError)&&Number.isFinite(x.homeError));
  const wins=all.filter(x=>x.winnerHit).length;
  const misses=all.length-wins;
  const teamPct=all.length?wins/all.length*100:null;
  const scoreMAE=scored.length?scored.reduce((s,x)=>s+((x.awayError+x.homeError)/2),0)/scored.length:null;
  const totalMAE=scored.length?scored.reduce((s,x)=>s+x.totalError,0)/scored.length:null;
  const scorePct=scoreMAE==null?null:Math.max(0,Math.min(100,100-scoreMAE*10));
  return {n:all.length,wins,misses,teamPct,scorePct,scoreMAE,totalMAE,scoredN:scored.length};
}
function accuracyHTML(){
  const a=accuracySummary();
  const f=v=>v==null?"-":`${v.toFixed(1)}%`;
  if(a.n===0)return "";
  return `<div class="accuracy-box"><div class="section-title">📊 當日模型預測準確度 <span class="phase-tag">${MODEL_VERSION}</span></div>
  <div class="accuracy-grid">

}

function renderResultBadges(g) {
  const all = loadPredictionRecords();
  const rec = all.find(x => x.gamePk === g.gamePk);
  if (!rec) return '';

  const a = Number(g.teams?.away?.score), h = Number(g.teams?.home?.score);
  const isFinal = g.status?.abstractGameState === "Final" && Number.isFinite(a) && Number.isFinite(h);
  
  if (!isFinal) {
    return `<div class="result-badges">
      <span class="result-badge pending">⏳ 模型賽前預測：${rec.winnerSide === 'away' ? '客勝' : '主勝'} (${rec.predA} - ${rec.predH})</span>
    </div>`;
  }

  const actualWinner = a > h ? 'away' : h > a ? 'home' : 'tie';
  const winnerHit = rec.winnerSide === actualWinner;
  const awayErr = Math.abs(rec.predA - a);
  const homeErr = Math.abs(rec.predH - h);
  const totalErr = Math.abs((rec.predA + rec.predH) - (a + h));

  return `<div class="result-badges">
    <span class="result-badge ${winnerHit ? 'hit' : 'miss'}">${winnerHit ? '🎯 勝負預測命中' : '❌ 勝負預測未命中'} (${rec.winnerSide === 'away' ? '預測客勝' : '預測主勝'})</span>
    <span class="result-badge ${awayErr <= 1.5 ? 'hit' : 'miss'}">客隊得分誤差 ${awayErr.toFixed(1)}分</span>
    <span class="result-badge ${homeErr <= 1.5 ? 'hit' : 'miss'}">主隊得分誤差 ${homeErr.toFixed(1)}分</span>
    <span class="result-badge ${totalErr <= 2.0 ? 'hit' : 'miss'}">總分誤差 ${totalErr.toFixed(1)}分</span>
  </div>
  <div class="result-note">賽前預估：${rec.predA} - ${rec.predH} ｜ 實際比分：${a} - ${h}</div>`;
}

      </div>

      <div class="section">
        <div class="section-title">🌤️ 球場天氣狀況</div>
        <div class="weather-value">
          ${weather.temp != null ? `${weather.temp}°F` : '<span class="muted">氣溫無資料</span>'}
          <span class="muted">｜ ${esc(weather.condition || "天氣狀況未知")} ｜ 風速：${esc(weather.windText || "無風速資料")}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">📊 PlaySport 國際盤口數據</div>
        ${psTable(psData)}
      </div>
    </div>`;
  }

  document.getElementById("games").innerHTML = html;
  document.getElementById("accuracy").innerHTML = accuracyHTML();
  document.getElementById("refreshInfo").textContent = `最後更新時間：${new Date().toLocaleTimeString()} ｜ 官方 API + 盤口連線正常`;
}

document.getElementById("prev").onclick = () => { selectedDate = addDays(selectedDate, -1); render(); };
document.getElementById("today").onclick = () => { selectedDate = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Taipei" }); render(); };
document.getElementById("next").onclick = () => { selectedDate = addDays(selectedDate, 1); render(); };

render();
</script>
</body>
</html>
