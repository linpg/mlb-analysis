<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB 分析中心</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #050505;
    color: white;
    padding: 18px 20px;
    font-size: 24px;
    font-weight: 900;
}

.container {
    width: min(1500px, 96%);
    margin: 20px auto 60px;
}

.date-bar {
    background: white;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 16px;
}

.date-bar button {
    border: 0;
    background: #111827;
    color: white;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
}

.date-bar button:hover {
    background: #374151;
}

#dateText {
    min-width: 150px;
    text-align: center;
    font-weight: 900;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.summary-box {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.summary-title {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 6px;
}

.summary-value {
    font-size: 26px;
    font-weight: 900;
}

.game-card {
    background: white;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    overflow: hidden;
}

.game-header {
    background: #111827;
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.game-time {
    font-size: 14px;
    font-weight: 800;
}

.game-status {
    font-size: 13px;
    font-weight: 900;
}

.game-main {
    padding: 20px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 100px 1fr;
    align-items: center;
    gap: 20px;
}

.team {
    display: flex;
    align-items: center;
    gap: 14px;
}

.team.away {
    justify-content: flex-end;
    text-align: right;
}

.team-logo {
    width: 58px;
    height: 58px;
    object-fit: contain;
}

.team-name {
    font-size: 21px;
    font-weight: 900;
}

.team-record {
    font-size: 12px;
    color: #6b7280;
    margin-top: 3px;
}

.score-area {
    text-align: center;
}

.score {
    font-size: 38px;
    line-height: 1;
    font-weight: 900;
}

.inning {
    font-size: 13px;
    margin-top: 6px;
    color: #6b7280;
    font-weight: 700;
}

.live-info {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: #dc2626;
    font-weight: 800;
}

.pitchers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
}

.pitcher-box {
    background: #f8fafc;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #e5e7eb;
}

.pitcher-title {
    color: #6b7280;
    font-size: 12px;
    margin-bottom: 5px;
}

.pitcher-name {
    font-weight: 900;
    font-size: 16px;
}

.pitcher-stats {
    margin-top: 8px;
    color: #374151;
    font-size: 12px;
    line-height: 1.6;
}

.section-title {
    font-size: 16px;
    font-weight: 900;
    margin: 22px 0 10px;
}

.sub-title {
    font-size: 14px;
    font-weight: 900;
    margin: 16px 0 8px;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.data-table th {
    background: #f3f4f6;
    font-weight: 900;
}

.data-table th,
.data-table td {
    padding: 10px 8px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.data-table th:first-child,
.data-table td:first-child {
    text-align: left;
    width: 180px;
}

.loading {
    color: #9ca3af;
}

.good {
    color: #15803d;
    font-weight: 900;
}

.bad {
    color: #dc2626;
    font-weight: 900;
}

.neutral {
    color: #374151;
    font-weight: 800;
}

.analysis-box {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
    line-height: 1.8;
    font-size: 14px;
}

.market-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.market-item {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
}

.market-label {
    color: #6b7280;
    font-size: 12px;
    margin-bottom: 5px;
}

.market-value {
    font-size: 17px;
    font-weight: 900;
}

.source-tag {
    display: inline-block;
    background: #eef2ff;
    color: #4338ca;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 800;
    margin-top: 12px;
}

.injury-box {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
}

.lineup-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.lineup-table th,
.lineup-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.lineup-table th {
    background: #f3f4f6;
}

.lineup-table td:first-child,
.lineup-table th:first-child {
    text-align: left;
}

.refresh-info {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    margin-top: 10px;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    margin-top: 30px;
}

@media (max-width: 900px) {

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .teams {
        grid-template-columns: 1fr 80px 1fr;
        gap: 8px;
    }

    .team-name {
        font-size: 17px;
    }

    .team-logo {
        width: 46px;
        height: 46px;
    }

    .score {
        font-size: 30px;
    }
}

@media (max-width: 600px) {

    header {
        font-size: 20px;
    }

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .teams {
        grid-template-columns: 1fr;
        text-align: center;
    }

    .team,
    .team.away {
        justify-content: center;
        text-align: center;
    }

    .score-area {
        order: 3;
    }

    .pitchers {
        grid-template-columns: 1fr;
    }

    .data-table,
    .lineup-table {
        font-size: 11px;
    }

    .data-table th,
    .data-table td {
        padding: 8px 4px;
    }
}
</style>
</head>

<body>

<header>
    ⚾ MLB 分析中心
</header>

<div class="container">

    <div class="date-bar">
        <button id="prevDay">← 前一天</button>
        <div id="dateText">2026/09/13</div>
        <button id="todayBtn">今天</button>
        <button id="nextDay">後一天 →</button>
    </div>

    <div class="summary">

        <div class="summary-box">
            <div class="summary-title">今日比賽</div>
            <div class="summary-value" id="totalGames">-</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">尚未開打</div>
            <div class="summary-value" id="upcomingGames">-</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">進行中</div>
            <div class="summary-value" id="liveGames">-</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">已結束</div>
            <div class="summary-value" id="finalGames">-</div>
        </div>

    </div>

    <div id="gamesContainer">
        <div class="game-card">
            <div class="game-main">
                載入 MLB 賽程中...
            </div>
        </div>
    </div>

    <div class="refresh-info" id="refreshInfo">
        即時比分每 15 秒更新
    </div>

    <div class="footer">
        MLB 分析中心｜資料來源：MLB 官方 Stats API
    </div>

</div>

<script>

/* =========================================================
   基本設定
========================================================= */

let selectedDate = "2026-09-13";

/*
 * 保留目前已經正常的日期邏輯
 */
function getMLBQueryDate() {
    return addDays(selectedDate, -1);
}

let pageVersion = 0;

let liveRefreshTimer = null;

let lastRefreshTime = null;


/* =========================================================
   Cache
========================================================= */

const teamAnalysisCache = new Map();

const teamScheduleCache = new Map();

const teamStatsCache = new Map();

const rosterCache = new Map();

const pitcherStatsCache = new Map();

let standingsCache = null;

let standingsCachePromise = null;


/* =========================================================
   日期
========================================================= */

function addDays(dateString, days) {

    const date =
        new Date(dateString + "T00:00:00");

    date.setDate(
        date.getDate() + days
    );

    return date.toISOString().slice(0, 10);
}

function formatDate(date) {

    const [y, m, d] =
        date.split("-");

    return `${y}/${m}/${d}`;
}

function dateToPlaySport(date) {

    return date.replaceAll("-", "");
}

function getPlaySportURL() {

    return `https://www.playsport.cc/livescore/1?gamedate=${dateToPlaySport(selectedDate)}&mode=2`;
}

function updateDateUI() {

    document.getElementById(
        "dateText"
    ).textContent =
        formatDate(selectedDate);
}


/* =========================================================
   HTTP
========================================================= */

async function getJSON(url) {

    const response =
        await fetch(url, {
            cache: "no-store"
        });

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    return await response.json();
}


/* =========================================================
   MLB 賽程
========================================================= */

async function getMLBSchedule() {

    const mlbQueryDate =
        getMLBQueryDate();

    const url =
        `https://statsapi.mlb.com/api/v1/schedule` +
        `?sportId=1` +
        `&date=${mlbQueryDate}` +
        `&hydrate=team,probablePitcher`;

    const data =
        await getJSON(url);

    if (
        !data.dates ||
        !data.dates.length
    ) {
        return [];
    }

    return data.dates[0].games || [];
}


/* =========================================================
   Standings
========================================================= */

async function getStandings() {

    if (standingsCache) {
        return standingsCache;
    }

    if (standingsCachePromise) {
        return standingsCachePromise;
    }

    const url =
        `https://statsapi.mlb.com/api/v1/standings` +
        `?leagueId=103,104` +
        `&season=2026` +
        `&standingsTypes=regularSeason` +
        `&hydrate=team`;

    standingsCachePromise =
        getJSON(url)
        .then(data => {

            const result = {};

            if (data.records) {

                data.records.forEach(
                    record => {

                        if (
                            !record.teamRecords
                        ) {
                            return;
                        }

                        record.teamRecords.forEach(
                            team => {

                                result[
                                    team.team.id
                                ] = team;

                            }
                        );

                    }
                );

            }

            standingsCache =
                result;

            return result;

        })
        .catch(error => {

            console.error(
                "Standings error:",
                error
            );

            return {};

        })
        .finally(() => {

            standingsCachePromise =
                null;

        });

    return standingsCachePromise;
}


/* =========================================================
   球隊 Season Stats
========================================================= */

async function getTeamStats(teamId) {

    if (
        teamStatsCache.has(teamId)
    ) {
        return teamStatsCache.get(
            teamId
        );
    }

    const promise =
        (async () => {

            let hitting = null;
            let pitching = null;

            try {

                const url =
                    `https://statsapi.mlb.com/api/v1/teams/${teamId}/stats` +
                    `?stats=season` +
                    `&group=hitting` +
                    `&season=2026`;

                const data =
                    await getJSON(url);

                if (
                    data.stats &&
                    data.stats.length &&
                    data.stats[0].splits &&
                    data.stats[0].splits.length
                ) {

                    hitting =
                        data.stats[0]
                            .splits[0]
                            .stat;

                }

            } catch (error) {

                console.error(
                    "Hitting stats error:",
                    teamId,
                    error
                );

            }


            try {

                const url =
                    `https://statsapi.mlb.com/api/v1/teams/${teamId}/stats` +
                    `?stats=season` +
                    `&group=pitching` +
                    `&season=2026`;

                const data =
                    await getJSON(url);

                if (
                    data.stats &&
                    data.stats.length &&
                    data.stats[0].splits &&
                    data.stats[0].splits.length
                ) {

                    pitching =
                        data.stats[0]
                            .splits[0]
                            .stat;

                }

            } catch (error) {

                console.error(
                    "Pitching stats error:",
                    teamId,
                    error
                );

            }


            return {
                hitting,
                pitching
            };

        })();

    teamStatsCache.set(
        teamId,
        promise
    );

    return promise;
}


/* =========================================================
   球隊賽程
========================================================= */

async function getTeamSchedule(teamId) {

    if (
        teamScheduleCache.has(teamId)
    ) {
        return teamScheduleCache.get(
            teamId
        );
    }

    const mlbQueryDate =
        getMLBQueryDate();

    const promise =
        (async () => {

            try {

                const url =
                    `https://statsapi.mlb.com/api/v1/schedule` +
                    `?teamId=${teamId}` +
                    `&sportId=1` +
                    `&startDate=2026-03-25` +
                    `&endDate=${mlbQueryDate}` +
                    `&gameTypes=R` +
                    `&hydrate=team`;

                const data =
                    await getJSON(url);

                const games = [];

                if (data.dates) {

                    data.dates.forEach(
                        date => {

                            if (
                                date.games
                            ) {

                                games.push(
                                    ...date.games
                                );

                            }

                        }
                    );

                }

                return games;

            } catch (error) {

                console.error(
                    "Team schedule error:",
                    teamId,
                    error
                );

                return [];

            }

        })();

    teamScheduleCache.set(
        teamId,
        promise
    );

    return promise;
}


/* =========================================================
   球員名單
========================================================= */

async function getRoster(teamId) {

    if (
        rosterCache.has(teamId)
    ) {
        return rosterCache.get(teamId);
    }

    const promise =
        (async () => {

            try {

                const url =
                    `https://statsapi.mlb.com/api/v1/teams/${teamId}/roster` +
                    `?rosterType=active` +
                    `&season=2026`;

                const data =
                    await getJSON(url);

                return data.roster || [];

            } catch (error) {

                console.error(
                    "Roster error:",
                    teamId,
                    error
                );

                return [];

            }

        })();

    rosterCache.set(
        teamId,
        promise
    );

    return promise;
}


/* =========================================================
   球員 Stats
========================================================= */

async function getPlayerStats(
    playerId,
    group
) {

    const key =
        `${playerId}_${group}`;

    if (
        pitcherStatsCache.has(key)
    ) {
        return pitcherStatsCache.get(
            key
        );
    }

    const promise =
        (async () => {

            try {

                const url =
                    `https://statsapi.mlb.com/api/v1/people/${playerId}/stats` +
                    `?stats=season` +
                    `&group=${group}` +
                    `&season=2026`;

                const data =
                    await getJSON(url);

                if (
                    data.stats &&
                    data.stats.length &&
                    data.stats[0].splits &&
                    data.stats[0].splits.length
                ) {

                    return data.stats[0]
                        .splits[0]
                        .stat;

                }

                return null;

            } catch (error) {

                console.error(
                    "Player stats error:",
                    playerId,
                    group,
                    error
                );

                return null;

            }

        })();

    pitcherStatsCache.set(
        key,
        promise
    );

    return promise;
}


/* =========================================================
   Final
========================================================= */

function isFinalGame(game) {

    return (
        game &&
        game.status &&
        game.status.abstractGameState ===
        "Final"
    );
}


/* =========================================================
   球隊比賽結果
========================================================= */

function getTeamGameResult(
    game,
    teamId
) {

    if (
        !game ||
        !game.teams
    ) {
        return null;
    }

    const home =
        game.teams.home;

    const away =
        game.teams.away;

    let teamSide = null;
    let opponentSide = null;

    if (
        home.team.id === teamId
    ) {

        teamSide = home;
        opponentSide = away;

    } else if (
        away.team.id === teamId
    ) {

        teamSide = away;
        opponentSide = home;

    } else {

        return null;

    }

    if (
        teamSide.score === undefined ||
        opponentSide.score === undefined
    ) {
        return null;
    }

    const win =
        teamSide.isWinner === true;

    return {

        win,

        loss: !win,

        runsFor:
            Number(teamSide.score || 0),

        runsAgainst:
            Number(
                opponentSide.score || 0
            ),

        home:
            teamSide === home,

        opponentId:
            opponentSide.team.id

    };
}


/* =========================================================
   球隊戰績
========================================================= */

function calculateTeamRecords(
    games,
    teamId
) {

    const completed = [];

    games.forEach(game => {

        if (!isFinalGame(game)) {
            return;
        }

        const result =
            getTeamGameResult(
                game,
                teamId
            );

        if (result) {

            completed.push({
                game,
                ...result
            });

        }

    });

    completed.sort(
        (a, b) =>
            new Date(a.game.gameDate) -
            new Date(b.game.gameDate)
    );

    const wins =
        completed.filter(
            x => x.win
        ).length;

    const losses =
        completed.filter(
            x => x.loss
        ).length;

    const homeGames =
        completed.filter(
            x => x.home
        );

    const awayGames =
        completed.filter(
            x => !x.home
        );

    const homeWins =
        homeGames.filter(
            x => x.win
        ).length;

    const homeLosses =
        homeGames.filter(
            x => x.loss
        ).length;

    const awayWins =
        awayGames.filter(
            x => x.win
        ).length;

    const awayLosses =
        awayGames.filter(
            x => x.loss
        ).length;

    const last10 =
        completed.slice(-10);

    const last10Wins =
        last10.filter(
            x => x.win
        ).length;

    const last10Losses =
        last10.filter(
            x => x.loss
        ).length;

    const runsFor =
        completed.reduce(
            (sum, x) =>
                sum + x.runsFor,
            0
        );

    const runsAgainst =
        completed.reduce(
            (sum, x) =>
                sum + x.runsAgainst,
            0
        );

    const last10RunsFor =
        last10.reduce(
            (sum, x) =>
                sum + x.runsFor,
            0
        );

    const last10RunsAgainst =
        last10.reduce(
            (sum, x) =>
                sum + x.runsAgainst,
            0
        );

    let streak = 0;

    let streakType = "";

    if (completed.length) {

        const last =
            completed[
                completed.length - 1
            ];

        streakType =
            last.win ? "W" : "L";

        for (
            let i =
                completed.length - 1;
            i >= 0;
            i--
        ) {

            if (
                completed[i].win &&
                streakType === "W"
            ) {

                streak++;

            } else if (
                completed[i].loss &&
                streakType === "L"
            ) {

                streak++;

            } else {

                break;

            }

        }

    }

    return {

        completed,

        wins,

        losses,

        homeWins,

        homeLosses,

        awayWins,

        awayLosses,

        last10Wins,

        last10Losses,

        runsFor,

        runsAgainst,

        avgRunsFor:
            completed.length
                ? runsFor /
                  completed.length
                : null,

        avgRunsAgainst:
            completed.length
                ? runsAgainst /
                  completed.length
                : null,

        last10AvgRunsFor:
            last10.length
                ? last10RunsFor /
                  last10.length
                : null,

        last10AvgRunsAgainst:
            last10.length
                ? last10RunsAgainst /
                  last10.length
                : null,

        streak,

        streakType

    };
}


/* =========================================================
   H2H
========================================================= */

function calculateH2H(
    schedule,
    teamId,
    opponentId
) {

    const games = [];

    schedule.forEach(game => {

        if (!isFinalGame(game)) {
            return;
        }

        const result =
            getTeamGameResult(
                game,
                teamId
            );

        if (
            result &&
            result.opponentId ===
            opponentId
        ) {

            games.push({
                game,
                ...result
            });

        }

    });

    games.sort(
        (a, b) =>
            new Date(a.game.gameDate) -
            new Date(b.game.gameDate)
    );

    const wins =
        games.filter(
            x => x.win
        ).length;

    const losses =
        games.filter(
            x => x.loss
        ).length;

    const runsFor =
        games.reduce(
            (sum, x) =>
                sum + x.runsFor,
            0
        );

    const runsAgainst =
        games.reduce(
            (sum, x) =>
                sum + x.runsAgainst,
            0
        );

    return {

        games,

        wins,

        losses,

        runsFor,

        runsAgainst

    };
}


/* =========================================================
   投手格式
========================================================= */

function formatPitcherStats(
    stats
) {

    if (!stats) {
        return "資料不足";
    }

    const parts = [];

    if (
        stats.era !== undefined
    ) {
        parts.push(
            `ERA ${Number(
                stats.era
            ).toFixed(2)}`
        );
    }

    if (
        stats.whip !== undefined
    ) {
        parts.push(
            `WHIP ${Number(
                stats.whip
            ).toFixed(2)}`
        );
    }

    if (
        stats.wins !== undefined ||
        stats.losses !== undefined
    ) {

        parts.push(
            `W-L ${stats.wins ?? 0}-${stats.losses ?? 0}`
        );

    }

    if (
        stats.inningsPitched !== undefined
    ) {

        parts.push(
            `IP ${stats.inningsPitched}`
        );

    }

    if (
        stats.strikeOuts !== undefined
    ) {

        parts.push(
            `SO ${stats.strikeOuts}`
        );

    }

    if (
        stats.baseOnBalls !== undefined
    ) {

        parts.push(
            `BB ${stats.baseOnBalls}`
        );

    }

    return parts.length
        ? parts.join("｜")
        : "資料不足";
}


/* =========================================================
   取得完整球隊分析
========================================================= */

async function getTeamAnalysis(
    teamId,
    opponentId
) {

    const key =
        `${teamId}_${opponentId}_${getMLBQueryDate()}`;

    if (
        teamAnalysisCache.has(key)
    ) {
        return teamAnalysisCache.get(key);
    }

    const promise =
        (async () => {

            const [
                standings,
                stats,
                schedule,
                roster
            ] = await Promise.all([
                getStandings(),
                getTeamStats(teamId),
                getTeamSchedule(teamId),
                getRoster(teamId)
            ]);

            const record =
                calculateTeamRecords(
                    schedule,
                    teamId
                );

            const h2h =
                calculateH2H(
                    schedule,
                    teamId,
                    opponentId
                );

            const teamStanding =
                standings[teamId] ||
                null;

            return {

                teamId,

                standings:
                    teamStanding,

                stats,

                schedule,

                roster,

                record,

                h2h

            };

        })();

    teamAnalysisCache.set(
        key,
        promise
    );

    return promise;
}


/* =========================================================
   格式化
========================================================= */

function formatNumber(
    value,
    digits = 2
) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(
            Number(value)
        )
    ) {
        return "—";
    }

    return Number(value)
        .toFixed(digits);
}

function formatAvg(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    return Number(value)
        .toFixed(3);
}

function recordText(
    wins,
    losses
) {

    if (
        wins === undefined ||
        losses === undefined
    ) {
        return "—";
    }

    return `${wins}-${losses}`;
}

function formatStreak(
    record
) {

    if (
        !record ||
        !record.streak
    ) {
        return "—";
    }

    return record.streakType === "W"
        ? `${record.streak}連勝`
        : `${record.streak}連敗`;
}


/* =========================================================
   球隊名稱
========================================================= */

function getTeamName(team) {

    if (!team) {
        return "—";
    }

    return (
        team.name ||
        team.teamName ||
        "—"
    );
}


/* =========================================================
   Logo
========================================================= */

function getTeamLogo(team) {

    if (
        !team ||
        !team.id
    ) {
        return "";
    }

    return `https://www.mlbstatic.com/team-logos/${team.id}.svg`;
}


/* =========================================================
   投手名稱
========================================================= */

function getPitcherName(
    pitcher
) {

    if (!pitcher) {
        return "未公布";
    }

    if (pitcher.fullName) {
        return pitcher.fullName;
    }

    if (
        pitcher.person &&
        pitcher.person.fullName
    ) {
        return pitcher.person.fullName;
    }

    return "未公布";
}


/* =========================================================
   台灣時間
========================================================= */

function getTaiwanTime(
    gameDate
) {

    return new Date(
        gameDate
    ).toLocaleTimeString(
        "zh-TW",
        {
            timeZone: "Asia/Taipei",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );
}


/* =========================================================
   狀態
========================================================= */

function getStatusInfo(game) {

    const status =
        game.status;

    if (
        status.abstractGameState ===
        "Final"
    ) {

        return {
            text: "已結束",
            type: "final"
        };

    }

    if (
        status.abstractGameState ===
        "Live"
    ) {

        return {
            text: "LIVE",
            type: "live"
        };

    }

    return {
        text: "尚未開打",
        type: "upcoming"
    };
}


/* =========================================================
   局數
========================================================= */

function getInningText(
    linescore,
    status
) {

    if (
        !linescore ||
        !linescore.currentInning
    ) {

        return status?.detailedState || "";

    }

    const inning =
        linescore.currentInning;

    const half =
        linescore.isTopInning
            ? "上"
            : "下";

    return `${half}${inning}局`;
}


/* =========================================================
   Count
========================================================= */

function getCount(feed) {

    const linescore =
        feed?.liveData?.linescore;

    if (!linescore) {
        return "";
    }

    const balls =
        linescore.balls;

    const strikes =
        linescore.strikes;

    const outs =
        linescore.outs;

    if (
        balls === undefined &&
        strikes === undefined &&
        outs === undefined
    ) {
        return "";
    }

    return `B ${balls ?? 0} / S ${strikes ?? 0} / O ${outs ?? 0}`;
}


/* =========================================================
   自動分析
========================================================= */

function createAnalysisText(
    away,
    home
) {

    const a =
        away.record;

    const h =
        home.record;

    let text = "";

    const awayPct =
        (a.wins + a.losses)
            ? a.wins /
              (a.wins + a.losses)
            : null;

    const homePct =
        (h.wins + h.losses)
            ? h.wins /
              (h.wins + h.losses)
            : null;

    const awayRecent =
        (a.last10Wins +
         a.last10Losses)
            ? a.last10Wins /
              (a.last10Wins +
               a.last10Losses)
            : null;

    const homeRecent =
        (h.last10Wins +
         h.last10Losses)
            ? h.last10Wins /
              (h.last10Wins +
               h.last10Losses)
            : null;


    if (
        awayPct !== null &&
        homePct !== null
    ) {

        if (awayPct > homePct) {

            text +=
                `${away.teamName} 本季整體戰績較佳。`;

        } else if (
            homePct > awayPct
        ) {

            text +=
                `${home.teamName} 本季整體戰績較佳。`;

        } else {

            text +=
                "兩隊本季整體戰績接近。";

        }

    }


    if (
        awayRecent !== null &&
        homeRecent !== null
    ) {

        if (
            awayRecent >
            homeRecent
        ) {

            text +=
                ` 近10場 ${away.teamName} 狀態較好。`;

        } else if (
            homeRecent >
            awayRecent
        ) {

            text +=
                ` 近10場 ${home.teamName} 狀態較好。`;

        } else {

            text +=
                " 兩隊近10場狀態接近。";

        }

    }


    if (
        a.avgRunsFor !== null &&
        h.avgRunsFor !== null
    ) {

        if (
            a.avgRunsFor >
            h.avgRunsFor
        ) {

            text +=
                ` 平均得分 ${away.teamName} 較高。`;

        } else if (
            h.avgRunsFor >
            a.avgRunsFor
        ) {

            text +=
                ` 平均得分 ${home.teamName} 較高。`;

        }

    }


    const awayPitching =
        away.stats.pitching;

    const homePitching =
        home.stats.pitching;


    if (
        awayPitching &&
        homePitching &&
        awayPitching.era !== undefined &&
        homePitching.era !== undefined
    ) {

        if (
            Number(awayPitching.era) <
            Number(homePitching.era)
        ) {

            text +=
                ` 球隊投手 ERA ${away.teamName} 較低。`;

        } else if (
            Number(homePitching.era) <
            Number(awayPitching.era)
        ) {

            text +=
                ` 球隊投手 ERA ${home.teamName} 較低。`;

        }

    }


    if (!text) {

        text =
            "目前資料不足，暫不進行正式預測。";

    }

    return text;
}

/* =========================================================
   球隊分析渲染
========================================================= */

function renderTeamAnalysis(
    card,
    away,
    home
) {

    const a =
        away.record;

    const h =
        home.record;


    card.querySelector(
        "[data-away-record]"
    ).textContent =
        recordText(
            a.wins,
            a.losses
        );

    card.querySelector(
        "[data-home-record]"
    ).textContent =
        recordText(
            h.wins,
            h.losses
        );


    card.querySelector(
        '[data-row="season-away"]'
    ).textContent =
        recordText(
            a.wins,
            a.losses
        );

    card.querySelector(
        '[data-row="season-home"]'
    ).textContent =
        recordText(
            h.wins,
            h.losses
        );


    card.querySelector(
        '[data-row="homeaway-away"]'
    ).textContent =
        recordText(
            a.awayWins,
            a.awayLosses
        );

    card.querySelector(
        '[data-row="homeaway-home"]'
    ).textContent =
        recordText(
            h.homeWins,
            h.homeLosses
        );


    card.querySelector(
        '[data-row="last10-away"]'
    ).textContent =
        recordText(
            a.last10Wins,
            a.last10Losses
        );

    card.querySelector(
        '[data-row="last10-home"]'
    ).textContent =
        recordText(
            h.last10Wins,
            h.last10Losses
        );


    card.querySelector(
        '[data-row="h2h-away"]'
    ).textContent =
        recordText(
            away.h2h.wins,
            away.h2h.losses
        );

    card.querySelector(
        '[data-row="h2h-home"]'
    ).textContent =
        recordText(
            home.h2h.wins,
            home.h2h.losses
        );


    const ah =
        away.stats.hitting;

    const hh =
        home.stats.hitting;


    if (ah) {

        card.querySelector(
            '[data-row="avg-away"]'
        ).textContent =
            formatAvg(ah.avg);

        card.querySelector(
            '[data-row="obp-away"]'
        ).textContent =

        ).textContent =

        card.querySelector(

            '[data-row="obp-home"]'

        card.querySelector(
            '[data-row="slg-home"]'
        ).textContent =
            formatAvg(hh.slg);

        card.querySelector(
            '[data-row="ops-home"]'
        ).textContent =

        '[data-row="recent-runs-away"]'

        `${formatNumber(

    card.querySelector(
        '[data-row="recent-runs-home"]'
    ).textContent =
        `${formatNumber(
            h.last10AvgRunsFor
        )} / ${formatNumber(
            h.last10AvgRunsAgainst
        )}`;


    card.querySelector(
        '[data-row="streak-away"]'
    ).textContent =

    card.querySelector(
        '[data-row="streak-home"]'
    ).textContent =

    if (away.standings) {

        card.querySelector(
            '[data-row="division-away"]'

    }


    if (home.standings) {

        card.querySelector(
            '[data-row="division-home"]'
        ).textContent =
            home.standings.divisionRank
                ? `第${home.standings.divisionRank}名`
                : "—";

    }


    const ap =

    const hp =
        home.stats.pitching;


    if (ap) {

        card.querySelector(
            '[data-row="era-away"]'
        ).textContent =
            formatNumber(
                ap.era
            );

        card.querySelector(
            '[data-row="whip-away"]'
        ).textContent =
            formatNumber(
                ap.whip
            );

        card.querySelector(
            '[data-row="so-away"]'
        ).textContent =
            ap.strikeOuts ??
            "—";

        card.querySelector(
            '[data-row="bb-away"]'
        ).textContent =
            ap.baseOnBalls ??
            "—";

        card.querySelector(
            '[data-row="hr-allowed-away"]'

    }


    if (hp) {

        card.querySelector(
            '[data-row="era-home"]'
        ).textContent =
            formatNumber(
                hp.era
            );

        card.querySelector(
            '[data-row="whip-home"]'
        ).textContent =
            formatNumber(
                hp.whip
            );

        card.querySelector(
            '[data-row="so-home"]'
        ).textContent =

            "—";

        card.querySelector(
            '[data-row="bb-home"]'
        ).textContent =
            hp.baseOnBalls ??
            "—";

        card.querySelector(
            '[data-row="hr-allowed-home"]'
        ).textContent =

    }


    /*
     * 牛棚
     *

     * 下一階段會把 SP 排除後計算真正 Bullpen。
     */

    if (ap) {

        card.querySelector(
            '[data-row="bullpen-era-away"]'

        card.querySelector(
            '[data-row="bullpen-whip-away"]'

    if (hp) {

            '[data-row="bullpen-whip-home"]'

    card.querySelector(
        '[data-analysis]'

}


/* =========================================================
   先發投手
========================================================= */

async function renderPitcherStats(
    card,
    awayPitcher,
    homePitcher
) {

    const awayElement =
        card.querySelector(
            "[data-away-pitcher-stats]"
        );

    const homeElement =
        card.querySelector(
            "[data-home-pitcher-stats]"
        );


    if (
        awayPitcher &&
        awayPitcher.id
    ) {

        const stats =
            await getPlayerStats(
                awayPitcher.id,
                "pitching"
            );

        awayElement.textContent =
            formatPitcherStats(stats);

    } else {

        awayElement.textContent =
            "尚未公布先發";

    }


    if (
        homePitcher &&
        homePitcher.id
    ) {

        const stats =
            await getPlayerStats(
                homePitcher.id,
                "pitching"
            );

        homeElement.textContent =
            formatPitcherStats(stats);

    } else {

        homeElement.textContent =
            "尚未公布先發";

    }

}


/* =========================================================
   打線
========================================================= */

async function renderLineup(
    card,
    analysis,
    side
) {

    const table =
        card.querySelector(
            `[data-lineup-${side}]`
        );

    if (!table) {
        return;
    }

    const tbody =
        table.querySelector(
            "tbody"
        );

    const roster =
        analysis.roster || [];


    /*
     * MLB roster 中的 positionPlayers
     * 優先抓一般野手與捕手
     */

    const hitters =
        roster.filter(player => {

            const pos =
                player.position?.abbreviation ||
                "";

            return (
                pos !== "P" &&
                pos !== "TWP"
            );

        });


    if (!hitters.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    目前沒有取得打線資料
                </td>
            </tr>
        `;

        return;
    }


    /*
     * 先抓前 9 名可用野手
     */

    const selected =
        hitters.slice(0, 9);


    const rows =
        await Promise.all(
            selected.map(
                async player => {

                    const playerId =
                        player.person?.id;

                    let stats = null;

                    if (playerId) {

                        stats =
                            await getPlayerStats(
                                playerId,
                                "hitting"
                            );

                    }

                    return {
                        player,
                        stats
                    };

                }
            )
        );


    tbody.innerHTML =
        rows.map(item => {

            const player =
                item.player;

            const stats =
                item.stats;

            const name =
                player.person?.fullName ||
                "—";

            const position =
                player.position
                    ?.abbreviation ||
                "—";

            return `

                <tr>

                    <td>
                        ${name}
                    </td>

                    <td>
                        ${position}
                    </td>

                    <td>
                        ${stats
                            ? formatAvg(stats.avg)
                            : "—"}
                    </td>

                    <td>
                        ${stats
                            ? formatAvg(stats.ops)
                            : "—"}
                    </td>

                    <td>
                        ${stats?.homeRuns ??
                         "—"}
                    </td>

                    <td>
                        ${stats?.rbi ??
                         "—"}
                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================================
   Summary
========================================================= */

function updateSummary(
    games
) {

    let upcoming = 0;

    let live = 0;

    let final = 0;


    games.forEach(game => {

        const state =
            game.status.abstractGameState;

        if (
            state === "Preview"
        ) {

            upcoming++;

        } else if (
            state === "Live"
        ) {

            live++;

        } else if (
            state === "Final"
        ) {

            final++;

        }

    });


    document.getElementById(
        "totalGames"
    ).textContent =
        games.length;

    document.getElementById(
        "upcomingGames"
    ).textContent =
        upcoming;

    document.getElementById(
        "liveGames"
    ).textContent =
        live;

    document.getElementById(
        "finalGames"
    ).textContent =
        final;

}


/* =========================================================
   載入賽程
========================================================= */

async function loadMLBGames() {

    const currentVersion =
        ++pageVersion;


    if (liveRefreshTimer) {

        clearInterval(
            liveRefreshTimer
        );

        liveRefreshTimer = null;

    }


    const container =
        document.getElementById(
            "gamesContainer"
        );


    container.innerHTML = `

        <div class="game-card">

            <div class="game-main">
                正在載入 ${formatDate(selectedDate)} MLB 賽程...
            </div>

        </div>

    `;


    updateDateUI();


    try {

        const games =
            await getMLBSchedule();


        if (
            currentVersion !==
            pageVersion
        ) {
            return;
        }


        updateSummary(games);


        container.innerHTML = "";


        if (!games.length) {

            container.innerHTML = `

                <div class="game-card">

                    <div class="game-main">
                        今天沒有找到 MLB 比賽。
                    </div>

                </div>

            `;

            return;

        }


        games.sort(
            (a, b) =>
                new Date(a.gameDate) -
                new Date(b.gameDate)
        );


        /*
         * 先建立所有卡片
         * 避免前一場資料慢導致後面比賽完全不出現
         */

        const cardPromises =
            games.map(game =>
                createGameCard(
                    game,
                    currentVersion
                )
            );


        await Promise.all(
            cardPromises
        );


        if (
            currentVersion !==
            pageVersion
        ) {
            return;
        }


        startLiveRefresh(
            currentVersion
        );


    } catch (error) {

        console.error(
            "Schedule error:",
            error
        );


        container.innerHTML = `

            <div class="game-card">

                <div class="game-main">

                    <strong>
                        MLB 賽程載入失敗
                    </strong>

                    <br><br>

                    請重新整理頁面。

                </div>

            </div>

        `;

    }

}


/* =========================================================
   Live Refresh
========================================================= */

async function refreshLiveScores() {

    try {

        const games =
            await getMLBSchedule();


        updateSummary(games);


        for (const game of games) {

            if (
                game.status.abstractGameState !==
                "Live" &&
                game.status.abstractGameState !==
                "Final"
            ) {
                continue;
            }


            const card =
                document.querySelector(
                    `.game-card[data-game-pk="${game.gamePk}"]`
                );


            if (!card) {
                continue;
            }


            try {

                const feed =
                    await getJSON(
                        `https://statsapi.mlb.com/api/v1/game/${game.gamePk}/feed/live`
                    );


                updateGameCardLive(
                    card,
                    game,
                    feed
                );

            } catch (error) {

                console.error(
                    "Live feed refresh error:",
                    error
                );

            }

        }


        lastRefreshTime =
            new Date();

        updateRefreshTime();


    } catch (error) {

        console.error(
            "Refresh error:",
            error
        );

    }

}


/* =========================================================
   更新 Live 卡片
========================================================= */

function updateGameCardLive(
    card,
    game,
    feed
) {

    if (!card) {
        return;
    }


    const awayScore =
        feed?.liveData?.linescore
            ?.teams?.away?.runs;


    const homeScore =
        feed?.liveData?.linescore
            ?.teams?.home?.runs;


    const awayScoreElement =
        card.querySelector(
            "[data-away-score]"
        );

    const homeScoreElement =
        card.querySelector(
            "[data-home-score]"
        );


    if (awayScoreElement) {

        awayScoreElement.textContent =
            awayScore ??
            game.teams.away.score ??
            "-";

    }


    if (homeScoreElement) {

        homeScoreElement.textContent =
            homeScore ??
            game.teams.home.score ??
            "-";

    }


    const statusElement =
        card.querySelector(
            "[data-status]"
        );


    if (statusElement) {

        statusElement.textContent =
            getStatusInfo(game).text;

    }


    const inningElement =
        card.querySelector(
            "[data-inning]"
        );


    if (inningElement) {

        inningElement.textContent =
            getInningText(
                feed?.liveData?.linescore,
                game.status
            );

    }


    const liveInfo =
        card.querySelector(
            "[data-live-info]"
        );


    if (liveInfo) {

        liveInfo.textContent =
            getCount(feed);

    }

}


/* =========================================================
   Timer
========================================================= */

function startLiveRefresh(
    currentVersion
) {

    if (liveRefreshTimer) {

        clearInterval(
            liveRefreshTimer
        );

    }


    liveRefreshTimer =
        setInterval(
            async () => {

                if (
                    currentVersion !==
                    pageVersion
                ) {

                    clearInterval(
                        liveRefreshTimer
                    );

                    return;

                }

                await refreshLiveScores();

            },
            15000
        );

}


function updateRefreshTime() {

    const element =
        document.getElementById(
            "refreshInfo"
        );

    if (!lastRefreshTime) {

        element.textContent =
            "即時比分每 15 秒更新";

        return;

    }


    element.textContent =
        `即時比分每 15 秒更新｜最後更新 ${lastRefreshTime.toLocaleTimeString(
            "zh-TW",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        )}`;

}


/* =========================================================
   日期按鈕
========================================================= */

document
    .getElementById("prevDay")
    .addEventListener(
        "click",
        () => {

            selectedDate =
                addDays(
                    selectedDate,
                    -1
                );

            teamAnalysisCache.clear();

            loadMLBGames();

        }
    );


document
    .getElementById("nextDay")
    .addEventListener(
        "click",
        () => {

            selectedDate =
                addDays(
                    selectedDate,
                    1
                );

            teamAnalysisCache.clear();

            loadMLBGames();

        }
    );


document
    .getElementById("todayBtn")
    .addEventListener(
        "click",
        () => {

            const now =
                new Date();

            const formatter =
                new Intl.DateTimeFormat(
                    "en-CA",
                    {
                        timeZone:
                            "Asia/Taipei",
                        year: "numeric",
                        month: "2-digit",
                        day: "2-digit"
                    }
                );

            selectedDate =
                formatter.format(now);

            teamAnalysisCache.clear();

            loadMLBGames();

        }
    );


/* =========================================================
   啟動
========================================================= */

updateDateUI();

loadMLBGames();

</script>
