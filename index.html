<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MLB 比賽分析系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 16px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
      padding: 20px;
    }

    /* =========================
       日期控制
    ========================= */

    .date-panel {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .date-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-btn {
      border: none;
      background: #e5e7eb;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .date-btn:hover {
      background: #d1d5db;
    }

    .today-btn {
      background: #111827;
      color: white;
    }

    .date-input {
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .selected-date {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 14px;
    }

    /* =========================
       上方資訊
    ========================= */

    .top-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: white;
      border-radius: 10px;
      padding: 13px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .info-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 17px;
      font-weight: bold;
    }

    /* =========================
       狀態統計
    ========================= */

    .status-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .status-chip {
      background: white;
      padding: 9px 13px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.05);
    }

    /* =========================
       比賽
    ========================= */

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .game-time {
      font-weight: bold;
      font-size: 18px;
    }

    .status {
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e5e7eb;
    }

    .status-preview {
      background: #dcfce7;
      color: #166534;
    }

    .status-live {
      background: #fef3c7;
      color: #92400e;
    }

    .status-final {
      background: #e5e7eb;
      color: #374151;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .team {
      text-align: center;
    }

    .team-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin-bottom: 5px;
    }

    .team-name {
      font-weight: bold;
      font-size: 15px;
    }

    .team-abbr {
      color: #6b7280;
      font-size: 12px;
      margin-top: 3px;
    }

    .vs {
      text-align: center;
      color: #6b7280;
      font-weight: bold;
    }

    /* =========================
       區塊
    ========================= */

    .section {
      border-top: 1px solid #e5e7eb;
      padding-top: 13px;
      margin-top: 13px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 9px;
      font-size: 14px;
    }

    /* =========================
       投手
    ========================= */

    .pitchers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pitcher-box {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px;
    }

    .pitcher-label {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .pitcher-name {
      font-weight: bold;
      font-size: 14px;
    }

    /* =========================
       棒次
    ========================= */

    .lineups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lineup-team {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px;
    }

    .lineup-team-title {
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .batter {
      display: flex;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 12px;
    }

    .batter:last-child {
      border-bottom: none;
    }

    .batter-order {
      width: 25px;
      color: #6b7280;
    }

    .batter-name {
      flex: 1;
      font-weight: 500;
    }

    .batter-position {
      color: #6b7280;
      font-size: 11px;
    }

    /* =========================
       完整度
    ========================= */

    .completeness {
      margin-top: 10px;
    }

    .progress-bg {
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 10px;
      background: #16a34a;
      transition: width 0.3s;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 12px;
    }

    /* =========================
       預測狀態
    ========================= */

    .prediction-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }

    .not-ready {
      background: #fee2e2;
      color: #991b1b;
    }

    .early {
      background: #fef3c7;
      color: #92400e;
    }

    .ready {
      background: #dcfce7;
      color: #166534;
    }

    .excellent {
      background: #dbeafe;
      color: #1e40af;
    }

    /* =========================
       賽季
    ========================= */

    .season-box {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .season-stage {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .note {
      color: #6b7280;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 6px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .score-box {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* =========================
       手機
    ========================= */

    @media (max-width: 600px) {

      .games {
        grid-template-columns: 1fr;
      }

      .teams {
        grid-template-columns: 1fr 45px 1fr;
      }

      .team-logo {
        width: 48px;
        height: 48px;
      }

      .lineups {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>⚾ MLB 比賽分析系統</h1>

  <p>
    2026 Season · 今日 / 歷史 / 未來賽事分析
  </p>

</header>


<div class="container">


  <!-- =========================
       日期
  ========================== -->

  <div class="date-panel">

    <div class="date-title">
      📅 選擇分析日期
    </div>

    <div class="date-controls">

      <button
        class="date-btn"
        onclick="changeDate(-1)"
      >
        ← 前一天
      </button>

      <button
        class="date-btn today-btn"
        onclick="goToday()"
      >
        今天
      </button>

      <button
        class="date-btn"
        onclick="changeDate(1)"
      >
        下一天 →
      </button>

      <input
        type="date"
        id="dateInput"
        class="date-input"
        onchange="selectDate(this.value)"
      >

    </div>

    <div
      class="selected-date"
      id="selectedDate"
    ></div>

  </div>


  <!-- =========================
       基本資訊
  ========================== -->

  <div class="top-info">

    <div class="info-box">

      <div class="info-title">
        賽季
      </div>

      <div class="info-value">
        2026 MLB
      </div>

    </div>


    <div class="info-box">

      <div class="info-title">
        賽季階段
      </div>

      <div
        class="info-value"
        id="seasonStage"
      >
        -
      </div>

    </div>


    <div class="info-box">

      <div class="info-title">
        比賽數
      </div>

      <div
        class="info-value"
        id="gameCount"
      >
        -
      </div>

    </div>

  </div>


  <!-- =========================
       比賽狀態
  ========================== -->

  <div
    class="status-summary"
    id="statusSummary"
  >
  </div>


  <div id="error"></div>


  <!-- =========================
       比賽
  ========================== -->

  <div
    id="games"
    class="games"
  >

    <div class="loading">
      正在讀取 MLB 官方資料...
    </div>

  </div>


</div>


<script>

const MLB_API =
  "https://statsapi.mlb.com/api/v1";


/* =========================================================
   日期
========================================================= */

let selectedDate =
  new Date();


function dateToString(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function stringToDate(dateString) {

  const parts =
    dateString.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


/* =========================================================
   初始化日期
========================================================= */

function initializeDate() {

  const dateString =
    dateToString(selectedDate);

  document.getElementById(
    "dateInput"
  ).value = dateString;

  updateDateDisplay();

}


/* =========================================================
   日期顯示
========================================================= */

function updateDateDisplay() {

  const dateString =
    dateToString(selectedDate);

  document.getElementById(
    "selectedDate"
  ).textContent =
    dateString;

  document.getElementById(
    "dateInput"
  ).value =
    dateString;

}


/* =========================================================
   前一天 / 下一天
========================================================= */

function changeDate(days) {

  selectedDate.setDate(
    selectedDate.getDate() + days
  );

  updateDateDisplay();

  loadGames();

}


/* =========================================================
   今天
========================================================= */

function goToday() {

  selectedDate =
    new Date();

  updateDateDisplay();

  loadGames();

}


/* =========================================================
   日期選擇器
========================================================= */

function selectDate(value) {

  if (!value) {
    return;
  }

  selectedDate =
    stringToDate(value);

  updateDateDisplay();

  loadGames();

}


/* =========================================================
   API
========================================================= */

async function getJSON(url) {

  const response =
    await fetch(url);

  if (!response.ok) {

    throw new Error(
      "API 讀取失敗：" +
      response.status
    );

  }

  return await response.json();

}


/* =========================================================
   球隊 Logo
========================================================= */

function getTeamLogo(teamId) {

  return `
    https://www.mlbstatic.com/team-logos/${teamId}.svg
  `;

}


/* =========================================================
   比賽狀態
========================================================= */

function getGameType(game) {

  const state =
    game.status?.abstractGameState;

  if (state === "Preview") {
    return "preview";
  }

  if (state === "Live") {
    return "live";
  }

  if (state === "Final") {
    return "final";
  }

  return "other";

}


function getStatusText(game) {

  const state =
    game.status?.abstractGameState;

  if (state === "Preview") {
    return "🟢 尚未開打";
  }

  if (state === "Live") {
    return "🟡 比賽進行中";
  }

  if (state === "Final") {
    return "⚫ 比賽結束";
  }

  return game.status?.detailedState || "未知";

}


/* =========================================================
   狀態 CSS
========================================================= */

function getStatusClass(game) {

  const type =
    getGameType(game);

  if (type === "preview") {
    return "status-preview";
  }

  if (type === "live") {
    return "status-live";
  }

  if (type === "final") {
    return "status-final";
  }

  return "";

}


/* =========================================================
   比賽時間
========================================================= */

function formatGameTime(gameDate) {

  const date =
    new Date(gameDate);

  return date.toLocaleTimeString(
    "zh-TW",
    {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  );

}


/* =========================================================
   賽季階段
========================================================= */

function getSeasonStage() {

  const month =
    selectedDate.getMonth() + 1;

  if (month <= 4) {
    return "賽季初期";
  }

  if (month <= 6) {
    return "賽季前中段";
  }

  if (month <= 8) {
    return "賽季中後段";
  }

  if (month <= 9) {
    return "賽季末段";
  }

  return "季後賽階段";

}


/* =========================================================
   先發投手
========================================================= */

function getProbablePitcher(
  gameData,
  side
) {

  if (
    gameData?.gameData?.probablePitchers?.[side]
  ) {

    return gameData
      .gameData
      .probablePitchers[side];

  }

  return null;

}


/* =========================================================
   棒次
========================================================= */

function getBattingOrder(
  gameData,
  side
) {

  try {

    const boxscore =
      gameData
        ?.liveData
        ?.boxscore
        ?.teams
        ?.[side];

    if (!boxscore) {
      return [];
    }

    if (!boxscore.battingOrder) {
      return [];
    }

    const players =
      boxscore.players || {};

    return boxscore
      .battingOrder
      .map(playerId => {

        const player =
          players["ID" + playerId];

        if (!player) {
          return null;
        }

        return {

          name:
            player.person?.fullName ||
            "未知球員",

          position:
            player.position?.abbreviation ||
            ""

        };

      })
      .filter(Boolean);

  } catch (error) {

    console.log(
      "棒次讀取失敗",
      error
    );

    return [];

  }

}


/* =========================================================
   資料完整度
========================================================= */

function calculateCompleteness(
  gameData,
  awayLineup,
  homeLineup
) {

  let score = 0;


  /*
    先發投手
    20%
  */

  const awayPitcher =
    getProbablePitcher(
      gameData,
      "away"
    );

  const homePitcher =
    getProbablePitcher(
      gameData,
      "home"
    );

  if (awayPitcher) {
    score += 10;
  }

  if (homePitcher) {
    score += 10;
  }


  /*
    棒次
    50%
  */

  score +=
    Math.min(
      awayLineup.length,
      9
    ) / 9 * 25;

  score +=
    Math.min(
      homeLineup.length,
      9
    ) / 9 * 25;


  /*
    球場
    5%
  */

  if (
    gameData
      ?.gameData
      ?.venue
  ) {

    score += 5;

  }


  /*
    時間資料
    5%
  */

  if (
    gameData
      ?.gameData
      ?.datetime
  ) {

    score += 5;

  }


  /*
    目前版本最高 100%
  */

  return Math.min(
    100,
    Math.round(score)
  );

}


/* =========================================================
   完整度判斷
========================================================= */

function getCompletenessInfo(score) {

  if (score < 70) {

    return {
      text:
        "🔴 資料不足，目前不進行正式預測",
      className:
        "not-ready"
    };

  }


  if (score < 80) {

    return {
      text:
        "🟡 初步分析，等待更多資料",
      className:
        "early"
    };

  }


  if (score < 90) {

    return {
      text:
        "🟢 已達正式預測門檻",
      className:
        "ready"
    };

  }


  if (score < 100) {

    return {
      text:
        "🟢 高完整度，可以進行預測",
      className:
        "ready"
    };

  }


  return {
    text:
      "⭐ 完整資料，可以進行 Final Prediction",
    className:
      "excellent"
  };

}


/* =========================================================
   棒次顯示
========================================================= */

function renderLineup(
  lineup
) {

  if (
    !lineup ||
    lineup.length === 0
  ) {

    return `
      <div class="note">
        尚未公布官方先發打線
      </div>
    `;

  }


  return lineup
    .slice(0, 9)
    .map(
      (player, index) => {

        return `

          <div class="batter">

            <div class="batter-order">
              ${index + 1}
            </div>

            <div class="batter-name">
              ${player.name}
            </div>

            <div class="batter-position">
              ${player.position}
            </div>

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   賽後比分
========================================================= */

function renderScore(
  game
) {

  const type =
    getGameType(game);

  if (
    type !== "final" &&
    type !== "live"
  ) {

    return "";

  }


  const awayScore =
    game.teams?.away?.score;

  const homeScore =
    game.teams?.home?.score;


  if (
    awayScore === undefined ||
    homeScore === undefined
  ) {

    return "";

  }


  return `

    <div class="section">

      <div class="section-title">
        ${type === "live"
          ? "📺 目前比分"
          : "🏁 最終比分"}
      </div>

      <div class="score-box">
        ${awayScore}
        -
        ${homeScore}
      </div>

    </div>

  `;

}


/* =========================================================
   建立比賽卡片
========================================================= */

function renderGame(
  game,
  gameData
) {

  const away =
    game.teams.away.team;

  const home =
    game.teams.home.team;


  const awayLineup =
    getBattingOrder(
      gameData,
      "away"
    );

  const homeLineup =
    getBattingOrder(
      gameData,
      "home"
    );


  const awayPitcher =
    getProbablePitcher(
      gameData,
      "away"
    );

  const homePitcher =
    getProbablePitcher(
      gameData,
      "home"
    );


  const completeness =
    calculateCompleteness(
      gameData,
      awayLineup,
      homeLineup
    );


  const completenessInfo =
    getCompletenessInfo(
      completeness
    );


  const venue =
    gameData
      ?.gameData
      ?.venue
      ?.name ||
    game.venue?.name ||
    "未知球場";


  const gameType =
    getGameType(game);


  /*
    已結束的比賽
    不再顯示「預測中」
  */

  let predictionMessage =
    completenessInfo.text;


  if (gameType === "final") {

    predictionMessage =
      "⚫ 比賽已結束，下一階段將比對預測與實際結果";

  }


  if (gameType === "live") {

    predictionMessage =
      "🟡 比賽進行中，賽前預測保持鎖定";

  }


  return `

    <div class="game-card">


      <!-- 頂部 -->

      <div class="game-header">

        <div class="game-time">
          ${formatGameTime(game.gameDate)}
        </div>

        <div
          class="status ${getStatusClass(game)}"
        >
          ${getStatusText(game)}
        </div>

      </div>


      <!-- 球隊 -->

      <div class="teams">


        <div class="team">

          <img
            class="team-logo"
            src="${getTeamLogo(away.id)}"
            alt="${away.name}"
            onerror="this.style.display='none'"
          >

          <div class="team-name">
            ${away.name}
          </div>

          <div class="team-abbr">
            ${away.abbreviation || ""}
          </div>

        </div>


        <div class="vs">
          @
        </div>


        <div class="team">

          <img
            class="team-logo"
            src="${getTeamLogo(home.id)}"
            alt="${home.name}"
            onerror="this.style.display='none'"
          >

          <div class="team-name">
            ${home.name}
          </div>

          <div class="team-abbr">
            ${home.abbreviation || ""}
          </div>

        </div>


      </div>


      ${renderScore(game)}


      <!-- 投手 -->

      <div class="section">

        <div class="section-title">
          🧑‍⚾ 預計先發投手
        </div>


        <div class="pitchers">


          <div class="pitcher-box">

            <div class="pitcher-label">
              ${away.name}
            </div>

            <div class="pitcher-name">

              ${
                awayPitcher
                  ? awayPitcher.fullName
                  : "尚未公布"
              }

            </div>

          </div>


          <div class="pitcher-box">

            <div class="pitcher-label">
              ${home.name}
            </div>

            <div class="pitcher-name">

              ${
                homePitcher
                  ? homePitcher.fullName
                  : "尚未公布"
              }

            </div>

          </div>


        </div>

      </div>


      <!-- 棒次 -->

      <div class="section">

        <div class="section-title">
          📋 先發打線
        </div>


        <div class="lineups">


          <div class="lineup-team">

            <div class="lineup-team-title">
              ${away.name}
            </div>

            ${renderLineup(awayLineup)}

          </div>


          <div class="lineup-team">

            <div class="lineup-team-title">
              ${home.name}
            </div>

            ${renderLineup(homeLineup)}

          </div>


        </div>

      </div>


      <!-- 賽季 -->

      <div class="section">

        <div class="section-title">
          🗓️ 賽季狀態
        </div>


        <div class="season-box">

          <div class="season-stage">
            2026 MLB · ${getSeasonStage()}
          </div>

          <div>
            球場：${venue}
          </div>

          <div class="note">
            後續會加入實際賽季進度、
            季後賽排名與季後賽壓力。
          </div>

        </div>

      </div>


      <!-- 資料完整度 -->

      <div class="section">

        <div class="section-title">
          🧠 預測資料完整度
        </div>


        <div class="completeness">

          <div class="progress-bg">

            <div
              class="progress-bar"
              style="width:${completeness}%"
            ></div>

          </div>


          <div class="progress-text">

            <span>
              ${completeness}%
            </span>

            <span>

              ${
                completeness >= 80
                  ? "已達預測門檻"
                  : "等待資料"
              }

            </span>

          </div>

        </div>


        <div
          class="prediction-status ${completenessInfo.className}"
        >

          ${predictionMessage}

        </div>


        <div class="note">

          正式預測門檻：
          資料完整度至少 80%。

          後續完整模型還會加入：

          球隊戰績、近10場、
          主客場、先發投手、
          打者近期狀態、牛棚、
          傷兵、H2H、
          賽季／季後賽情勢、
          天氣、球場、
          PlaySport、
          台灣運彩盤口。

        </div>

      </div>


      <!-- 近期打擊 -->

      <div class="section">

        <div class="section-title">
          📈 打者近期狀態
        </div>

        <div class="note">

          下一階段接入 MLB 官方球員近期打擊資料。

          預計分析：

          Last 5、Last 10、
          AVG、OBP、SLG、OPS、
          HR、BB、K、
          對 RHP / LHP 拆分。

        </div>

      </div>


    </div>

  `;

}


/* =========================================================
   狀態統計
========================================================= */

function renderStatusSummary(
  games
) {

  let preview = 0;
  let live = 0;
  let final = 0;


  games.forEach(game => {

    const type =
      getGameType(game);

    if (type === "preview") {
      preview++;
    }

    else if (type === "live") {
      live++;
    }

    else if (type === "final") {
      final++;
    }

  });


  document.getElementById(
    "statusSummary"
  ).innerHTML = `

    <div class="status-chip">
      🟢 尚未開打：${preview}
    </div>

    <div class="status-chip">
      🟡 進行中：${live}
    </div>

    <div class="status-chip">
      ⚫ 已結束：${final}
    </div>

  `;

}


/* =========================================================
   讀取比賽
========================================================= */

async function loadGames() {

  const gamesContainer =
    document.getElementById("games");

  const errorContainer =
    document.getElementById("error");


  gamesContainer.innerHTML = `

    <div class="loading">
      正在讀取 MLB 官方資料...
    </div>

  `;

  errorContainer.innerHTML = "";


  document.getElementById(
    "seasonStage"
  ).textContent =
    getSeasonStage();


  const dateString =
    dateToString(selectedDate);


  try {

    /*
      Schedule
    */

    const scheduleURL =
      `${MLB_API}/schedule` +
      `?sportId=1` +
      `&date=${dateString}` +
      `&hydrate=team,probablePitcher`;


    const schedule =
      await getJSON(scheduleURL);


    const games =
      schedule
        .dates?.[0]
        ?.games || [];


    document.getElementById(
      "gameCount"
    ).textContent =
      games.length;


    renderStatusSummary(
      games
    );


    if (games.length === 0) {

      gamesContainer.innerHTML = `

        <div class="loading">

          📭 ${dateString}
          沒有找到 MLB 比賽資料。

        </div>

      `;

      return;

    }


    /*
      逐場讀取 Game Feed
    */

    const cards = [];


    /*
      一次最多同時讀取幾場
      避免瀏覽器一次打太多 API
    */

    for (
      const game of games
    ) {

      try {

        const feedURL =
          `${MLB_API}/game/${game.gamePk}/feed/live`;


        const gameData =
          await getJSON(feedURL);


        cards.push(
          renderGame(
            game,
            gameData
          )
        );


      } catch (error) {

        console.log(
          "Game Feed 失敗：",
          game.gamePk,
          error
        );


        /*
          Feed 失敗時
          至少保留比賽資料
        */

        cards.push(
          renderGame(
            game,
            {
              gameData: {},
              liveData: {}
            }
          )
        );

      }

    }


    gamesContainer.innerHTML =
      cards.join("");


  } catch (error) {

    console.error(error);


    errorContainer.innerHTML = `

      <div class="error">

        ⚠️ MLB 官方資料讀取失敗。

        <br><br>

        請稍後重新整理。

        <br><br>

        錯誤：
        ${error.message}

      </div>

    `;


    gamesContainer.innerHTML = "";

  }

}


/* =========================================================
   啟動
========================================================= */

initializeDate();

loadGames();

</script>
